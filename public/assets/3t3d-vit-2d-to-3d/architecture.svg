<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#cf7f54" fill-opacity="0.8"/>
    </marker>
  </defs>
  <rect width="1200" height="440" fill="#0b0d0f"/>

  <!-- Title -->
  <text x="48" y="46" fill="#cf7f54" font-size="16" letter-spacing="3">3T3D · SKETCH-TO-3D VISION TRANSFORMER</text>
  <text x="48" y="70" fill="#7e828a" font-size="12.5">Three orthographic sketches become a 3D building mesh in a single forward pass.</text>

  <!-- Row of nodes, top-to-... left-to-right single axis, centered vertically ~y=210 -->

  <!-- 1: Input views -->
  <rect x="48" y="150" width="150" height="120" rx="6" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
  <text x="123" y="200" fill="#e8eaed" font-size="14" text-anchor="middle">3 SKETCHES</text>
  <text x="123" y="224" fill="#a8acb1" font-size="10.5" text-anchor="middle">plan + 2 elevations</text>

  <!-- 2: DINOv2 encoder (frozen — teal category hue) -->
  <rect x="246" y="150" width="164" height="120" rx="6" fill="#12161a" stroke="#5fa0a6" stroke-opacity="0.85"/>
  <text x="328" y="200" fill="#e8eaed" font-size="14" text-anchor="middle">DINOv2 ENCODER</text>
  <text x="328" y="224" fill="#5fa0a6" font-size="10.5" text-anchor="middle">frozen ViT</text>

  <!-- 3: Fusion -->
  <rect x="458" y="150" width="150" height="120" rx="6" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
  <text x="533" y="200" fill="#e8eaed" font-size="14" text-anchor="middle">FUSION</text>
  <text x="533" y="224" fill="#a8acb1" font-size="10.5" text-anchor="middle">merge the 3 views</text>

  <!-- 4: Decoder -->
  <rect x="656" y="150" width="164" height="120" rx="6" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
  <text x="738" y="200" fill="#e8eaed" font-size="14" text-anchor="middle">DECODER</text>
  <text x="738" y="224" fill="#a8acb1" font-size="10.5" text-anchor="middle">custom transformer</text>

  <!-- 5: Predicted triplane (FOCAL) -->
  <rect x="868" y="150" width="164" height="120" rx="6" fill="#1a130e" stroke="#cf7f54" stroke-width="1.6"/>
  <text x="950" y="200" fill="#cf7f54" font-size="14" text-anchor="middle">TRIPLANE</text>
  <text x="950" y="224" fill="#a8acb1" font-size="10.5" text-anchor="middle">predicted 3D field</text>

  <!-- forward arrows row -->
  <g stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" fill="none">
    <line x1="198" y1="210" x2="246" y2="210" marker-end="url(#ar)"/>
    <line x1="410" y1="210" x2="458" y2="210" marker-end="url(#ar)"/>
    <line x1="608" y1="210" x2="656" y2="210" marker-end="url(#ar)"/>
    <line x1="820" y1="210" x2="868" y2="210" marker-end="url(#ar)"/>
  </g>

  <!-- 6: Marching Cubes -->
  <rect x="868" y="316" width="164" height="86" rx="6" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
  <text x="950" y="352" fill="#e8eaed" font-size="14" text-anchor="middle">MARCHING CUBES</text>
  <text x="950" y="374" fill="#a8acb1" font-size="10.5" text-anchor="middle">iso-surface extraction</text>

  <!-- 7: 3D mesh output -->
  <rect x="656" y="316" width="164" height="86" rx="6" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
  <text x="738" y="352" fill="#e8eaed" font-size="14" text-anchor="middle">3D MESH</text>
  <text x="738" y="374" fill="#a8acb1" font-size="10.5" text-anchor="middle">building massing</text>

  <!-- arrows: triplane down to marching cubes, then left to mesh -->
  <g stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" fill="none">
    <line x1="950" y1="270" x2="950" y2="316" marker-end="url(#ar)"/>
    <line x1="868" y1="359" x2="820" y2="359" marker-end="url(#ar)"/>
  </g>

  <!-- frozen legend -->
  <rect x="48" y="356" width="16" height="12" rx="2" fill="none" stroke="#5fa0a6" stroke-opacity="0.85"/>
  <text x="74" y="366" fill="#7e828a" font-size="11">teal = frozen (pretrained); all other stages are trained</text>
</svg>
