<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <marker id="tt-a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#cf7f54" fill-opacity="0.85"/>
    </marker>
  </defs>
  <rect width="1240" height="760" fill="#0b0d0f"/>
  <text x="60" y="50" fill="#cf7f54" font-size="20" letter-spacing="3">3T3D — ARCHITECTURE</text>
  <text x="60" y="76" fill="#7e828a" font-size="14">Three orthographic sketches → 3D triplane · frozen DINOv2 + custom transformer decoder</text>

  <!-- model pipeline -->
  <text x="60" y="128" fill="#7e828a" font-size="13" letter-spacing="3">MODEL PIPELINE</text>
  <g font-size="14">
    <rect x="60" y="150" width="200" height="82" rx="4" fill="#12161a" stroke="#5fa0a6" stroke-opacity="0.8"/><text x="78" y="184" fill="#e8eaed">3 SKETCHES</text><text x="78" y="208" fill="#7e828a" font-size="12">top/side/front · 512² · concat</text>
    <rect x="300" y="150" width="200" height="82" rx="4" fill="#12161a" stroke="#9b6fc9" stroke-opacity="0.8"/><text x="318" y="184" fill="#e8eaed">DINOv2 (frozen)</text><text x="318" y="208" fill="#7e828a" font-size="12">patch tokens per view</text>
    <rect x="540" y="150" width="200" height="82" rx="4" fill="#12161a" stroke="#d49b50" stroke-opacity="0.8"/><text x="558" y="184" fill="#e8eaed">FUSION</text><text x="558" y="208" fill="#7e828a" font-size="12">sum same-location patches</text>
    <rect x="780" y="150" width="200" height="82" rx="4" fill="#1a130e" stroke="#cf7f54" stroke-width="2"/><text x="798" y="184" fill="#cf7f54">DECODER</text><text x="798" y="208" fill="#7e828a" font-size="12">transformer · 6 layers × 8 heads</text>
    <rect x="1020" y="150" width="160" height="82" rx="4" fill="#12161a" stroke="#7aa15c" stroke-opacity="0.8"/><text x="1038" y="184" fill="#e8eaed">TRIPLANE</text><text x="1038" y="208" fill="#7e828a" font-size="12">R¹⁶→R¹²⁸ upsample</text>
  </g>
  <g stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" fill="none">
    <line x1="260" y1="191" x2="300" y2="191" marker-end="url(#tt-a)"/>
    <line x1="500" y1="191" x2="540" y2="191" marker-end="url(#tt-a)"/>
    <line x1="740" y1="191" x2="780" y2="191" marker-end="url(#tt-a)"/>
    <line x1="980" y1="191" x2="1020" y2="191" marker-end="url(#tt-a)"/>
  </g>

  <!-- dataset pipeline -->
  <text x="60" y="300" fill="#7e828a" font-size="13" letter-spacing="3">CUSTOM DATASET PIPELINE (built from scratch — none existed)</text>
  <g font-size="13.5">
    <rect x="60" y="322" width="200" height="76" rx="4" fill="#12161a" stroke="#5e636b" stroke-opacity="0.8"/><text x="78" y="352" fill="#e8eaed">gen renderings</text><text x="78" y="374" fill="#7e828a" font-size="12">programmatic architecture</text>
    <rect x="300" y="322" width="200" height="76" rx="4" fill="#12161a" stroke="#5e636b" stroke-opacity="0.8"/><text x="318" y="352" fill="#e8eaed">TripoSR</text><text x="318" y="374" fill="#7e828a" font-size="12">rendering → 3D model</text>
    <rect x="540" y="322" width="200" height="76" rx="4" fill="#12161a" stroke="#5e636b" stroke-opacity="0.8"/><text x="558" y="352" fill="#e8eaed">multi-view render</text><text x="558" y="374" fill="#7e828a" font-size="12">top / front / side</text>
    <rect x="780" y="322" width="200" height="76" rx="4" fill="#12161a" stroke="#5e636b" stroke-opacity="0.8"/><text x="798" y="352" fill="#e8eaed">Informative Drawings</text><text x="798" y="374" fill="#7e828a" font-size="12">→ line sketches</text>
    <rect x="1020" y="322" width="160" height="76" rx="4" fill="#12161a" stroke="#7aa15c" stroke-opacity="0.8"/><text x="1038" y="352" fill="#e8eaed">triplets</text><text x="1038" y="374" fill="#7e828a" font-size="12">3 sketches + .obj</text>
  </g>
  <g stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" fill="none">
    <line x1="260" y1="360" x2="300" y2="360" marker-end="url(#tt-a)"/>
    <line x1="500" y1="360" x2="540" y2="360" marker-end="url(#tt-a)"/>
    <line x1="740" y1="360" x2="780" y2="360" marker-end="url(#tt-a)"/>
    <line x1="980" y1="360" x2="1020" y2="360" marker-end="url(#tt-a)"/>
  </g>

  <!-- training + role -->
  <text x="60" y="466" fill="#7e828a" font-size="13" letter-spacing="3">TRAINING</text>
  <g font-size="14">
    <rect x="60" y="488" width="540" height="70" rx="4" fill="#101418" stroke="#5e636b" stroke-opacity="0.6"/><text x="80" y="516" fill="#e8eaed">L1 triplane loss · 2-stage (freeze decoder-only → unfreeze all)</text><text x="80" y="540" fill="#7e828a" font-size="12">37 epochs on A100 · ~480 s/epoch · Weights &amp; Biases</text>
    <rect x="620" y="488" width="560" height="70" rx="4" fill="#101418" stroke="#5e636b" stroke-opacity="0.6"/><text x="640" y="516" fill="#e8eaed">My role (flat team of 4)</text><text x="640" y="540" fill="#7e828a" font-size="12">dataset provisioning/management · lit review · experiment tracking · writeup</text>
  </g>
  <text x="60" y="606" fill="#7e828a" font-size="12">CMU 11-685 Introduction to Deep Learning · Spring 2025.</text>
</svg>
