<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <marker id="sf-a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#cf7f54" fill-opacity="0.85"/>
    </marker>
  </defs>
  <rect width="1200" height="900" fill="#0b0d0f"/>

  <!-- faint grid -->
  <g stroke="#5e636b" stroke-opacity="0.10" stroke-width="1">
    <line x1="0" y1="225" x2="1200" y2="225"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="675" x2="1200" y2="675"/>
  </g>

  <text x="60" y="50" fill="#cf7f54" font-size="17" letter-spacing="3">SPECTRAL FACADES — REAL-TIME PROJECTION LOOP</text>
  <text x="60" y="74" fill="#7e828a" font-size="13">TouchDesigner 2023.12 · webcam → MediaPipe → StreamDiffusion (sd-turbo) → camSchnappr projection onto a paper cube · closed feedback loop</text>

  <!-- ===================== LANE 1 : SENSE ===================== -->
  <text x="60" y="128" fill="#7e828a" font-size="13" letter-spacing="3">1 · SENSE  —  MEDIAPIPE TRACKING (TouchDesigner CHOPs)</text>

  <!-- webcam source -->
  <rect x="60" y="146" width="150" height="184" rx="6" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
  <text x="80" y="176" fill="#e8eaed" font-size="14">WEBCAM</text>
  <text x="80" y="198" fill="#7e828a" font-size="11">live video in</text>
  <text x="80" y="220" fill="#7e828a" font-size="11">→ MediaPipe</text>
  <text x="80" y="242" fill="#7e828a" font-size="11">TD component</text>

  <!-- four tracker nodes -->
  <g font-size="13">
    <rect x="258" y="146" width="252" height="40" rx="4" fill="#12161a" stroke="#5fa0a6" stroke-opacity="0.8"/>
    <text x="276" y="171" fill="#e8eaed">face_tracking</text>
    <text x="430" y="171" fill="#7e828a" font-size="11">nose tip Y</text>

    <rect x="258" y="194" width="252" height="40" rx="4" fill="#12161a" stroke="#5fa0a6" stroke-opacity="0.8"/>
    <text x="276" y="219" fill="#e8eaed">hand_tracking</text>
    <text x="405" y="219" fill="#7e828a" font-size="11">open / closed / pinch</text>

    <rect x="258" y="242" width="252" height="40" rx="4" fill="#12161a" stroke="#5fa0a6" stroke-opacity="0.8"/>
    <text x="276" y="267" fill="#e8eaed">pose_tracking</text>
    <text x="405" y="267" fill="#7e828a" font-size="11">wrist L / R</text>

    <rect x="258" y="290" width="252" height="40" rx="4" fill="#12161a" stroke="#5fa0a6" stroke-opacity="0.8"/>
    <text x="276" y="315" fill="#e8eaed">face_detector</text>
    <text x="405" y="315" fill="#7e828a" font-size="11">p1..p4 head pos</text>
  </g>

  <!-- select/math extraction -->
  <rect x="558" y="146" width="252" height="184" rx="6" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
  <text x="578" y="174" fill="#e8eaed" font-size="14">select + math CHOPs</text>
  <g font-size="11" fill="#7e828a">
    <text x="578" y="200">select5  → h1:pinch</text>
    <text x="578" y="220">select4  → h1/h2:open_pv</text>
    <text x="578" y="240">select6  → h1/h2:Closed</text>
    <text x="578" y="260">select7/8 → left/right wrist</text>
    <text x="578" y="280">select10 → p1_nose_ty</text>
    <text x="578" y="300">math5 → Open_Palm flag</text>
  </g>

  <!-- control values panel -->
  <rect x="858" y="146" width="282" height="184" rx="6" fill="#1a130e" stroke="#cf7f54" stroke-width="1.5"/>
  <text x="878" y="174" fill="#cf7f54" font-size="14">CONTROL SIGNALS</text>
  <g font-size="12" fill="#d8dadd">
    <text x="878" y="204">nose Y  →  prompt interpolation t</text>
  </g>
  <g font-size="11" fill="#7e828a">
    <text x="878" y="226">(modern &#8596; decayed blend)</text>
    <text x="878" y="256" fill="#d8dadd" font-size="12">palm state  →  prompt strength</text>
    <text x="878" y="278">open = faithful to input</text>
    <text x="878" y="298">closed = pushes synthesis / more steps</text>
  </g>

  <!-- lane 1 arrows -->
  <g stroke="#cf7f54" stroke-opacity="0.45" stroke-width="1.6" fill="none">
    <line x1="210" y1="238" x2="256" y2="166" marker-end="url(#sf-a)"/>
    <line x1="210" y1="238" x2="256" y2="214" marker-end="url(#sf-a)"/>
    <line x1="210" y1="238" x2="256" y2="262" marker-end="url(#sf-a)"/>
    <line x1="210" y1="238" x2="256" y2="310" marker-end="url(#sf-a)"/>
    <line x1="510" y1="238" x2="556" y2="238" marker-end="url(#sf-a)"/>
    <line x1="810" y1="238" x2="856" y2="238" marker-end="url(#sf-a)"/>
  </g>

  <!-- ===================== LANE 2 : GENERATE ===================== -->
  <text x="60" y="386" fill="#7e828a" font-size="13" letter-spacing="3">2 · GENERATE  —  STREAMDIFFUSION (real-time img2img, no training)</text>

  <!-- input texture -->
  <rect x="60" y="404" width="230" height="150" rx="6" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
  <text x="80" y="432" fill="#e8eaed" font-size="14">INPUT TEXTURE</text>
  <g font-size="11" fill="#7e828a">
    <text x="80" y="458">~9 meme clips composited</text>
    <text x="80" y="478">(moviefilein → fit →</text>
    <text x="80" y="498">transform → comp8)</text>
    <text x="80" y="522" fill="#a8acb1">+ basic facade texture</text>
    <text x="80" y="542">→ 512 × 512 img2img seed</text>
  </g>

  <!-- weighted prompts -->
  <rect x="338" y="404" width="360" height="150" rx="6" fill="#12161a" stroke="#9b6fc9" stroke-opacity="0.85"/>
  <text x="358" y="432" fill="#e8eaed" font-size="14">WEIGHTED PROMPT BLOCKS</text>
  <g font-size="11.5">
    <text x="358" y="460" fill="#a8acb1">P0  "facade eclectic dead disgusting</text>
    <text x="374" y="478" fill="#a8acb1">rotted..."</text>
    <text x="600" y="460" fill="#cf7f54">w 0.52</text>
    <text x="358" y="506" fill="#a8acb1">P1  "walden 7 ricardo bofill"</text>
    <text x="600" y="506" fill="#cf7f54">w 0.58</text>
  </g>
  <text x="358" y="534" fill="#7e828a" font-size="11">slerp interpolation · normalize weights · total 1</text>

  <!-- diffusion engine -->
  <rect x="746" y="404" width="394" height="150" rx="6" fill="#1a130e" stroke="#cf7f54" stroke-width="1.5"/>
  <text x="766" y="432" fill="#cf7f54" font-size="14">StreamDiffusionTD  (StreamDiffusion in TD)</text>
  <g font-size="12" fill="#7e828a">
    <text x="766" y="458">model  stabilityai/sd-turbo</text>
    <text x="766" y="480">step 10 · guidance 1 · delta 1 · seed 351293</text>
    <text x="766" y="502">512 × 512 · GPU real-time img2img</text>
    <text x="766" y="524" fill="#d8dadd">output: synthesized facade frame</text>
  </g>

  <!-- lane 2 arrows -->
  <g stroke="#cf7f54" stroke-opacity="0.45" stroke-width="1.6" fill="none">
    <line x1="290" y1="479" x2="336" y2="479" marker-end="url(#sf-a)"/>
    <line x1="698" y1="479" x2="744" y2="479" marker-end="url(#sf-a)"/>
  </g>
  <!-- control signals feed into generation (from lane 1) -->
  <g stroke="#cf7f54" stroke-opacity="0.35" stroke-width="1.4" fill="none" stroke-dasharray="5 4">
    <path d="M999 330 C 999 360, 560 360, 518 402" marker-end="url(#sf-a)"/>
    <path d="M999 330 C 999 372, 940 384, 940 402" marker-end="url(#sf-a)"/>
  </g>
  <text x="600" y="352" fill="#7e828a" font-size="10.5">control signals modulate prompt weights + step count each frame</text>

  <!-- ===================== LANE 3 : PROJECT ===================== -->
  <text x="60" y="610" fill="#7e828a" font-size="13" letter-spacing="3">3 · PROJECT  —  MAP ONTO PHYSICAL SURFACE (camSchnappr)</text>

  <rect x="60" y="628" width="300" height="150" rx="6" fill="#12161a" stroke="#7aa15c" stroke-opacity="0.85"/>
  <text x="80" y="656" fill="#e8eaed" font-size="14">MAP TO GEO</text>
  <g font-size="11.5" fill="#7e828a">
    <text x="80" y="682">papercube.fbx unfolded net</text>
    <text x="80" y="702">(Cube.pdf → fold physical model)</text>
    <text x="80" y="724" fill="#a8acb1">Geo SOP  papercube1/mesh</text>
    <text x="80" y="744">synth frame → surface texture</text>
  </g>

  <rect x="408" y="628" width="300" height="150" rx="6" fill="#12161a" stroke="#7aa15c" stroke-opacity="0.85"/>
  <text x="428" y="656" fill="#e8eaed" font-size="14">camSchnappr CALIBRATE</text>
  <g font-size="11.5" fill="#7e828a">
    <text x="428" y="682">projector-to-cube alignment</text>
    <text x="428" y="702">calibration error 1.19</text>
    <text x="428" y="724">projector 1280 × 720</text>
    <text x="428" y="744">show wireframe · guides</text>
  </g>

  <rect x="756" y="628" width="384" height="150" rx="6" fill="#1a130e" stroke="#cf7f54" stroke-width="1.5"/>
  <text x="776" y="656" fill="#cf7f54" font-size="14">PROJECTED INSTALLATION</text>
  <g font-size="11.5" fill="#7e828a">
    <text x="776" y="682">image projected onto folded paper cube</text>
    <text x="776" y="702">generative audio layer tracks palm state</text>
    <text x="776" y="724" fill="#d8dadd">viewer sees facade morph in real time</text>
  </g>

  <!-- lane 3 arrows -->
  <g stroke="#cf7f54" stroke-opacity="0.45" stroke-width="1.6" fill="none">
    <line x1="360" y1="703" x2="406" y2="703" marker-end="url(#sf-a)"/>
    <line x1="708" y1="703" x2="754" y2="703" marker-end="url(#sf-a)"/>
    <!-- generation to projection -->
    <line x1="940" y1="554" x2="940" y2="626" marker-end="url(#sf-a)"/>
  </g>

  <!-- ===================== FEEDBACK LOOP ===================== -->
  <g stroke="#cf7f54" stroke-opacity="0.55" stroke-width="1.8" fill="none">
    <path d="M756 745 C 40 810, 20 500, 20 238 C 20 150, 40 166, 58 166" marker-end="url(#sf-a)"/>
  </g>
  <rect x="410" y="812" width="380" height="56" rx="6" fill="#12161a" stroke="#5e636b" stroke-opacity="0.5"/>
  <text x="430" y="836" fill="#d8dadd" font-size="13">CLOSED LOOP</text>
  <text x="430" y="856" fill="#7e828a" font-size="11.5">viewer sees output → moves / gestures → tracking re-reads → new frame</text>
</svg>
