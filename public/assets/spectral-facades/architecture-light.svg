<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <marker id="sf-a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b45f2c" fill-opacity="0.8"/>
    </marker>
    <marker id="sf-b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#57534b" fill-opacity="0.7"/>
    </marker>
  </defs>
  <rect width="1200" height="470" fill="#faf9f5"/>

  <text x="48" y="46" fill="#b45f2c" font-size="16" letter-spacing="3">SPECTRAL FACADES · REAL-TIME PROJECTION LOOP</text>
  <text x="48" y="70" fill="#6f6a60" font-size="12.5">A body-steered diffusion loop — the viewer's motion drives what gets generated and projected back at them.</text>

  <!-- ROW 1: main forward flow -->
  <!-- SENSE -->
  <rect x="48" y="150" width="188" height="96" rx="6" fill="#f2f1ec" stroke="#cbc7ba" stroke-opacity="0.7"/>
  <text x="142" y="192" fill="#1a1714" font-size="14" text-anchor="middle">Sense</text>
  <text x="142" y="214" fill="#57534b" font-size="10.5" text-anchor="middle">webcam + MediaPipe</text>
  <text x="142" y="230" fill="#57534b" font-size="10.5" text-anchor="middle">face / hand tracking</text>

  <!-- CONTROL SIGNALS -->
  <rect x="300" y="150" width="188" height="96" rx="6" fill="#f2f1ec" stroke="#cbc7ba" stroke-opacity="0.7"/>
  <text x="394" y="192" fill="#1a1714" font-size="14" text-anchor="middle">Control signals</text>
  <text x="394" y="214" fill="#57534b" font-size="10.5" text-anchor="middle">nose height + palm</text>
  <text x="394" y="230" fill="#57534b" font-size="10.5" text-anchor="middle">open / closed</text>

  <!-- GENERATE (focal) -->
  <rect x="552" y="140" width="216" height="116" rx="6" fill="#f6ece4" stroke="#b45f2c" stroke-width="1.6"/>
  <text x="660" y="184" fill="#b45f2c" font-size="14" text-anchor="middle">Generate</text>
  <text x="660" y="208" fill="#57534b" font-size="10.5" text-anchor="middle">StreamDiffusion sd-turbo</text>
  <text x="660" y="224" fill="#57534b" font-size="10.5" text-anchor="middle">live img2img · no training</text>

  <!-- PROJECT -->
  <rect x="832" y="150" width="188" height="96" rx="6" fill="#f2f1ec" stroke="#cbc7ba" stroke-opacity="0.7"/>
  <text x="926" y="192" fill="#1a1714" font-size="14" text-anchor="middle">Project</text>
  <text x="926" y="214" fill="#57534b" font-size="10.5" text-anchor="middle">camSchnappr map</text>
  <text x="926" y="230" fill="#57534b" font-size="10.5" text-anchor="middle">onto paper cube</text>

  <!-- VIEWER -->
  <rect x="1012" y="150" width="140" height="96" rx="6" fill="#f2f1ec" stroke="#cbc7ba" stroke-opacity="0.7"/>
  <text x="1082" y="192" fill="#1a1714" font-size="14" text-anchor="middle">Viewer</text>
  <text x="1082" y="214" fill="#57534b" font-size="10.5" text-anchor="middle">sees facade</text>
  <text x="1082" y="230" fill="#57534b" font-size="10.5" text-anchor="middle">morph, reacts</text>

  <!-- forward arrows -->
  <g stroke="#b45f2c" stroke-opacity="0.5" stroke-width="1.6" fill="none">
    <line x1="236" y1="198" x2="298" y2="198" marker-end="url(#sf-a)"/>
    <line x1="488" y1="198" x2="550" y2="198" marker-end="url(#sf-a)"/>
    <line x1="768" y1="198" x2="830" y2="198" marker-end="url(#sf-a)"/>
    <line x1="1020" y1="198" x2="1010" y2="198" marker-end="url(#sf-a)"/>
  </g>

  <!-- feedback return arc -->
  <path d="M1082 246 C 1082 340, 142 340, 142 248" fill="none" stroke="#57534b" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#sf-b)"/>
  <text x="612" y="360" fill="#6f6a60" font-size="11.5" text-anchor="middle">moving to inspect the output changes the tracking input — the viewer is inside the loop</text>
</svg>
