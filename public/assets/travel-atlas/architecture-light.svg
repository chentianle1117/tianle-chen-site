<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <marker id="ta-a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b45f2c" fill-opacity="0.8"/>
    </marker>
  </defs>
  <rect width="1200" height="380" fill="#faf9f5"/>

  <text x="60" y="52" fill="#b45f2c" font-size="16" letter-spacing="3">TRAVEL ATLAS · DATA PIPELINE</text>
  <text x="60" y="76" fill="#6f6a60" font-size="12.5">This shows that a travel map is reconstructed from my own Notion reviews, no manual entry.</text>

  <!-- Node 1: Notion source -->
  <rect x="60" y="150" width="230" height="92" rx="6" fill="#f2f1ec" stroke="#cbc7ba" stroke-opacity="0.7"/>
  <text x="175" y="192" fill="#1a1714" font-size="14" text-anchor="middle">Notion reviews</text>
  <text x="175" y="214" fill="#57534b" font-size="10.5" text-anchor="middle">weekly + daily pages</text>

  <!-- Node 2: Title-mining -->
  <rect x="350" y="150" width="230" height="92" rx="6" fill="#f2f1ec" stroke="#cbc7ba" stroke-opacity="0.7"/>
  <text x="465" y="192" fill="#1a1714" font-size="14" text-anchor="middle">Title-mined weeks</text>
  <text x="465" y="214" fill="#57534b" font-size="10.5" text-anchor="middle">places parsed from titles</text>

  <!-- Node 3: Geocode -->
  <rect x="640" y="150" width="230" height="92" rx="6" fill="#f2f1ec" stroke="#cbc7ba" stroke-opacity="0.7"/>
  <text x="755" y="192" fill="#1a1714" font-size="14" text-anchor="middle">Geocode</text>
  <text x="755" y="214" fill="#57534b" font-size="10.5" text-anchor="middle">city / park centroids</text>

  <!-- Node 4: Leaflet render (focal) -->
  <rect x="930" y="150" width="230" height="92" rx="6" fill="#f6ece4" stroke="#b45f2c" stroke-width="2"/>
  <text x="1045" y="192" fill="#b45f2c" font-size="14" text-anchor="middle">Leaflet map</text>
  <text x="1045" y="214" fill="#57534b" font-size="10.5" text-anchor="middle">timeline scrubber</text>

  <!-- arrows -->
  <g stroke="#b45f2c" stroke-opacity="0.5" stroke-width="1.6" fill="none">
    <path d="M290,196 L350,196" marker-end="url(#ta-a)"/>
    <path d="M580,196 L640,196" marker-end="url(#ta-a)"/>
    <path d="M870,196 L930,196" marker-end="url(#ta-a)"/>
  </g>

  <text x="60" y="318" fill="#6f6a60" font-size="12">103 places across 10 countries, every dot traced to a review I wrote.</text>
</svg>
