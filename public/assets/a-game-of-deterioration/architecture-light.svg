<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b45f2c" fill-opacity="0.8"/>
    </marker>
    <marker id="arb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#57534b" fill-opacity="0.7"/>
    </marker>
  </defs>
  <rect width="1200" height="460" fill="#faf9f5"/>

  <text x="60" y="52" fill="#b45f2c" font-size="16" letter-spacing="3">A GAME OF DETERIORATION — SYSTEM LOOP</text>
  <text x="60" y="76" fill="#6f6a60" font-size="12.5">A world you paint decays every frame; your healing radius pushes each cell's lifeRatio back down.</text>

  <!-- STAGE 1: WORLD -->
  <rect x="60" y="150" width="185" height="96" rx="6" fill="#f2f1ec" stroke="#cbc7ba" stroke-opacity="0.7"/>
  <text x="152.5" y="196" fill="#1a1714" font-size="14" text-anchor="middle">You paint a world</text>
  <text x="152.5" y="218" fill="#57534b" font-size="10.5" text-anchor="middle">grayscale heightmap</text>

  <!-- STAGE 2: CELL GRID -->
  <rect x="290" y="150" width="185" height="96" rx="6" fill="#f2f1ec" stroke="#cbc7ba" stroke-opacity="0.7"/>
  <text x="382.5" y="196" fill="#1a1714" font-size="14" text-anchor="middle">Cell world</text>
  <text x="382.5" y="218" fill="#57534b" font-size="10.5" text-anchor="middle">200×150 typed cells</text>

  <!-- STAGE 3: DETERIORATION ENGINE (FOCAL) -->
  <rect x="520" y="138" width="205" height="120" rx="6" fill="#f6ece4" stroke="#b45f2c" stroke-width="2"/>
  <text x="622.5" y="188" fill="#b45f2c" font-size="14" text-anchor="middle">Deterioration engine</text>
  <text x="622.5" y="210" fill="#57534b" font-size="10.5" text-anchor="middle">per-cell Pillow blend by lifeRatio</text>

  <!-- STAGE 4: PLAYER -->
  <rect x="770" y="150" width="185" height="96" rx="6" fill="#f2f1ec" stroke="#cbc7ba" stroke-opacity="0.7"/>
  <text x="862.5" y="196" fill="#1a1714" font-size="14" text-anchor="middle">Player heals</text>
  <text x="862.5" y="218" fill="#57534b" font-size="10.5" text-anchor="middle">restoration radius</text>

  <!-- STAGE 5: RESOLVE -->
  <rect x="1000" y="150" width="140" height="96" rx="6" fill="#f2f1ec" stroke="#cbc7ba" stroke-opacity="0.7"/>
  <text x="1070" y="196" fill="#1a1714" font-size="14" text-anchor="middle">Win / lose</text>
  <text x="1070" y="218" fill="#57534b" font-size="10.5" text-anchor="middle">80% collapse line</text>

  <!-- forward arrows -->
  <g fill="none" stroke="#b45f2c" stroke-opacity="0.5" stroke-width="1.6">
    <line x1="245" y1="198" x2="288" y2="198" marker-end="url(#ar)"/>
    <line x1="475" y1="198" x2="518" y2="198" marker-end="url(#ar)"/>
    <line x1="725" y1="198" x2="768" y2="198" marker-end="url(#ar)"/>
    <line x1="955" y1="198" x2="998" y2="198" marker-end="url(#ar)"/>
  </g>

  <!-- single dashed feedback arc: player heal pushes lifeRatio back into the engine -->
  <path d="M862.5 246 L862.5 320 L622.5 320 L622.5 262" fill="none" stroke="#57534b" stroke-opacity="0.7" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arb)"/>
  <text x="742.5" y="342" fill="#57534b" font-size="10.5" text-anchor="middle">heal pushes lifeRatio back down</text>

  <text x="60" y="416" fill="#6f6a60" font-size="11.5">Decay raises every cell's lifeRatio each frame; the engine blends paired original / deteriorated textures; the player's radius is the only counter-force.</text>
</svg>
