<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <marker id="gd-a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#bf6a37" fill-opacity="0.85"/>
    </marker>
  </defs>
  <rect width="1200" height="880" fill="#faf9f5"/>

  <!-- faint grid -->
  <g stroke="#8a8d93" stroke-opacity="0.10">
    <line x1="0" y1="220" x2="1200" y2="220"/>
    <line x1="0" y1="470" x2="1200" y2="470"/>
    <line x1="0" y1="690" x2="1200" y2="690"/>
  </g>

  <text x="60" y="50" fill="#bf6a37" font-size="17" letter-spacing="3">A GAME OF DETERIORATION — SYSTEM LOOP</text>
  <text x="60" y="74" fill="#77726a" font-size="13">Python 3.6+ · cmu_graphics render loop (60 fps) · Pillow texture blending · NumPy heightmap · 200×150 cell world</text>

  <!-- ============ LANE 1: WORLD GENERATION ============ -->
  <text x="60" y="128" fill="#77726a" font-size="13" letter-spacing="3">1 · USER-GENERATED WORLD  (map_editor.py → Game.__init__)</text>
  <g font-size="15">
    <rect x="60" y="146" width="250" height="86" rx="5" fill="#f6f5f0" stroke="#3c868c" stroke-opacity="0.8"/>
    <text x="80" y="176" fill="#1a1714">GRAYSCALE BRUSH</text>
    <text x="80" y="198" fill="#5b564f" font-size="11.5">NumPy grid · circular ogrid mask</text>
    <text x="80" y="216" fill="#5b564f" font-size="11.5">opacity-blended paint · white=high</text>

    <rect x="355" y="146" width="250" height="86" rx="5" fill="#f6f5f0" stroke="#3c868c" stroke-opacity="0.8"/>
    <text x="375" y="176" fill="#1a1714">HEIGHTMAP UPSCALE</text>
    <text x="375" y="198" fill="#5b564f" font-size="11.5">np.repeat ×4 → 200×150</text>
    <text x="375" y="216" fill="#5b564f" font-size="11.5">+uniform jitter · 3×3 smoothing</text>

    <rect x="650" y="146" width="250" height="86" rx="5" fill="#f6f5f0" stroke="#3c868c" stroke-opacity="0.8"/>
    <text x="670" y="176" fill="#1a1714">TERRAIN CLASSIFY</text>
    <text x="670" y="198" fill="#5b564f" font-size="11.5">height→type: water / sand / dirt</text>
    <text x="670" y="216" fill="#5b564f" font-size="11.5">grass / rocks / brick / snow</text>

    <rect x="945" y="146" width="195" height="86" rx="5" fill="#f6f5f0" stroke="#3c868c" stroke-opacity="0.8"/>
    <text x="965" y="176" fill="#1a1714">CELL GRID</text>
    <text x="965" y="198" fill="#5b564f" font-size="11.5">per-cell dict:</text>
    <text x="965" y="216" fill="#5b564f" font-size="11.5">terrain · growthPotential</text>
  </g>
  <g stroke="#bf6a37" stroke-opacity="0.5" stroke-width="1.6" fill="none">
    <line x1="310" y1="189" x2="355" y2="189" marker-end="url(#gd-a)"/>
    <line x1="605" y1="189" x2="650" y2="189" marker-end="url(#gd-a)"/>
    <line x1="900" y1="189" x2="945" y2="189" marker-end="url(#gd-a)"/>
  </g>

  <!-- ============ LANE 2: TEXTURE DETERIORATION ENGINE ============ -->
  <text x="60" y="278" fill="#77726a" font-size="13" letter-spacing="3">2 · TEXTURE DETERIORATION ENGINE  (texture_manager.py — Pillow)</text>

  <rect x="60" y="296" width="360" height="150" rx="6" fill="#f6f5f0" stroke="#8a8d93" stroke-opacity="0.6"/>
  <text x="80" y="324" fill="#1a1714" font-size="15">PAIRED TEXTURE ATLAS</text>
  <g font-size="12" fill="#5b564f">
    <text x="80" y="350">10 materials × { original, deteriorated }</text>
    <text x="80" y="372">deteriorated variants hand-edited in Photoshop</text>
    <text x="80" y="394">(base pack: OpenGameArt pixel-texture-pack)</text>
    <text x="80" y="416">per-terrain maxLife (grass 100 … sand 500)</text>
    <text x="80" y="438">loaded once via PIL, converted to RGB</text>
  </g>

  <rect x="450" y="296" width="360" height="150" rx="6" fill="#f9efe4" stroke="#bf6a37" stroke-width="2"/>
  <text x="470" y="324" fill="#bf6a37" font-size="15">PER-CELL BLEND  (lifeRatio 0→1)</text>
  <g font-size="12" fill="#5b564f">
    <text x="470" y="350">Image.blend(original, deteriorated, level)</text>
    <text x="470" y="372">water: sin-driven GaussianBlur ripple</text>
    <text x="470" y="394">resize to on-screen cell (LANCZOS)</text>
    <text x="470" y="416">→ wrap as CMUImage for the canvas</text>
    <text x="470" y="438">deterioration +0.005/step · water exempt</text>
  </g>

  <rect x="840" y="296" width="300" height="150" rx="6" fill="#f6f5f0" stroke="#8a8d93" stroke-opacity="0.6"/>
  <text x="860" y="324" fill="#1a1714" font-size="15">RENDER CACHE</text>
  <g font-size="12" fill="#5b564f">
    <text x="860" y="350">key = (type, w, h, round(ratio,2))</text>
    <text x="860" y="372">float ratios rounded → bounded keys</text>
    <text x="860" y="394">flushed every 30 update steps</text>
    <text x="860" y="416">only visible cells (+5 pad) rebuilt</text>
    <text x="860" y="438">avoids per-frame Pillow re-encode</text>
  </g>
  <g stroke="#bf6a37" stroke-opacity="0.5" stroke-width="1.6" fill="none">
    <line x1="420" y1="371" x2="450" y2="371" marker-end="url(#gd-a)"/>
    <line x1="810" y1="371" x2="840" y2="371" marker-end="url(#gd-a)"/>
  </g>

  <!-- ============ LANE 3: PLAYER + RESTORATION ============ -->
  <text x="60" y="500" fill="#77726a" font-size="13" letter-spacing="3">3 · PLAYER + RESTORATION  (character.py · equipment.py · game.update)</text>

  <rect x="60" y="518" width="245" height="150" rx="6" fill="#f6f5f0" stroke="#7a4fb0" stroke-opacity="0.8"/>
  <text x="80" y="546" fill="#1a1714" font-size="15">MOVEMENT</text>
  <g font-size="12" fill="#5b564f">
    <text x="80" y="572">WASD / arrows · shift = sprint</text>
    <text x="80" y="594">4-direction sprite animation</text>
    <text x="80" y="616">cells with lifeRatio ≥ 0.8</text>
    <text x="80" y="638">block movement (impassable)</text>
    <text x="80" y="658" fill="#77726a">camera follows · zoom 5–10×</text>
  </g>

  <rect x="335" y="518" width="245" height="150" rx="6" fill="#f6f5f0" stroke="#7a4fb0" stroke-opacity="0.8"/>
  <text x="355" y="546" fill="#1a1714" font-size="15">PASSIVE HEAL</text>
  <g font-size="12" fill="#5b564f">
    <text x="355" y="572">radius circle around player</text>
    <text x="355" y="594">lifeRatio −= strength × 0.01</text>
    <text x="355" y="616">applied to non-water cells</text>
    <text x="355" y="638">inside restoration radius</text>
    <text x="355" y="658" fill="#77726a">space = expanding heal wave</text>
  </g>

  <rect x="610" y="518" width="245" height="150" rx="6" fill="#f6f5f0" stroke="#7a4fb0" stroke-opacity="0.8"/>
  <text x="630" y="546" fill="#1a1714" font-size="15">POWER-UPS</text>
  <g font-size="12" fill="#5b564f">
    <text x="630" y="572">speed  +movement</text>
    <text x="630" y="594">radius  +8 heal radius</text>
    <text x="630" y="616">power  +0.75 strength</text>
    <text x="630" y="638">burst  instant 5×5 heal</text>
    <text x="630" y="658" fill="#77726a">collected on contact · inventory</text>
  </g>

  <rect x="885" y="518" width="255" height="150" rx="6" fill="#f6f5f0" stroke="#5a8038" stroke-opacity="0.8"/>
  <text x="905" y="546" fill="#1a1714" font-size="15">LIVING FEEDBACK</text>
  <g font-size="12" fill="#5b564f">
    <text x="905" y="572">recursive fractal trees</text>
    <text x="905" y="594">grow → yellow → red → shed</text>
    <text x="905" y="616">tracks surrounding lifeRatio</text>
    <text x="905" y="638">global deterioration bar</text>
    <text x="905" y="658" fill="#77726a">minimap · debug overlay</text>
  </g>

  <!-- deterioration engine feeds restoration lane -->
  <g stroke="#bf6a37" stroke-opacity="0.45" stroke-width="1.6" fill="none">
    <path d="M600 446 L600 480 L182 480 L182 518" marker-end="url(#gd-a)"/>
  </g>
  <text x="612" y="466" fill="#77726a" font-size="11">per-cell lifeRatio drives movement, heal targets &amp; tree health</text>

  <!-- ============ LANE 4: WIN / LOSE ============ -->
  <text x="60" y="722" fill="#77726a" font-size="13" letter-spacing="3">4 · WIN / LOSE STATE  (game.py)</text>

  <rect x="60" y="740" width="345" height="104" rx="6" fill="#f6f5f0" stroke="#8a8d93" stroke-opacity="0.6"/>
  <text x="80" y="768" fill="#1a1714" font-size="15">TIMED MODE — 60 s</text>
  <g font-size="12" fill="#5b564f">
    <text x="80" y="792">global deterioration ≥ 80% → LOSE</text>
    <text x="80" y="814">survive to 0:00 under 80% → WIN</text>
    <text x="80" y="834" fill="#77726a">"You preserved the environment!"</text>
  </g>

  <rect x="430" y="740" width="345" height="104" rx="6" fill="#f6f5f0" stroke="#8a8d93" stroke-opacity="0.6"/>
  <text x="450" y="768" fill="#1a1714" font-size="15">INFINITE MODE</text>
  <g font-size="12" fill="#5b564f">
    <text x="450" y="792">no countdown · continuous global decay</text>
    <text x="450" y="814">press E to end when ready</text>
    <text x="450" y="834" fill="#77726a">samples decay / power / speed / radius</text>
  </g>

  <rect x="800" y="740" width="340" height="104" rx="6" fill="#f9efe4" stroke="#bf6a37" stroke-width="2"/>
  <text x="820" y="768" fill="#bf6a37" font-size="15">RESULTS SCREEN</text>
  <g font-size="12" fill="#5b564f">
    <text x="820" y="792">charts world decay vs. player growth</text>
    <text x="820" y="814">over the session timeline</text>
    <text x="820" y="834" fill="#77726a">final deterioration % · time survived</text>
  </g>

  <g stroke="#bf6a37" stroke-opacity="0.45" stroke-width="1.6" fill="none">
    <line x1="405" y1="792" x2="430" y2="792" marker-end="url(#gd-a)"/>
    <line x1="775" y1="792" x2="800" y2="792" marker-end="url(#gd-a)"/>
  </g>

  <!-- feedback loop annotation -->
  <text x="60" y="868" fill="#77726a" font-size="12">Loop each frame: decay raises every cell's lifeRatio → the player's radius pushes it back down → trees &amp; the global bar report the balance → the 80% line decides the run.</text>
</svg>
