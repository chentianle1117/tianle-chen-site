<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b45f2c" fill-opacity="0.8"/>
    </marker>
    <marker id="ar-g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#5c8040" fill-opacity="0.85"/>
    </marker>
  </defs>
  <rect width="1200" height="440" fill="#faf9f5"/>

  <!-- title -->
  <text x="60" y="48" fill="#b45f2c" font-size="16" letter-spacing="3">DESIGN THE AMBIENCE · REAL-TIME FEEDBACK LOOP</text>
  <text x="60" y="72" fill="#6f6a60" font-size="12.5">This shows that physical inputs condition StreamDiffusion, whose projection becomes the room the user reacts to.</text>

  <!-- ===== INPUTS ===== -->
  <rect x="60" y="140" width="220" height="150" rx="6" fill="#f2f1ec" stroke="#cbc7ba" stroke-opacity="0.7"/>
  <text x="170" y="176" fill="#1a1714" font-size="14" text-anchor="middle">Physical inputs</text>
  <text x="170" y="204" fill="#57534b" font-size="10.5" text-anchor="middle">cursor · keyboard</text>
  <text x="170" y="224" fill="#57534b" font-size="10.5" text-anchor="middle">body pose · movement</text>
  <text x="170" y="252" fill="#57534b" font-size="10.5" text-anchor="middle">live PC screen</text>

  <!-- ===== CAPTURE ===== -->
  <rect x="370" y="140" width="220" height="150" rx="6" fill="#f2f1ec" stroke="#cbc7ba" stroke-opacity="0.7"/>
  <text x="480" y="200" fill="#1a1714" font-size="14" text-anchor="middle">Capture</text>
  <text x="480" y="228" fill="#57534b" font-size="10.5" text-anchor="middle">Python + OSC · MediaPipe</text>

  <!-- ===== STREAMDIFFUSION (focal) ===== -->
  <rect x="680" y="140" width="220" height="150" rx="6" fill="#f6ece4" stroke="#b45f2c" stroke-width="1.6"/>
  <text x="790" y="200" fill="#b45f2c" font-size="14" text-anchor="middle">StreamDiffusion</text>
  <text x="790" y="228" fill="#57534b" font-size="10.5" text-anchor="middle">in TouchDesigner · ~16 fps</text>

  <!-- ===== PROJECTION ===== -->
  <rect x="990" y="140" width="150" height="150" rx="6" fill="#f2f1ec" stroke="#cbc7ba" stroke-opacity="0.7"/>
  <text x="1065" y="200" fill="#1a1714" font-size="14" text-anchor="middle">Projection</text>
  <text x="1065" y="228" fill="#57534b" font-size="10.5" text-anchor="middle">onto wall + body</text>

  <!-- forward arrows (oxide) -->
  <g fill="none" stroke="#b45f2c" stroke-opacity="0.5" stroke-width="1.6">
    <path d="M280,215 L370,215" marker-end="url(#ar)"/>
    <path d="M590,215 L680,215" marker-end="url(#ar)"/>
    <path d="M900,215 L990,215" marker-end="url(#ar)"/>
  </g>

  <!-- feedback return arc (green, dashed) -->
  <path d="M1065,290 C1065,370 1065,392 590,392 L170,392 C170,340 170,312 170,290"
        fill="none" stroke="#5c8040" stroke-opacity="0.75" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#ar-g)"/>
  <rect x="540" y="376" width="200" height="30" rx="5" fill="#faf9f5"/>
  <text x="640" y="396" fill="#5c8040" font-size="11.5" letter-spacing="2" text-anchor="middle">USER REACTS · CLOSES LOOP</text>
</svg>
