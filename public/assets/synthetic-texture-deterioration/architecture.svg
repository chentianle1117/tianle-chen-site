<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#cf7f54" fill-opacity="0.8"/>
    </marker>
    <marker id="ar-dim" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#7e828a" fill-opacity="0.75"/>
    </marker>
  </defs>

  <rect width="1200" height="500" fill="#0b0d0f"/>

  <!-- Title -->
  <text x="48" y="46" fill="#cf7f54" font-size="16" letter-spacing="3">TEXTURE DETERIORATION · SYSTEM</text>
  <text x="48" y="70" fill="#7e828a" font-size="12.5">A working real-time analysis loop feeds an explored, unbuilt aging-synthesis interface.</text>

  <!-- ===== LANE 1 — BUILT ===== -->
  <text x="48" y="126" fill="#a8acb1" font-size="12.5" letter-spacing="2">INTERFACE 1 · REAL-TIME ANALYSIS  —  BUILT</text>

  <g text-anchor="middle">
    <!-- Screen capture -->
    <rect x="48" y="146" width="196" height="72" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
    <text x="146" y="182" fill="#e8eaed" font-size="14">Screen capture</text>
    <text x="146" y="202" fill="#a8acb1" font-size="10.5">live render region</text>

    <!-- Classifier -->
    <rect x="292" y="146" width="196" height="72" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
    <text x="390" y="182" fill="#e8eaed" font-size="14">Classifier</text>
    <text x="390" y="202" fill="#a8acb1" font-size="10.5">sliding window + NMS</text>

    <!-- VLM describe -->
    <rect x="536" y="146" width="196" height="72" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
    <text x="634" y="182" fill="#e8eaed" font-size="14">Describe</text>
    <text x="634" y="202" fill="#a8acb1" font-size="10.5">Ollama Llama 3</text>

    <!-- Extract -->
    <rect x="780" y="146" width="196" height="72" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
    <text x="878" y="182" fill="#e8eaed" font-size="14">Extract fields</text>
    <text x="878" y="202" fill="#a8acb1" font-size="10.5">material · surface · age</text>

    <!-- Svelte UI (focal, oxide) -->
    <rect x="1004" y="146" width="148" height="72" rx="5" fill="#1a130e" stroke="#cf7f54" stroke-width="2"/>
    <text x="1078" y="182" fill="#cf7f54" font-size="14">Svelte UI</text>
    <text x="1078" y="202" fill="#a8acb1" font-size="10.5">live texture log</text>
  </g>

  <g stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" fill="none">
    <line x1="244" y1="182" x2="292" y2="182" marker-end="url(#ar)"/>
    <line x1="488" y1="182" x2="536" y2="182" marker-end="url(#ar)"/>
    <line x1="732" y1="182" x2="780" y2="182" marker-end="url(#ar)"/>
    <line x1="976" y1="182" x2="1004" y2="182" marker-end="url(#ar)"/>
  </g>

  <!-- ===== LANE 2 — EXPLORED ===== -->
  <text x="48" y="326" fill="#7e828a" font-size="12.5" letter-spacing="2">INTERFACE 2 · AGING SYNTHESIS  —  EXPLORED, NOT BUILT</text>

  <g text-anchor="middle">
    <!-- Decay params -->
    <rect x="48" y="346" width="220" height="72" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.4"/>
    <text x="158" y="382" fill="#a8acb1" font-size="14">Decay parameters</text>
    <text x="158" y="402" fill="#7e828a" font-size="10.5">material · exposure · target age</text>

    <!-- Conditioning -->
    <rect x="316" y="346" width="220" height="72" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.4"/>
    <text x="426" y="382" fill="#a8acb1" font-size="14">Conditioning</text>
    <text x="426" y="402" fill="#7e828a" font-size="10.5">ControlNet · holds geometry</text>

    <!-- Diffusion -->
    <rect x="584" y="346" width="220" height="72" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.4"/>
    <text x="694" y="382" fill="#a8acb1" font-size="14">Diffusion</text>
    <text x="694" y="402" fill="#7e828a" font-size="10.5">Flux via ComfyUI</text>

    <!-- Aged facade -->
    <rect x="852" y="346" width="220" height="72" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.4"/>
    <text x="962" y="382" fill="#a8acb1" font-size="14">Aged facade</text>
    <text x="962" y="402" fill="#7e828a" font-size="10.5">before / after pair</text>
  </g>

  <g stroke="#7e828a" stroke-opacity="0.45" stroke-width="1.4" fill="none">
    <line x1="268" y1="382" x2="316" y2="382" marker-end="url(#ar-dim)"/>
    <line x1="536" y1="382" x2="584" y2="382" marker-end="url(#ar-dim)"/>
    <line x1="804" y1="382" x2="852" y2="382" marker-end="url(#ar-dim)"/>
  </g>

  <!-- handoff: detected material+age seeds the explored lane (dashed return/bridge) -->
  <g stroke="#7e828a" stroke-opacity="0.6" stroke-width="1.4" fill="none" stroke-dasharray="5 4">
    <path d="M878 218 L878 268 L158 268 L158 346" marker-end="url(#ar-dim)"/>
  </g>
  <text x="512" y="262" fill="#7e828a" font-size="10.5">detected material + age  →  seeds the explored lane</text>

  <text x="48" y="474" fill="#7e828a" font-size="11.5">Fall 2024 independent study · analysis interface runs; synthesis stayed a design (compute, single-class detection, no labeled aging data).</text>
</svg>
