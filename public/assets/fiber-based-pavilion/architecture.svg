<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <marker id="fp-a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#cf7f54" fill-opacity="0.8"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#0b0d0f"/>

  <!-- Title -->
  <text x="60" y="48" fill="#cf7f54" font-size="16" letter-spacing="3">FIBER-BASED PAVILION · FORM-FINDING TO FABRICATION</text>
  <text x="60" y="72" fill="#7e828a" font-size="12.5">Two computational tracks converge into one robotically-fabricated dual-function ceramic unit.</text>

  <!-- track headers -->
  <text x="180" y="128" fill="#7e828a" font-size="12" letter-spacing="2" text-anchor="middle">TOPOLOGICAL COLUMN</text>
  <text x="600" y="128" fill="#7e828a" font-size="12" letter-spacing="2" text-anchor="middle">KINEMATIC CANOPY</text>

  <!-- ===== COLUMN TRACK (left) ===== -->
  <g font-size="14">
    <rect x="60" y="150" width="240" height="66" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
    <text x="180" y="184" fill="#e8eaed" text-anchor="middle">Topology optimization</text>
    <text x="180" y="204" fill="#a8acb1" font-size="10.5" text-anchor="middle">grows the load path, hollows the rest</text>

    <rect x="60" y="256" width="240" height="66" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
    <text x="180" y="290" fill="#e8eaed" text-anchor="middle">Parametric catalogue</text>
    <text x="180" y="310" fill="#a8acb1" font-size="10.5" text-anchor="middle">family of optimized variants</text>

    <rect x="60" y="362" width="240" height="66" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
    <text x="180" y="396" fill="#e8eaed" text-anchor="middle">Segmentation</text>
    <text x="180" y="416" fill="#a8acb1" font-size="10.5" text-anchor="middle">stackable hollow segments</text>
  </g>
  <g stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" fill="none">
    <line x1="180" y1="216" x2="180" y2="256" marker-end="url(#fp-a)"/>
    <line x1="180" y1="322" x2="180" y2="362" marker-end="url(#fp-a)"/>
  </g>

  <!-- ===== CANOPY TRACK (right) ===== -->
  <g font-size="14">
    <rect x="480" y="150" width="240" height="66" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
    <text x="600" y="184" fill="#e8eaed" text-anchor="middle">Origami fold</text>
    <text x="600" y="204" fill="#a8acb1" font-size="10.5" text-anchor="middle">rigid-foldable crease surface</text>

    <rect x="480" y="256" width="240" height="66" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
    <text x="600" y="290" fill="#e8eaed" text-anchor="middle">Kangaroo form-finding</text>
    <text x="600" y="310" fill="#a8acb1" font-size="10.5" text-anchor="middle">relaxes motion to sun + wind</text>

    <rect x="480" y="362" width="240" height="66" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
    <text x="600" y="396" fill="#e8eaed" text-anchor="middle">Digital twin</text>
    <text x="600" y="416" fill="#a8acb1" font-size="10.5" text-anchor="middle">simulated, not physically built</text>
  </g>
  <g stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" fill="none">
    <line x1="600" y1="216" x2="600" y2="256" marker-end="url(#fp-a)"/>
    <line x1="600" y1="322" x2="600" y2="362" marker-end="url(#fp-a)"/>
  </g>

  <!-- ===== FABRICATION COLUMN (right, focal) ===== -->
  <g font-size="14">
    <rect x="900" y="150" width="240" height="78" rx="5" fill="#1a130e" stroke="#cf7f54" stroke-width="2"/>
    <text x="1020" y="184" fill="#cf7f54" text-anchor="middle">Robotic subtractive</text>
    <text x="1020" y="204" fill="#a8acb1" font-size="10.5" text-anchor="middle">UR arm mills voids into</text>
    <text x="1020" y="219" fill="#a8acb1" font-size="10.5" text-anchor="middle">extruded ceramic blanks</text>

    <rect x="900" y="268" width="240" height="66" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
    <text x="1020" y="302" fill="#e8eaed" text-anchor="middle">Post-tensioned assembly</text>
    <text x="1020" y="322" fill="#a8acb1" font-size="10.5" text-anchor="middle">tendon joins segments</text>

    <rect x="900" y="374" width="240" height="66" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
    <text x="1020" y="408" fill="#e8eaed" text-anchor="middle">Dual-function unit</text>
    <text x="1020" y="428" fill="#a8acb1" font-size="10.5" text-anchor="middle">column + water collector</text>
  </g>
  <g stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" fill="none">
    <line x1="1020" y1="228" x2="1020" y2="268" marker-end="url(#fp-a)"/>
    <line x1="1020" y1="334" x2="1020" y2="374" marker-end="url(#fp-a)"/>
  </g>

  <!-- converge: column segmentation -> fabrication -->
  <g stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" fill="none">
    <path d="M300,395 L360,395 L360,189 L900,189" marker-end="url(#fp-a)"/>
  </g>
  <!-- canopy digital-only return (dashed, distinct) -->
  <path d="M720,395 L810,395 L810,455 L1020,455 L1020,440" stroke="#5fa0a6" stroke-opacity="0.5" stroke-width="1.4" stroke-dasharray="3 6" fill="none"/>
  <text x="1020" y="478" fill="#7e828a" font-size="10.5" text-anchor="middle">canopy stays digital</text>

  <!-- footer claim -->
  <text x="60" y="600" fill="#7e828a" font-size="11.5">Peer-reviewed at IASS 2024 (Castellón &amp; Chen) · fabricated with Cerámica Cumella.</text>
</svg>
