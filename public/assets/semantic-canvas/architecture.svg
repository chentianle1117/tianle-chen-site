<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" width="1200" height="940" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <marker id="sc-a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#cf7f54" fill-opacity="0.9"/>
    </marker>
  </defs>
  <rect width="1200" height="940" fill="#0b0d0f"/>
  <!-- faint grid -->
  <g stroke="#5e636b" stroke-opacity="0.06">
    <line x1="0" y1="235" x2="1200" y2="235"/>
    <line x1="0" y1="470" x2="1200" y2="470"/>
    <line x1="0" y1="705" x2="1200" y2="705"/>
    <line x1="400" y1="0" x2="400" y2="940"/>
    <line x1="800" y1="0" x2="800" y2="940"/>
  </g>

  <!-- Title -->
  <text x="52" y="46" fill="#cf7f54" font-size="17" letter-spacing="3">SEMANTIC CANVAS — SYSTEM ARCHITECTURE</text>
  <text x="52" y="68" fill="#7e828a" font-size="13">CLIP semantic-axis projection · BFF service · bounded AI observer · multi-user study instrumentation</text>

  <!-- ============================================================= -->
  <!-- LANE 1 — PROJECTION PIPELINE (the core abstraction)           -->
  <!-- ============================================================= -->
  <text x="52" y="108" fill="#7e828a" font-size="13" letter-spacing="3">1 · SEMANTIC-AXIS PROJECTION  (no learned mapping · no dimensionality reduction · adding an axis is free)</text>

  <!-- axis build (top row) -->
  <g font-size="14.5">
    <rect x="52" y="126" width="228" height="88" rx="5" fill="#12161a" stroke="#9b6fc9" stroke-opacity="0.85"/>
    <text x="70" y="152" fill="#e8eaed">AXIS ENDPOINTS</text>
    <text x="70" y="174" fill="#a8acb1" font-size="11.5">designer types NL poles:</text>
    <text x="70" y="192" fill="#a8acb1" font-size="11.5">"casual" ↔ "formal"</text>
    <text x="70" y="208" fill="#7e828a" font-size="11">per axis: X · Y (opt. Z)</text>

    <rect x="308" y="126" width="228" height="88" rx="5" fill="#12161a" stroke="#9b6fc9" stroke-opacity="0.85"/>
    <text x="326" y="152" fill="#e8eaed">GEMINI EXPAND</text>
    <text x="326" y="174" fill="#a8acb1" font-size="11.5">each pole → 4 label</text>
    <text x="326" y="192" fill="#a8acb1" font-size="11.5">variants (cached, ≤50)</text>
    <text x="326" y="208" fill="#7e828a" font-size="11">expand_concept_with_gemini</text>

    <rect x="564" y="126" width="228" height="88" rx="5" fill="#12161a" stroke="#9b6fc9" stroke-opacity="0.85"/>
    <text x="582" y="152" fill="#e8eaed">ENSEMBLE AXIS</text>
    <text x="582" y="174" fill="#a8acb1" font-size="11.5">embed 4 variants →</text>
    <text x="582" y="192" fill="#a8acb1" font-size="11.5">mean = pole vector</text>
    <text x="582" y="208" fill="#7e828a" font-size="11">create_ensemble_axis()</text>

    <rect x="820" y="126" width="328" height="88" rx="5" fill="#1a130e" stroke="#cf7f54" stroke-width="1.4"/>
    <text x="838" y="152" fill="#cf7f54">AXIS DIRECTION</text>
    <text x="838" y="176" fill="#a8acb1" font-size="12">dir = normalize( pos_ensemble − neg_ensemble )</text>
    <text x="838" y="198" fill="#7e828a" font-size="11">unit vector in 1024-D CLIP space · cached per label set</text>
  </g>
  <g stroke="#cf7f54" stroke-opacity="0.45" stroke-width="1.6" fill="none">
    <line x1="280" y1="170" x2="308" y2="170" marker-end="url(#sc-a)"/>
    <line x1="536" y1="170" x2="564" y2="170" marker-end="url(#sc-a)"/>
    <line x1="792" y1="170" x2="820" y2="170" marker-end="url(#sc-a)"/>
  </g>

  <!-- project + render (bottom row) -->
  <g font-size="14.5">
    <rect x="52" y="238" width="228" height="82" rx="5" fill="#12161a" stroke="#5fa0a6" stroke-opacity="0.85"/>
    <text x="70" y="264" fill="#e8eaed">IMAGE EMBEDDINGS</text>
    <text x="70" y="286" fill="#a8acb1" font-size="11.5">Jina CLIP v2 · 1024-D</text>
    <text x="70" y="304" fill="#7e828a" font-size="11">Zappos50K subset + variants</text>

    <rect x="308" y="238" width="228" height="82" rx="5" fill="#12161a" stroke="#5fa0a6" stroke-opacity="0.85"/>
    <text x="326" y="264" fill="#e8eaed">PROJECT (dot)</text>
    <text x="326" y="286" fill="#a8acb1" font-size="11.5">coord = emb · axis_dir</text>
    <text x="326" y="304" fill="#7e828a" font-size="11">matmul → (x, y[, z])</text>

    <rect x="564" y="238" width="228" height="82" rx="5" fill="#12161a" stroke="#7aa15c" stroke-opacity="0.85"/>
    <text x="582" y="264" fill="#e8eaed">NORMALIZE · GRID</text>
    <text x="582" y="286" fill="#a8acb1" font-size="11.5">min–max → snap_to_grid</text>
    <text x="582" y="304" fill="#7e828a" font-size="11">aspect 16:9 → 1:1</text>

    <rect x="820" y="238" width="328" height="82" rx="5" fill="#1a130e" stroke="#cf7f54" stroke-width="1.4"/>
    <text x="838" y="264" fill="#cf7f54">D3 RENDER</text>
    <text x="838" y="286" fill="#a8acb1" font-size="12">SemanticCanvas · zoom/pan · eased reposition</text>
    <text x="838" y="304" fill="#7e828a" font-size="11">glow filters · genealogy Bezier lines</text>
  </g>
  <g stroke="#cf7f54" stroke-opacity="0.45" stroke-width="1.6" fill="none">
    <line x1="280" y1="279" x2="308" y2="279" marker-end="url(#sc-a)"/>
    <line x1="536" y1="279" x2="564" y2="279" marker-end="url(#sc-a)"/>
    <line x1="792" y1="279" x2="820" y2="279" marker-end="url(#sc-a)"/>
    <!-- axis direction feeds the dot-project step -->
    <path d="M934 214 L934 226 L390 226 L390 238" marker-end="url(#sc-a)"/>
  </g>
  <text x="52" y="346" fill="#7e828a" font-size="11.5">Positions come straight from a dot product, so the layout stays legible and every axis is inspectable — the thesis argument: make AI <tspan fill="#cf7f54">legible</tspan> to the designer.</text>

  <!-- ============================================================= -->
  <!-- LANE 2 — SERVICE ARCHITECTURE (BFF)                           -->
  <!-- ============================================================= -->
  <text x="52" y="396" fill="#7e828a" font-size="13" letter-spacing="3">2 · SERVICE ARCHITECTURE  (BFF — all API keys server-side · Dockerized on Railway)</text>

  <!-- Frontend -->
  <rect x="52" y="414" width="336" height="188" rx="6" fill="#12161a" stroke="#5fa0a6" stroke-opacity="0.75"/>
  <text x="70" y="440" fill="#5fa0a6" font-size="14.5">FRONTEND</text>
  <text x="70" y="458" fill="#7e828a" font-size="11">React 18 · TypeScript · Vite</text>
  <g font-size="12" fill="#a8acb1">
    <text x="70" y="484">SemanticCanvas — D3.js 7 2D space</text>
    <text x="70" y="504">LineageCanvas — genealogy tree view</text>
    <text x="70" y="524">Zustand store (appStore.ts)</text>
    <text x="70" y="544">apiClient.ts — REST · Axios</text>
    <text x="70" y="564">falClient.ts — generation via BFF</text>
    <text x="70" y="586" fill="#7e828a">4 flyout panels · inspector · timeline drawer</text>
  </g>

  <!-- Backend -->
  <rect x="432" y="414" width="336" height="188" rx="6" fill="#1a130e" stroke="#cf7f54" stroke-opacity="0.85"/>
  <text x="450" y="440" fill="#cf7f54" font-size="14.5">BACKEND — FastAPI + Uvicorn</text>
  <text x="450" y="458" fill="#7e828a" font-size="11">api.py · ~4,800 LOC</text>
  <g font-size="12" fill="#a8acb1">
    <text x="450" y="484">_StateProxy + ContextVar per-participant state</text>
    <text x="450" y="504">Semantic Axis Builder (ensemble)</text>
    <text x="450" y="524">Jina embedder + cache (.pkl per md5)</text>
    <text x="450" y="544">session persistence — JSON / canvas</text>
    <text x="450" y="564">event logging — JSONL per participant</text>
    <text x="450" y="586" fill="#7e828a">/api/health · /api/login · /api/admin/*</text>
  </g>

  <!-- External -->
  <rect x="812" y="414" width="336" height="188" rx="6" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
  <text x="830" y="440" fill="#e8eaed" font-size="14.5">EXTERNAL SERVICES</text>
  <text x="830" y="458" fill="#7e828a" font-size="11">keys injected server-side only</text>
  <g font-size="12" fill="#a8acb1">
    <text x="830" y="484">Jina AI — jina-clip-v2 embeddings</text>
    <text x="830" y="504" fill="#7e828a">   base64 JPEG / text → 1024-D · 3× retry</text>
    <text x="830" y="524">fal.ai nano-banana — text→image (~2s)</text>
    <text x="830" y="544">fal.ai nano-banana-2 — multi-view sheets</text>
    <text x="830" y="564">Google Gemini 2.5 Flash Lite</text>
    <text x="830" y="584" fill="#7e828a">   axis expand · brief · tags · observer</text>
  </g>

  <g stroke="#cf7f54" stroke-opacity="0.45" stroke-width="1.6" fill="none">
    <line x1="388" y1="508" x2="432" y2="508" marker-end="url(#sc-a)"/>
    <line x1="768" y1="508" x2="812" y2="508" marker-end="url(#sc-a)"/>
  </g>
  <text x="398" y="502" fill="#7e828a" font-size="10">HTTP</text>
  <text x="780" y="502" fill="#7e828a" font-size="10">REST</text>

  <!-- generation modes strip -->
  <rect x="812" y="616" width="336" height="72" rx="5" fill="#101418" stroke="#5e636b" stroke-opacity="0.5"/>
  <text x="830" y="638" fill="#d8dadd" font-size="12.5">GENERATION MODES</text>
  <text x="830" y="658" fill="#7e828a" font-size="11">text-to-image · reference-based iteration</text>
  <text x="830" y="676" fill="#7e828a" font-size="11">mood boards (7 presets) · satellite views · BG-removal</text>

  <!-- AI observer strip -->
  <rect x="432" y="616" width="336" height="72" rx="5" fill="#101418" stroke="#5e636b" stroke-opacity="0.5"/>
  <text x="450" y="638" fill="#d8dadd" font-size="12.5">BOUNDED AI OBSERVER (Gemini)</text>
  <text x="450" y="658" fill="#7e828a" font-size="11">passive — reads canvas + design brief</text>
  <text x="450" y="676" fill="#7e828a" font-size="11">sticky insights · timers stop on show → zero waste</text>

  <!-- client-only demo strip -->
  <rect x="52" y="616" width="336" height="72" rx="5" fill="#101418" stroke="#5fa0a6" stroke-opacity="0.5"/>
  <text x="70" y="638" fill="#d8dadd" font-size="12.5">LIGHTWEIGHT CLIENT DEMO</text>
  <text x="70" y="658" fill="#7e828a" font-size="11">browser-only · precomputed embeddings (data.json)</text>
  <text x="70" y="676" fill="#7e828a" font-size="11">same dot-project + normalize · no backend / no keys</text>

  <!-- ============================================================= -->
  <!-- LANE 3 — MULTI-USER STUDY INSTRUMENTATION                     -->
  <!-- ============================================================= -->
  <text x="52" y="726" fill="#7e828a" font-size="13" letter-spacing="3">3 · MULTI-USER STUDY INSTRUMENTATION  (per-participant isolation · quantitative behavior data)</text>

  <g font-size="14">
    <rect x="52" y="744" width="256" height="86" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
    <text x="70" y="770" fill="#e8eaed">PERSONAL URL</text>
    <text x="70" y="792" fill="#a8acb1" font-size="11.5">/?participant=Name</text>
    <text x="70" y="810" fill="#7e828a" font-size="11">→ X-Participant-Id header</text>

    <rect x="336" y="744" width="256" height="86" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
    <text x="354" y="770" fill="#e8eaed">ISOLATED AppState</text>
    <text x="354" y="792" fill="#a8acb1" font-size="11.5">ContextVar middleware</text>
    <text x="354" y="810" fill="#7e828a" font-size="11">own canvases · selections · feedback</text>

    <rect x="620" y="744" width="256" height="86" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
    <text x="638" y="770" fill="#e8eaed">JSONL EVENT LOG</text>
    <text x="638" y="792" fill="#a8acb1" font-size="11.5">session · generation · select</text>
    <text x="638" y="810" fill="#7e828a" font-size="11">branch · feedback · line-by-line</text>

    <rect x="904" y="744" width="244" height="86" rx="5" fill="#1a130e" stroke="#cf7f54" stroke-width="1.2"/>
    <text x="922" y="770" fill="#cf7f54">PERSISTENT VOLUME</text>
    <text x="922" y="792" fill="#a8acb1" font-size="11.5">/app/backend/data</text>
    <text x="922" y="810" fill="#7e828a" font-size="11">survives restarts · admin export</text>
  </g>
  <g stroke="#cf7f54" stroke-opacity="0.45" stroke-width="1.6" fill="none">
    <line x1="308" y1="787" x2="336" y2="787" marker-end="url(#sc-a)"/>
    <line x1="592" y1="787" x2="620" y2="787" marker-end="url(#sc-a)"/>
    <line x1="876" y1="787" x2="904" y2="787" marker-end="url(#sc-a)"/>
  </g>

  <!-- footer -->
  <rect x="52" y="858" width="1096" height="54" rx="6" fill="#12161a" stroke="#5e636b" stroke-opacity="0.5"/>
  <text x="70" y="882" fill="#d8dadd" font-size="12.5">DATASET · DEPLOY</text>
  <text x="70" y="900" fill="#7e828a" font-size="11.5">Zappos50K (curated subset + fal.ai-generated variants) · Dockerized · Railway healthcheck /api/health (300s) · on-failure restart · CMU MSCD thesis 2025–2026</text>
</svg>
