<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <marker id="sc-a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#cf7f54" fill-opacity="0.85"/>
    </marker>
    <marker id="sc-b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#5e636b" fill-opacity="0.9"/>
    </marker>
  </defs>
  <rect width="1200" height="470" fill="#0b0d0f"/>

  <!-- Title -->
  <text x="52" y="46" fill="#cf7f54" font-size="16" letter-spacing="3">SEMANTIC CANVAS · SYSTEM WIRING</text>
  <text x="52" y="70" fill="#7e828a" font-size="12.5">This shows that the browser canvas never touches a model — one keyed backend brokers every embedding and generation call.</text>

  <!-- BROWSER -->
  <rect x="52" y="150" width="272" height="150" rx="6" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
  <text x="188" y="184" fill="#e8eaed" font-size="14" text-anchor="middle">BROWSER · D3 CANVAS</text>
  <text x="188" y="206" fill="#a8acb1" font-size="10.5" text-anchor="middle">React · D3.js semantic space</text>
  <text x="188" y="240" fill="#a8acb1" font-size="10.5" text-anchor="middle">designer types axis poles,</text>
  <text x="188" y="256" fill="#a8acb1" font-size="10.5" text-anchor="middle">drags anchors, generates shoes</text>
  <text x="188" y="282" fill="#7e828a" font-size="10.5" text-anchor="middle">holds no API keys</text>

  <!-- BACKEND (focal) -->
  <rect x="464" y="150" width="272" height="150" rx="6" fill="#1a130e" stroke="#cf7f54" stroke-width="1.5"/>
  <text x="600" y="184" fill="#cf7f54" font-size="14" text-anchor="middle">BFF BACKEND</text>
  <text x="600" y="206" fill="#a8acb1" font-size="10.5" text-anchor="middle">FastAPI · keys server-side</text>
  <text x="600" y="240" fill="#a8acb1" font-size="10.5" text-anchor="middle">projects embeddings on axes,</text>
  <text x="600" y="256" fill="#a8acb1" font-size="10.5" text-anchor="middle">brokers every external call</text>
  <text x="600" y="282" fill="#7e828a" font-size="10.5" text-anchor="middle">per-participant isolated state</text>

  <!-- EXTERNAL SERVICES (stacked) -->
  <rect x="876" y="128" width="272" height="58" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
  <text x="1012" y="153" fill="#e8eaed" font-size="13" text-anchor="middle">JINA CLIP v2</text>
  <text x="1012" y="172" fill="#a8acb1" font-size="10.5" text-anchor="middle">1024-D image + text embeddings</text>

  <rect x="876" y="196" width="272" height="58" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
  <text x="1012" y="221" fill="#e8eaed" font-size="13" text-anchor="middle">fal.ai NANO-BANANA</text>
  <text x="1012" y="240" fill="#a8acb1" font-size="10.5" text-anchor="middle">text + reference image generation</text>

  <rect x="876" y="264" width="272" height="58" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
  <text x="1012" y="289" fill="#e8eaed" font-size="13" text-anchor="middle">GOOGLE GEMINI</text>
  <text x="1012" y="308" fill="#a8acb1" font-size="10.5" text-anchor="middle">axis expansion · observer · brief</text>

  <!-- PERSISTENCE (below backend) -->
  <rect x="464" y="356" width="272" height="66" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
  <text x="600" y="382" fill="#e8eaed" font-size="13" text-anchor="middle">RAILWAY VOLUME</text>
  <text x="600" y="402" fill="#a8acb1" font-size="10.5" text-anchor="middle">JSONL study logs, per participant</text>

  <!-- Forward arrows -->
  <g stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" fill="none">
    <line x1="324" y1="225" x2="464" y2="225" marker-end="url(#sc-a)"/>
    <path d="M736 200 L806 200 L806 157 L876 157" marker-end="url(#sc-a)"/>
    <path d="M736 225 L841 225 L876 225" marker-end="url(#sc-a)"/>
    <path d="M736 250 L806 250 L806 293 L876 293" marker-end="url(#sc-a)"/>
    <line x1="600" y1="300" x2="600" y2="356" marker-end="url(#sc-a)"/>
  </g>
  <text x="394" y="217" fill="#7e828a" font-size="10" text-anchor="middle">HTTP</text>

  <!-- Feedback return arc: repositioned layout back to browser -->
  <path d="M464 275 C 400 340, 300 340, 260 320 L 220 306" fill="none" stroke="#5e636b" stroke-opacity="0.9" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#sc-b)"/>
  <text x="330" y="350" fill="#7e828a" font-size="10" text-anchor="middle">coordinates + generated images repositioned on canvas</text>
</svg>
