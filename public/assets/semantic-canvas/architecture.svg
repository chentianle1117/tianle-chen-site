<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" width="1240" height="780" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <marker id="sc-a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#cf7f54" fill-opacity="0.85"/>
    </marker>
  </defs>
  <rect width="1240" height="780" fill="#0b0d0f"/>
  <text x="60" y="50" fill="#cf7f54" font-size="20" letter-spacing="3">SEMANTIC CANVAS — ARCHITECTURE</text>
  <text x="60" y="76" fill="#7e828a" font-size="14">Pure-CLIP projection · BFF · bounded AI observer · multi-user study instrumentation</text>

  <!-- Projection pipeline -->
  <text x="60" y="128" fill="#7e828a" font-size="13" letter-spacing="3">PROJECTION PIPELINE (no learned mapping, no dim-reduction)</text>
  <g font-size="15">
    <rect x="60" y="146" width="250" height="80" rx="4" fill="#12161a" stroke="#5fa0a6" stroke-opacity="0.8"/>
    <text x="80" y="180" fill="#e8eaed">EMBED</text><text x="80" y="204" fill="#7e828a" font-size="12">Jina CLIP v2 · 1024-D text+image</text>
    <rect x="358" y="146" width="250" height="80" rx="4" fill="#12161a" stroke="#9b6fc9" stroke-opacity="0.8"/>
    <text x="378" y="180" fill="#e8eaed">PROJECT</text><text x="378" y="204" fill="#7e828a" font-size="12">dot(v, axisₐ − axis_b)</text>
    <rect x="656" y="146" width="250" height="80" rx="4" fill="#12161a" stroke="#7aa15c" stroke-opacity="0.8"/>
    <text x="676" y="180" fill="#e8eaed">NORMALIZE</text><text x="676" y="204" fill="#7e828a" font-size="12">to [−1, +1]²</text>
    <rect x="954" y="146" width="226" height="80" rx="4" fill="#1a130e" stroke="#cf7f54" stroke-width="2"/>
    <text x="974" y="180" fill="#cf7f54">RENDER</text><text x="974" y="204" fill="#7e828a" font-size="12">D3 canvas · ease 800ms</text>
  </g>
  <g stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" fill="none">
    <line x1="310" y1="186" x2="358" y2="186" marker-end="url(#sc-a)"/>
    <line x1="608" y1="186" x2="656" y2="186" marker-end="url(#sc-a)"/>
    <line x1="906" y1="186" x2="954" y2="186" marker-end="url(#sc-a)"/>
  </g>
  <text x="60" y="256" fill="#7e828a" font-size="12">Designer types the two semantic axes in natural language → positions come straight from a dot product, so the layout stays legible.</text>

  <!-- Service architecture -->
  <text x="60" y="320" fill="#7e828a" font-size="13" letter-spacing="3">SERVICE ARCHITECTURE (BFF — keys server-side)</text>
  <g font-size="15">
    <rect x="60" y="340" width="330" height="150" rx="6" fill="#101418" stroke="#5e636b" stroke-opacity="0.6"/>
    <text x="80" y="368" fill="#e8eaed">FRONTEND</text>
    <g font-size="12.5" fill="#7e828a"><text x="80" y="394">React 18 · TypeScript · Vite</text><text x="80" y="416">D3.js 7 (canvas + genealogy)</text><text x="80" y="438">Zustand state · Axios</text><text x="80" y="460">Lineage view · mood-board styles</text></g>

    <rect x="455" y="340" width="330" height="150" rx="6" fill="#101418" stroke="#cf7f54" stroke-opacity="0.7"/>
    <text x="475" y="368" fill="#cf7f54">BACKEND — FastAPI</text>
    <g font-size="12.5" fill="#7e828a"><text x="475" y="394">per-participant ContextVar isolation</text><text x="475" y="416">embedding cache (.pkl per hash)</text><text x="475" y="438">JSONL event logging</text><text x="475" y="460">session persistence · /api/health</text></g>

    <rect x="850" y="340" width="330" height="150" rx="6" fill="#101418" stroke="#5e636b" stroke-opacity="0.6"/>
    <text x="870" y="368" fill="#e8eaed">EXTERNAL</text>
    <g font-size="12.5" fill="#7e828a"><text x="870" y="394">Jina AI — CLIP v2 embeddings</text><text x="870" y="416">fal.ai — nano-banana generation</text><text x="870" y="438">Gemini — bounded observer</text><text x="870" y="460">(passive insights, sticky timers)</text></g>
  </g>
  <g stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" fill="none">
    <line x1="390" y1="415" x2="455" y2="415" marker-end="url(#sc-a)"/>
    <line x1="785" y1="415" x2="850" y2="415" marker-end="url(#sc-a)"/>
  </g>

  <!-- footer -->
  <rect x="60" y="540" width="1120" height="64" rx="6" fill="#12161a" stroke="#5e636b" stroke-opacity="0.5"/>
  <text x="80" y="568" fill="#d8dadd" font-size="14">MULTI-USER STUDY MODE</text>
  <text x="80" y="590" fill="#7e828a" font-size="12.5">per-participant URLs + isolated sessions + JSONL event logs (create / branch / generate / select / feedback) · dataset: Zappos50K (curated + generated variants) · deployed on Railway</text>
  <text x="60" y="648" fill="#7e828a" font-size="13">Thesis argument: design software should make AI <tspan fill="#cf7f54">legible</tspan> to the designer — more agency, not just more capability.</text>
</svg>
