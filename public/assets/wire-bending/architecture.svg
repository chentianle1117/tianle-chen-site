<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <marker id="wb-a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#cf7f54" fill-opacity="0.85"/>
    </marker>
    <marker id="wb-teal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#5fa0a6" fill-opacity="0.9"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#0b0d0f"/>

  <!-- faint grid -->
  <g stroke="#5e636b" stroke-opacity="0.10" stroke-width="1">
    <line x1="0" y1="190" x2="1200" y2="190"/>
    <line x1="0" y1="440" x2="1200" y2="440"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <text x="60" y="50" fill="#cf7f54" font-size="17" letter-spacing="3">WIRE-BENDING MIXED-REALITY WORKFLOW</text>
  <text x="60" y="74" fill="#7e828a" font-size="13">Grasshopper parametric definition &#8596; Fologram bridge &#8596; HoloLens overlay &#8596; hand fabrication &#8212; one round-trip loop</text>

  <!-- ===== LANE HEADERS ===== -->
  <text x="60"  y="120" fill="#7e828a" font-size="12" letter-spacing="3">DIGITAL &#183; RHINO / GRASSHOPPER (laptop)</text>
  <text x="470" y="120" fill="#7e828a" font-size="12" letter-spacing="3">BRIDGE &#183; FOLOGRAM</text>
  <text x="800" y="120" fill="#7e828a" font-size="12" letter-spacing="3">MIXED REALITY &#183; HOLOLENS VIEW</text>

  <!-- ===== DIGITAL COLUMN (Grasshopper pipeline) ===== -->
  <g font-size="14">
    <rect x="60" y="138" width="340" height="70" rx="5" fill="#12161a" stroke="#5fa0a6" stroke-opacity="0.8"/>
    <text x="80" y="166" fill="#e8eaed">1 &#183; INPUT GEOMETRY ORGANIZATION</text>
    <text x="80" y="188" fill="#a8acb1" font-size="11">sort / reorient input curves &#183; regularize into a bend-ready wireframe</text>

    <rect x="60" y="224" width="340" height="70" rx="5" fill="#12161a" stroke="#9b6fc9" stroke-opacity="0.85"/>
    <text x="80" y="252" fill="#e8eaed">2 &#183; PART &#8594; WIRE-BENDING TRANSFER</text>
    <text x="80" y="274" fill="#a8acb1" font-size="11">segment into parts &#183; per-bend angle + straight run &#183; RadiusBender solve</text>

    <rect x="60" y="310" width="340" height="82" rx="5" fill="#12161a" stroke="#7aa15c" stroke-opacity="0.8"/>
    <text x="80" y="338" fill="#e8eaed">3 &#183; FOLOGRAM INTERFACE MODULE</text>
    <text x="80" y="360" fill="#a8acb1" font-size="11">bending index / part navigation &#183; static + interactive</text>
    <text x="80" y="378" fill="#a8acb1" font-size="11">gesture-button logic &#183; readouts (total length, part #, bend #)</text>
  </g>
  <!-- internal GH arrows -->
  <g stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" fill="none">
    <line x1="230" y1="208" x2="230" y2="224" marker-end="url(#wb-a)"/>
    <line x1="230" y1="294" x2="230" y2="310" marker-end="url(#wb-a)"/>
  </g>

  <!-- ===== BRIDGE: Fologram + QR anchor ===== -->
  <g font-size="14">
    <rect x="470" y="200" width="250" height="120" rx="6" fill="#1a130e" stroke="#cf7f54" stroke-width="2"/>
    <text x="490" y="230" fill="#cf7f54">FOLOGRAM</text>
    <text x="490" y="254" fill="#a8acb1" font-size="11">Rhino/GH plug-in + HoloLens app</text>
    <text x="490" y="276" fill="#a8acb1" font-size="11">live bidirectional sync of geometry,</text>
    <text x="490" y="292" fill="#a8acb1" font-size="11">text + interactive UI &#8212; no export step</text>
    <text x="490" y="312" fill="#7e828a" font-size="11">designer-as-fabricator, not robot</text>
  </g>

  <!-- QR spatial anchor -->
  <g font-size="13">
    <rect x="470" y="344" width="250" height="66" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
    <text x="490" y="370" fill="#e8eaed">QR SPATIAL ANCHOR</text>
    <text x="490" y="391" fill="#a8acb1" font-size="11">printed marker &#183; 190&#160;mm @ Letter</text>
    <text x="490" y="406" fill="#a8acb1" font-size="11">origin (0,0,0) &#183; mm &#183; registers GH world to bench</text>
  </g>

  <!-- ===== MIXED REALITY COLUMN (HoloLens view) ===== -->
  <g font-size="14">
    <rect x="800" y="138" width="340" height="86" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
    <text x="820" y="166" fill="#e8eaed">AR OVERLAY ON THE BENCH</text>
    <text x="820" y="188" fill="#a8acb1" font-size="11">target wireframe (magenta) &#183; current wire (teal)</text>
    <text x="820" y="206" fill="#a8acb1" font-size="11">bender jig ghost (orange) locked to physical tool</text>

    <rect x="800" y="240" width="340" height="86" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
    <text x="820" y="268" fill="#e8eaed">STEP READOUTS &#38; HUD</text>
    <text x="820" y="290" fill="#a8acb1" font-size="11">&#8220;Part #0 &#183; Bend #2&#8221; &#183; &#8220;Total Length 594.2&#8221;</text>
    <text x="820" y="308" fill="#a8acb1" font-size="11">next bend angle + position called out in place</text>

    <rect x="800" y="342" width="340" height="86" rx="5" fill="#12161a" stroke="#cf7f54" stroke-opacity="0.7"/>
    <text x="820" y="370" fill="#cf7f54">GESTURE BUTTONS (hands-free)</text>
    <text x="820" y="392" fill="#a8acb1" font-size="11">P / B toggles &#183; next / prev part &#183; next / prev bend</text>
    <text x="820" y="410" fill="#a8acb1" font-size="11">air-tap to advance &#8212; no keyboard at the tool</text>
  </g>

  <!-- ===== ROUND-TRIP ARROWS ===== -->
  <!-- GH -> Fologram (push geometry+UI) -->
  <path d="M400,265 C430,265 445,260 470,260" fill="none" stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" marker-end="url(#wb-a)"/>
  <text x="404" y="250" fill="#7e828a" font-size="10.5">push model + UI</text>

  <!-- Fologram -> HoloLens (render) -->
  <path d="M720,200 C755,190 770,181 800,181" fill="none" stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" marker-end="url(#wb-a)"/>
  <text x="726" y="172" fill="#7e828a" font-size="10.5">render overlay</text>

  <!-- HoloLens gestures -> Fologram (state back) -->
  <path d="M800,385 C760,385 748,360 720,360" fill="none" stroke="#5fa0a6" stroke-opacity="0.7" stroke-width="1.6" marker-end="url(#wb-teal)"/>
  <text x="726" y="352" fill="#5fa0a6" font-size="10.5">gesture &#8594; state</text>

  <!-- Fologram -> GH (interface state updates definition) -->
  <path d="M470,300 C440,320 420,360 400,375" fill="none" stroke="#5fa0a6" stroke-opacity="0.7" stroke-width="1.6" marker-end="url(#wb-teal)"/>
  <text x="404" y="405" fill="#5fa0a6" font-size="10.5">step state &#8594; GH</text>

  <!-- ===== PHYSICAL FABRICATION ROW ===== -->
  <text x="60" y="480" fill="#7e828a" font-size="12" letter-spacing="3">PHYSICAL &#183; HAND FABRICATION AT THE BENCH</text>
  <g font-size="14">
    <rect x="60" y="498" width="250" height="86" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
    <text x="80" y="526" fill="#e8eaed">MANUAL RADIUS BENDER</text>
    <text x="80" y="548" fill="#a8acb1" font-size="11">bench tool + laser-cut angle jig</text>
    <text x="80" y="566" fill="#a8acb1" font-size="11">30&#176; &#183; 2.70 / 2.18 / 0.42 template (recut 1106)</text>

    <rect x="345" y="498" width="250" height="86" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
    <text x="365" y="526" fill="#e8eaed">BEND TO THE GUIDE</text>
    <text x="365" y="548" fill="#a8acb1" font-size="11">align wire to magenta target</text>
    <text x="365" y="566" fill="#a8acb1" font-size="11">read angle + length off the HUD, bend by hand</text>

    <rect x="630" y="498" width="250" height="86" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
    <text x="650" y="526" fill="#e8eaed">ADVANCE STEP</text>
    <text x="650" y="548" fill="#a8acb1" font-size="11">air-tap next bend / next part</text>
    <text x="650" y="566" fill="#a8acb1" font-size="11">overlay updates to the following segment</text>

    <rect x="915" y="498" width="225" height="86" rx="5" fill="#1a130e" stroke="#cf7f54" stroke-width="2"/>
    <text x="935" y="526" fill="#cf7f54">BUILT WIRE FORM</text>
    <text x="935" y="548" fill="#a8acb1" font-size="11">multi-part bent-wire</text>
    <text x="935" y="566" fill="#a8acb1" font-size="11">structure / installation</text>
  </g>
  <!-- fabrication row arrows -->
  <g stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" fill="none">
    <line x1="310" y1="541" x2="345" y2="541" marker-end="url(#wb-a)"/>
    <line x1="595" y1="541" x2="630" y2="541" marker-end="url(#wb-a)"/>
    <line x1="880" y1="541" x2="915" y2="541" marker-end="url(#wb-a)"/>
  </g>

  <!-- HoloLens guides fabrication (down) -->
  <path d="M900,428 C880,455 500,470 190,498" fill="none" stroke="#cf7f54" stroke-opacity="0.35" stroke-width="1.4" stroke-dasharray="3 6" marker-end="url(#wb-a)"/>
  <text x="470" y="466" fill="#7e828a" font-size="10.5">overlay guides the hand</text>

  <!-- feedback: measured piece / step advance loops back up to GH -->
  <path d="M755,498 C760,455 740,432 720,410" fill="none" stroke="#5fa0a6" stroke-opacity="0.6" stroke-width="1.6" stroke-dasharray="3 6" marker-end="url(#wb-teal)"/>
  <text x="600" y="466" fill="#5fa0a6" font-size="10.5">air-tap advances the step &#8594; back to interface</text>

  <!-- ===== FOOTER ===== -->
  <rect x="60" y="614" width="1080" height="112" rx="6" fill="#101418" stroke="#5e636b" stroke-opacity="0.5"/>
  <text x="80" y="642" fill="#cf7f54" font-size="14" letter-spacing="2">WHY IT&#8217;S A LOOP, NOT A HAND-OFF</text>
  <text x="80" y="668" fill="#d8dadd" font-size="12.5">Fologram keeps Grasshopper and the HoloLens in continuous sync &#8212; edit the parametric definition and the AR overlay updates live;</text>
  <text x="80" y="688" fill="#d8dadd" font-size="12.5">air-tap a gesture button at the bench and the interface advances the step, so the fabricator drives the model without leaving the tool.</text>
  <text x="80" y="712" fill="#7e828a" font-size="12">Computational precision (angles, lengths, sequencing) + full hand agency &#8212; interactive fabrication instead of full robotic automation.</text>

  <!-- toolchain tag -->
  <text x="1140" y="748" text-anchor="end" fill="#7e828a" font-size="11">Rhino 8 &#183; Grasshopper &#183; Fologram &#183; Microsoft HoloLens &#183; RadiusBender &#183; CMU 48-736 (Prof. Vernelle Noel)</text>
</svg>
