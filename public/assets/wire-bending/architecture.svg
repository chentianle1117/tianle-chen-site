<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#cf7f54" fill-opacity="0.8"/>
    </marker>
    <marker id="ar-dim" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#7e828a" fill-opacity="0.8"/>
    </marker>
  </defs>
  <rect width="1200" height="440" fill="#0b0d0f"/>

  <text x="60" y="52" fill="#cf7f54" font-size="16" letter-spacing="3">WIRE-BENDING &#183; MIXED-REALITY FABRICATION LOOP</text>
  <text x="60" y="76" fill="#7e828a" font-size="12.5">A person bends steel wire by hand to computational precision, with Grasshopper and the HoloLens in live two-way sync.</text>

  <!-- ===== FORWARD FLOW (left to right) ===== -->

  <!-- 1 · Grasshopper -->
  <rect x="60" y="180" width="230" height="88" rx="6" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
  <text x="175" y="219" fill="#e8eaed" font-size="14" text-anchor="middle">GRASSHOPPER</text>
  <text x="175" y="242" fill="#a8acb1" font-size="10.5" text-anchor="middle">defines &amp; sequences the bends</text>

  <!-- 2 · Fologram bridge -->
  <rect x="360" y="180" width="230" height="88" rx="6" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
  <text x="475" y="219" fill="#e8eaed" font-size="14" text-anchor="middle">FOLOGRAM</text>
  <text x="475" y="242" fill="#a8acb1" font-size="10.5" text-anchor="middle">bridge, no export step</text>

  <!-- 3 · HoloLens overlay -->
  <rect x="660" y="180" width="230" height="88" rx="6" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
  <text x="775" y="219" fill="#e8eaed" font-size="14" text-anchor="middle">HOLOLENS OVERLAY</text>
  <text x="775" y="242" fill="#a8acb1" font-size="10.5" text-anchor="middle">target &amp; step readouts on the bench</text>

  <!-- 4 · Built form (focal) -->
  <rect x="960" y="180" width="180" height="88" rx="6" fill="#1a130e" stroke="#cf7f54" stroke-width="2"/>
  <text x="1050" y="219" fill="#cf7f54" font-size="14" text-anchor="middle">BUILT WIRE FORM</text>
  <text x="1050" y="242" fill="#a8acb1" font-size="10.5" text-anchor="middle">bent by hand, no robot</text>

  <!-- forward arrows -->
  <path d="M290,224 L360,224" fill="none" stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M590,224 L660,224" fill="none" stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M890,224 L960,224" fill="none" stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" marker-end="url(#ar)"/>

  <text x="325" y="212" fill="#7e828a" font-size="10.5" text-anchor="middle">push</text>
  <text x="625" y="212" fill="#7e828a" font-size="10.5" text-anchor="middle">render</text>
  <text x="925" y="212" fill="#7e828a" font-size="10.5" text-anchor="middle">bend</text>

  <!-- ===== SINGLE DASHED RETURN ARC (the loop) ===== -->
  <path d="M775,180 C775,110 475,110 475,180" fill="none" stroke="#7e828a" stroke-opacity="0.7" stroke-width="1.6" stroke-dasharray="4 5" marker-end="url(#ar-dim)"/>
  <text x="625" y="120" fill="#7e828a" font-size="10.5" text-anchor="middle">air-tap gesture advances the step</text>

  <!-- footnote -->
  <text x="60" y="392" fill="#7e828a" font-size="11">A printed QR marker pins Grasshopper&#8217;s origin to the bench so the overlay lands on the physical tool.</text>
  <text x="60" y="410" fill="#7e828a" font-size="11">Rhino 8 &#183; Grasshopper &#183; Fologram &#183; Microsoft HoloLens &#183; manual RadiusBender &#183; CMU 48-736, Prof. Vernelle Noel</text>
</svg>
