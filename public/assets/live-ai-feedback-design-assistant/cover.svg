<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <radialGradient id="lg" cx="44%" cy="48%" r="78%">
      <stop offset="0%" stop-color="#15191e"/>
      <stop offset="100%" stop-color="#0b0d0f"/>
    </radialGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5fa0a6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5fa0a6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#lg)"/>

  <!-- designer's canvas (observed) -->
  <rect x="120" y="300" width="440" height="330" rx="12" fill="#12161a" stroke="#5e636b" stroke-opacity="0.55" stroke-width="1.4"/>
  <rect x="120" y="300" width="440" height="34" rx="12" fill="#1a1f24"/>
  <circle cx="144" cy="317" r="5" fill="#cf7f54"/><circle cx="164" cy="317" r="5" fill="#c98f4b"/><circle cx="184" cy="317" r="5" fill="#7aa15c"/>
  <!-- canvas content blocks -->
  <rect x="150" y="364" width="170" height="110" rx="5" fill="#1a1f24" stroke="#5e636b" stroke-opacity="0.4"/>
  <rect x="342" y="364" width="188" height="50" rx="5" fill="#1a1f24" stroke="#5e636b" stroke-opacity="0.4"/>
  <rect x="342" y="426" width="188" height="48" rx="5" fill="#1a1f24" stroke="#5e636b" stroke-opacity="0.4"/>
  <rect x="150" y="494" width="380" height="112" rx="5" fill="#1a1f24" stroke="#5e636b" stroke-opacity="0.4"/>
  <!-- AI focus ring on one element -->
  <rect x="338" y="360" width="196" height="58" rx="7" fill="none" stroke="#cf7f54" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- observer node (the AI watching) -->
  <circle cx="740" cy="465" r="66" fill="url(#eye)"/>
  <circle cx="740" cy="465" r="42" fill="none" stroke="#5fa0a6" stroke-opacity="0.55" stroke-width="1.5"/>
  <circle cx="740" cy="465" r="27" fill="#12161a" stroke="#5fa0a6" stroke-width="2"/>
  <circle cx="740" cy="465" r="9" fill="#5fa0a6"/>
  <!-- watch line: focus element -> observer -->
  <path d="M540,392 C640,410 660,440 700,458" fill="none" stroke="#5fa0a6" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- suggestion chips (alongside, no text — placeholder bars) -->
  <g>
    <rect x="880" y="356" width="210" height="52" rx="8" fill="#12161a" stroke="#5e636b" stroke-opacity="0.5"/>
    <rect x="880" y="356" width="4" height="52" rx="2" fill="#5fa0a6"/>
    <rect x="902" y="372" width="150" height="6" rx="3" fill="#a8acb1" fill-opacity="0.5"/>
    <rect x="902" y="386" width="110" height="6" rx="3" fill="#7e828a" fill-opacity="0.5"/>

    <rect x="900" y="440" width="210" height="52" rx="8" fill="#12161a" stroke="#5e636b" stroke-opacity="0.5"/>
    <rect x="900" y="440" width="4" height="52" rx="2" fill="#c98f4b"/>
    <rect x="922" y="456" width="150" height="6" rx="3" fill="#a8acb1" fill-opacity="0.5"/>
    <rect x="922" y="470" width="96" height="6" rx="3" fill="#7e828a" fill-opacity="0.5"/>

    <rect x="880" y="524" width="210" height="52" rx="8" fill="#12161a" stroke="#5e636b" stroke-opacity="0.5"/>
    <rect x="880" y="524" width="4" height="52" rx="2" fill="#5fa0a6"/>
    <rect x="902" y="540" width="140" height="6" rx="3" fill="#a8acb1" fill-opacity="0.5"/>
    <rect x="902" y="554" width="120" height="6" rx="3" fill="#7e828a" fill-opacity="0.5"/>
  </g>
  <!-- observer -> suggestions (emit) -->
  <g stroke="#cf7f54" stroke-opacity="0.4" stroke-width="1.5" fill="none">
    <path d="M784,448 L878,384"/>
    <path d="M790,465 L898,466"/>
    <path d="M784,486 L878,548"/>
  </g>

  <!-- faint constellation -->
  <g fill="#5fa0a6" fill-opacity="0.14"><circle cx="250" cy="180" r="4"/><circle cx="1020" cy="200" r="4"/><circle cx="1080" cy="720" r="3.5"/></g>
</svg>
