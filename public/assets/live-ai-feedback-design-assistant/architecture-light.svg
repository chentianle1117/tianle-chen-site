<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b45f2c" fill-opacity="0.8"/>
    </marker>
    <marker id="ard" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#57534b" fill-opacity="0.7"/>
    </marker>
  </defs>
  <rect width="1200" height="470" fill="#faf9f5"/>

  <text x="48" y="46" fill="#b45f2c" font-size="16" letter-spacing="3">LIVE AI FEEDBACK · REAL-TIME CRITIQUE LOOP</text>
  <text x="48" y="70" fill="#6f6a60" font-size="12.5">A bounded observer watches the live canvas and speaks critique back — it never edits the design.</text>

  <!-- NODE 1: DESIGNER -->
  <rect x="150" y="150" width="230" height="90" rx="6" fill="#f2f1ec" stroke="#cbc7ba" stroke-opacity="0.7"/>
  <text x="265" y="192" fill="#1a1714" font-size="14" text-anchor="middle">DESIGNER</text>
  <text x="265" y="214" fill="#57534b" font-size="10.5" text-anchor="middle">working canvas + voice</text>

  <!-- NODE 2: CAPTURE -->
  <rect x="450" y="150" width="230" height="90" rx="6" fill="#f2f1ec" stroke="#cbc7ba" stroke-opacity="0.7"/>
  <text x="565" y="192" fill="#1a1714" font-size="14" text-anchor="middle">ELECTRON RENDERER</text>
  <text x="565" y="214" fill="#57534b" font-size="10.5" text-anchor="middle">captures screen frames + mic</text>

  <!-- NODE 3: GEMINI (focal) -->
  <rect x="750" y="150" width="300" height="90" rx="6" fill="#f6ece4" stroke="#b45f2c" stroke-width="2"/>
  <text x="900" y="185" fill="#1a1714" font-size="14" text-anchor="middle">GEMINI 2.0 FLASH</text>
  <text x="900" y="207" fill="#b45f2c" font-size="10.5" text-anchor="middle">reasons over the live screen</text>
  <text x="900" y="223" fill="#57534b" font-size="10.5" text-anchor="middle">phased tool-calling critique</text>

  <!-- NODE 4: SPOKEN CRITIQUE -->
  <rect x="750" y="320" width="300" height="90" rx="6" fill="#f2f1ec" stroke="#cbc7ba" stroke-opacity="0.7"/>
  <text x="900" y="362" fill="#1a1714" font-size="14" text-anchor="middle">SPOKEN CRITIQUE</text>
  <text x="900" y="384" fill="#57534b" font-size="10.5" text-anchor="middle">one question at a time, out loud</text>

  <!-- forward arrows (single L-to-R axis on top row) -->
  <g fill="none" stroke="#b45f2c" stroke-opacity="0.5" stroke-width="1.6">
    <path d="M380 195 L444 195" marker-end="url(#ar)"/>
    <path d="M680 195 L744 195" marker-end="url(#ar)"/>
    <!-- Gemini down to spoken critique -->
    <path d="M900 240 L900 314" marker-end="url(#ar)"/>
  </g>
  <text x="412" y="185" fill="#6f6a60" font-size="10" text-anchor="middle">stream</text>
  <text x="712" y="185" fill="#6f6a60" font-size="10" text-anchor="middle">WebSocket</text>

  <!-- dashed feedback return arc: spoken critique back to designer -->
  <path d="M750 365 C 470 430, 300 420, 265 244" fill="none" stroke="#57534b" stroke-opacity="0.6" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#ard)"/>
  <text x="470" y="420" fill="#6f6a60" font-size="10.5" text-anchor="middle">designer keeps working → next frame feeds the next turn</text>

  <text x="48" y="452" fill="#6f6a60" font-size="11">Downscaled frames (~1 / 5 s) + 16 kHz voice stream over one bidirectional socket; critique is spoken so it sits beside the work, not in a chat window.</text>
</svg>
