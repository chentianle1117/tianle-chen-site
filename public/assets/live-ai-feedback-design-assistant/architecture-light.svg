<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <marker id="la-a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#bf6a37" fill-opacity="0.85"/>
    </marker>
  </defs>
  <rect width="1200" height="860" fill="#faf9f5"/>

  <!-- faint grid -->
  <g stroke="#8a8d93" stroke-opacity="0.10">
    <line x1="0" y1="215" x2="1200" y2="215"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <text x="60" y="50" fill="#bf6a37" font-size="17" letter-spacing="3">LIVE AI FEEDBACK — REAL-TIME CRITIQUE LOOP</text>
  <text x="60" y="74" fill="#77726a" font-size="13">Electron desktop companion · Gemini Multimodal Live API (bidirectional WebSocket) · phased tool-calling critique</text>

  <!-- ================= LANE 1: CAPTURE ================= -->
  <text x="60" y="118" fill="#77726a" font-size="13" letter-spacing="3">CAPTURE  —  ELECTRON RENDERER (React 18 · TypeScript · Vite)</text>
  <g font-size="15">
    <!-- desktopCapturer -->
    <rect x="60" y="136" width="250" height="76" rx="5" fill="#f6f5f0" stroke="#3c868c" stroke-opacity="0.8"/>
    <text x="80" y="166" fill="#1a1714">SCREEN SOURCE</text>
    <text x="80" y="188" fill="#77726a" font-size="11.5">desktopCapturer.getSources</text>
    <text x="80" y="203" fill="#77726a" font-size="11.5">windows + full screens (IPC)</text>

    <!-- video frames -->
    <rect x="345" y="136" width="250" height="76" rx="5" fill="#f6f5f0" stroke="#3c868c" stroke-opacity="0.8"/>
    <text x="365" y="166" fill="#1a1714">VIDEO FRAMES</text>
    <text x="365" y="188" fill="#77726a" font-size="11.5">canvas → JPEG @ 0.25 scale</text>
    <text x="365" y="203" fill="#77726a" font-size="11.5">1 frame / 5 s (base64)</text>

    <!-- mic audio -->
    <rect x="630" y="136" width="250" height="76" rx="5" fill="#f6f5f0" stroke="#3c868c" stroke-opacity="0.8"/>
    <text x="650" y="166" fill="#1a1714">MIC AUDIO</text>
    <text x="650" y="188" fill="#77726a" font-size="11.5">AudioRecorder worklet</text>
    <text x="650" y="203" fill="#77726a" font-size="11.5">PCM 16 kHz · streamed live</text>

    <!-- session context -->
    <rect x="915" y="136" width="225" height="76" rx="5" fill="#f6f5f0" stroke="#3c868c" stroke-opacity="0.8"/>
    <text x="935" y="166" fill="#1a1714">SESSION CONTEXT</text>
    <text x="935" y="188" fill="#77726a" font-size="11.5">users · pain points · vision</text>
    <text x="935" y="203" fill="#77726a" font-size="11.5">mode + focus (Settings tab)</text>
  </g>

  <!-- down arrows to transport -->
  <g stroke="#bf6a37" stroke-opacity="0.45" stroke-width="1.6" fill="none">
    <line x1="185" y1="212" x2="185" y2="250" marker-end="url(#la-a)"/>
    <line x1="470" y1="212" x2="470" y2="250" marker-end="url(#la-a)"/>
    <line x1="755" y1="212" x2="755" y2="250" marker-end="url(#la-a)"/>
    <line x1="1027" y1="212" x2="1027" y2="250" marker-end="url(#la-a)"/>
  </g>

  <!-- ================= TRANSPORT ================= -->
  <rect x="60" y="252" width="1080" height="66" rx="6" fill="#f9efe4" stroke="#bf6a37" stroke-width="2"/>
  <text x="80" y="282" fill="#bf6a37" font-size="15">MultimodalLiveClient  —  WebSocket  wss://generativelanguage.googleapis.com …BidiGenerateContent</text>
  <text x="80" y="305" fill="#77726a" font-size="12">sendRealtimeInput(image/jpeg + audio/pcm) · send(text) · sendToolResponse() · emits: content · toolcall · audio · turncomplete · interrupted</text>

  <!-- arrow down to model -->
  <g stroke="#bf6a37" stroke-opacity="0.45" stroke-width="1.6" fill="none">
    <line x1="600" y1="318" x2="600" y2="356" marker-end="url(#la-a)"/>
  </g>

  <!-- ================= LANE 2: ANALYZE (model) ================= -->
  <text x="60" y="352" fill="#77726a" font-size="13" letter-spacing="3">ANALYZE  —  GEMINI 2.0 FLASH (multimodal live · server-side reasoning over screen + voice)</text>
  <g font-size="15">
    <rect x="60" y="368" width="1080" height="150" rx="6" fill="#f0efe9" stroke="#7a4fb0" stroke-opacity="0.75"/>
    <text x="80" y="396" fill="#1a1714">models/gemini-2.0-flash-exp</text>
    <text x="80" y="418" fill="#77726a" font-size="12">systemInstruction: "supportive design co-pilot" — facilitative, questions over commands, never designs for the user</text>

    <!-- tool chips -->
    <rect x="80" y="436" width="235" height="66" rx="4" fill="#f6f5f0" stroke="#8a8d93" stroke-opacity="0.5"/>
    <text x="96" y="461" fill="#bf6a37" font-size="12.5">ask_initial_questions()</text>
    <text x="96" y="481" fill="#77726a" font-size="11">→ app returns questioning guide</text>
    <text x="96" y="496" fill="#77726a" font-size="11">identify element · clarify intent</text>

    <rect x="330" y="436" width="235" height="66" rx="4" fill="#f6f5f0" stroke="#8a8d93" stroke-opacity="0.5"/>
    <text x="346" y="461" fill="#bf6a37" font-size="12.5">provide_feedback()</text>
    <text x="346" y="481" fill="#77726a" font-size="11">→ getFeedbackGuidance(mode,type)</text>
    <text x="346" y="496" fill="#77726a" font-size="11">injects Diverge/Converge prompt</text>

    <rect x="580" y="436" width="235" height="66" rx="4" fill="#f6f5f0" stroke="#8a8d93" stroke-opacity="0.5"/>
    <text x="596" y="461" fill="#bf6a37" font-size="12.5">list_design_critiques()</text>
    <text x="596" y="481" fill="#77726a" font-size="11">→ replaces full notes array</text>
    <text x="596" y="496" fill="#77726a" font-size="11">category · description · priority</text>

    <rect x="830" y="436" width="290" height="66" rx="4" fill="#f6f5f0" stroke="#8a8d93" stroke-opacity="0.5"/>
    <text x="846" y="461" fill="#bf6a37" font-size="12.5">googleSearch (built-in tool)</text>
    <text x="846" y="481" fill="#77726a" font-size="11">grounding for principle-based</text>
    <text x="846" y="496" fill="#77726a" font-size="11">observations when useful</text>
  </g>

  <!-- onToolCall loop annotation: model -> app -> model -->
  <g stroke="#bf6a37" stroke-opacity="0.45" stroke-width="1.6" fill="none">
    <path d="M1140 443 C 1178 443, 1178 300, 1146 288" marker-end="url(#la-a)"/>
  </g>
  <text x="1000" y="360" fill="#77726a" font-size="11">tool call ↺ App.onToolCall</text>
  <text x="1000" y="374" fill="#77726a" font-size="11">prompt guide → sendToolResponse</text>

  <!-- arrow down to surface -->
  <g stroke="#bf6a37" stroke-opacity="0.45" stroke-width="1.6" fill="none">
    <line x1="300" y1="518" x2="300" y2="636" marker-end="url(#la-a)"/>
    <line x1="600" y1="518" x2="600" y2="636" marker-end="url(#la-a)"/>
    <line x1="900" y1="518" x2="900" y2="636" marker-end="url(#la-a)"/>
  </g>

  <!-- ================= LANE 3: SURFACE ================= -->
  <text x="60" y="632" fill="#77726a" font-size="13" letter-spacing="3">SURFACE  —  ALONGSIDE THE DESIGNER (400×700 companion window, not a modal)</text>
  <g font-size="15">
    <rect x="60" y="648" width="340" height="120" rx="5" fill="#f6f5f0" stroke="#5a8038" stroke-opacity="0.8"/>
    <text x="80" y="678" fill="#1a1714">SPOKEN CRITIQUE</text>
    <text x="80" y="702" fill="#77726a" font-size="11.5">Gemini audio out (voice: Aoede)</text>
    <text x="80" y="722" fill="#77726a" font-size="11.5">AudioStreamer → speakers (PCM16)</text>
    <text x="80" y="742" fill="#77726a" font-size="11.5">one question at a time, conversational</text>

    <rect x="430" y="648" width="340" height="120" rx="5" fill="#f6f5f0" stroke="#5a8038" stroke-opacity="0.8"/>
    <text x="450" y="678" fill="#1a1714">DESIGN NOTES PANEL</text>
    <text x="450" y="702" fill="#77726a" font-size="11.5">live critique list, silently maintained</text>
    <text x="450" y="722" fill="#77726a" font-size="11.5">category / priority (High·Med·Low)</text>
    <text x="450" y="742" fill="#77726a" font-size="11.5">persisted to localStorage</text>

    <rect x="800" y="648" width="340" height="120" rx="5" fill="#f6f5f0" stroke="#5a8038" stroke-opacity="0.8"/>
    <text x="820" y="678" fill="#1a1714">FIGMA WRITE-BACK</text>
    <text x="820" y="702" fill="#77726a" font-size="11.5">Figma REST — comment on node</text>
    <text x="820" y="722" fill="#77726a" font-size="11.5">anchors feedback to the artboard</text>
    <text x="820" y="742" fill="#77726a" font-size="11.5">(exploratory integration)</text>
  </g>

  <!-- loop-back arrow: surface -> capture -->
  <g stroke="#bf6a37" stroke-opacity="0.35" stroke-width="1.6" fill="none" stroke-dasharray="5 5">
    <path d="M60 708 C 24 708, 24 174, 56 174" marker-end="url(#la-a)"/>
  </g>
  <text x="70" y="808" fill="#77726a" font-size="12">Loop: the designer keeps working → next frame + reply feed the next turn. Feedback stays grounded in the current canvas state, never a stale snapshot.</text>
  <text x="70" y="832" fill="#77726a" font-size="12">Bounded observer: the AI critiques and questions — it does not edit the design. Same design philosophy later carried into <tspan fill="#bf6a37">Semantic Canvas</tspan>.</text>
</svg>
