<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <marker id="sb-a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#cf7f54" fill-opacity="0.8"/>
    </marker>
    <marker id="sb-d" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#a8acb1" fill-opacity="0.8"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#0b0d0f"/>

  <text x="80" y="52" fill="#cf7f54" font-size="16" letter-spacing="3">SKILL-BRIDGE · DATA PIPELINE</text>
  <text x="80" y="78" fill="#7e828a" font-size="12.5">One cleaned dataset splits into two JSON artifacts that feed three D3 views, kept in sync by a shared store.</text>

  <!-- 1 · SOURCE -->
  <rect x="480" y="118" width="240" height="64" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
  <text x="600" y="147" fill="#e8eaed" font-size="14" text-anchor="middle">Raw LinkedIn CSV</text>
  <text x="600" y="167" fill="#a8acb1" font-size="10.5" text-anchor="middle">2023 job postings</text>

  <line x1="600" y1="182" x2="600" y2="212" stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" fill="none" marker-end="url(#sb-a)"/>

  <!-- 2 · CLEAN & PARSE -->
  <rect x="440" y="214" width="320" height="64" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
  <text x="600" y="243" fill="#e8eaed" font-size="14" text-anchor="middle">Clean &amp; parse (Python)</text>
  <text x="600" y="263" fill="#a8acb1" font-size="10.5" text-anchor="middle">normalize titles, extract skills, geocode</text>

  <!-- split to two artifacts -->
  <path d="M540,278 L540,300 L340,300 L340,322" stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" fill="none" marker-end="url(#sb-a)"/>
  <path d="M660,278 L660,300 L860,300 L860,322" stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" fill="none" marker-end="url(#sb-a)"/>

  <!-- 3 · TWO ARTIFACTS -->
  <rect x="200" y="324" width="280" height="64" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
  <text x="340" y="353" fill="#e8eaed" font-size="14" text-anchor="middle">Skill-graph JSON</text>
  <text x="340" y="373" fill="#a8acb1" font-size="10.5" text-anchor="middle">76 skills, 9 groups, required/preferred edges</text>

  <rect x="720" y="324" width="280" height="64" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
  <text x="860" y="353" fill="#e8eaed" font-size="14" text-anchor="middle">Geocoded jobs JSON</text>
  <text x="860" y="373" fill="#a8acb1" font-size="10.5" text-anchor="middle">4,725 postings, salary, applies, lat/lng</text>

  <!-- artifacts to views -->
  <path d="M300,388 L300,410 L200,410 L200,440" stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" fill="none" marker-end="url(#sb-a)"/>
  <path d="M400,388 L400,410 L600,410 L600,440" stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" fill="none" marker-end="url(#sb-a)"/>
  <path d="M800,388 L800,410 L600,410" stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" fill="none"/>
  <path d="M900,388 L900,410 L1000,410 L1000,440" stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" fill="none" marker-end="url(#sb-a)"/>

  <!-- 4 · THREE VIEWS -->
  <rect x="80" y="442" width="240" height="72" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
  <text x="200" y="474" fill="#e8eaed" font-size="14" text-anchor="middle">Circular linkage</text>
  <text x="200" y="494" fill="#a8acb1" font-size="10.5" text-anchor="middle">edge-bundled skill-job graph</text>

  <rect x="480" y="442" width="240" height="72" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
  <text x="600" y="474" fill="#e8eaed" font-size="14" text-anchor="middle">Geographic map</text>
  <text x="600" y="494" fill="#a8acb1" font-size="10.5" text-anchor="middle">one dot per posting, remote flagged</text>

  <rect x="880" y="442" width="240" height="72" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
  <text x="1000" y="474" fill="#e8eaed" font-size="14" text-anchor="middle">Integrated dashboard</text>
  <text x="1000" y="494" fill="#a8acb1" font-size="10.5" text-anchor="middle">counts, salary, applications</text>

  <!-- views to shared store -->
  <line x1="200" y1="514" x2="200" y2="576" stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" fill="none" marker-end="url(#sb-a)"/>
  <line x1="600" y1="514" x2="600" y2="576" stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" fill="none" marker-end="url(#sb-a)"/>
  <line x1="1000" y1="514" x2="1000" y2="576" stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" fill="none" marker-end="url(#sb-a)"/>

  <!-- 5 · SHARED STORE (focal) -->
  <rect x="80" y="578" width="1040" height="72" rx="6" fill="#1a130e" stroke="#cf7f54" stroke-width="1.6"/>
  <text x="600" y="610" fill="#cf7f54" font-size="14" text-anchor="middle" letter-spacing="1">Shared Svelte store · coordinated cross-filtering</text>
  <text x="600" y="632" fill="#a8acb1" font-size="10.5" text-anchor="middle">a selection or zoom in any view re-filters the other two</text>

  <!-- feedback return arc: store re-filters views (single dashed distinct arc) -->
  <path d="M80,614 L48,614 L48,478 L80,478" stroke="#a8acb1" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="6 5" fill="none" marker-end="url(#sb-d)"/>
  <text x="30" y="546" fill="#7e828a" font-size="10.5" text-anchor="middle" transform="rotate(-90 30 546)">re-filters views</text>
</svg>
