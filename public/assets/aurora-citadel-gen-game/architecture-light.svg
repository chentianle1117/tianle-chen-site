<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <marker id="ac-a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#bf6a37" fill-opacity="0.9"/>
    </marker>
  </defs>
  <rect width="1200" height="880" fill="#faf9f5"/>
  <!-- faint grid -->
  <g stroke="#8a8d93" stroke-opacity="0.06">
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="400" y1="0" x2="400" y2="880"/>
    <line x1="800" y1="0" x2="800" y2="880"/>
  </g>

  <!-- Title -->
  <text x="52" y="46" fill="#bf6a37" font-size="17" letter-spacing="3">AURORA CITADEL — PROCEDURAL GENERATION PIPELINE</text>
  <text x="52" y="68" fill="#77726a" font-size="13">hand-authored FBX module library → edge-tagged tile assets → Wave Function Collapse solver → generated grid → UE5 assembly + patrol agents</text>

  <!-- ============================================================= -->
  <!-- LANE 1 — AUTHORING: from FBX modules to WFC tile assets        -->
  <!-- ============================================================= -->
  <text x="52" y="112" fill="#77726a" font-size="13" letter-spacing="3">1 · AUTHOR THE VOCABULARY  (hand-modeled modules → 2D tile assets with edge-socket tags)</text>

  <g font-size="14.5">
    <!-- FBX library -->
    <rect x="52" y="130" width="300" height="112" rx="5" fill="#f6f5f0" stroke="#3c868c" stroke-opacity="0.85"/>
    <text x="70" y="156" fill="#1a1714">FBX MODULE LIBRARY</text>
    <text x="70" y="178" fill="#5b564f" font-size="11.5">10 hand-modeled meshes · 24–61 MB each</text>
    <text x="70" y="196" fill="#5b564f" font-size="11.5">corner · cross · linear · empty · module A/B</text>
    <text x="70" y="212" fill="#5b564f" font-size="11.5">2socketsblack · 2socketsredblack · topblack · topred</text>
    <text x="70" y="232" fill="#77726a" font-size="11">ruined Nordic city blocks: roads, towers, rubble, snow</text>

    <!-- Tile2D assets -->
    <rect x="380" y="130" width="300" height="112" rx="5" fill="#f6f5f0" stroke="#7a4fb0" stroke-opacity="0.85"/>
    <text x="398" y="156" fill="#1a1714">Tile2D ASSETS</text>
    <text x="398" y="178" fill="#5b564f" font-size="11.5">UWFCTileAsset2D per module (2D/Tiles/)</text>
    <text x="398" y="196" fill="#5b564f" font-size="11.5">Corner · Cross · Straight · End · Empty</text>
    <text x="398" y="214" fill="#5b564f" font-size="11.5">RedEnd · RedIntersect · RedIntersectLg · CornerLg</text>
    <text x="398" y="234" fill="#77726a" font-size="11">actor class to spawn + rotation permutations</text>

    <!-- Edge sockets -->
    <rect x="708" y="130" width="300" height="112" rx="5" fill="#f6f5f0" stroke="#7a4fb0" stroke-opacity="0.85"/>
    <text x="726" y="156" fill="#1a1714">EDGE-SOCKET TAGS</text>
    <text x="726" y="178" fill="#5b564f" font-size="11.5">each of 4 edges tagged by connector type:</text>
    <text x="726" y="196" fill="#5b564f" font-size="11.5">blue road · red road · wall · open ground</text>
    <text x="726" y="214" fill="#5b564f" font-size="11.5">tags define which edges may abut</text>
    <text x="726" y="234" fill="#77726a" font-size="11">"served" blocks vs "servant" circulation lanes</text>
  </g>

  <!-- served/servant grammar callout -->
  <rect x="1036" y="130" width="112" height="112" rx="5" fill="#f9efe4" stroke="#bf6a37" stroke-width="1.3"/>
  <text x="1052" y="154" fill="#bf6a37" font-size="12">GRAMMAR</text>
  <text x="1052" y="176" fill="#5b564f" font-size="10.5">served =</text>
  <text x="1052" y="190" fill="#5b564f" font-size="10.5">buildings</text>
  <text x="1052" y="210" fill="#5b564f" font-size="10.5">servant =</text>
  <text x="1052" y="224" fill="#5b564f" font-size="10.5">roads/infra</text>

  <g stroke="#bf6a37" stroke-opacity="0.45" stroke-width="1.6" fill="none">
    <line x1="352" y1="186" x2="380" y2="186" marker-end="url(#ac-a)"/>
    <line x1="680" y1="186" x2="708" y2="186" marker-end="url(#ac-a)"/>
    <line x1="1008" y1="186" x2="1036" y2="186" marker-end="url(#ac-a)"/>
  </g>

  <!-- ============================================================= -->
  <!-- LANE 2 — SOLVE: the WFC generator                              -->
  <!-- ============================================================= -->
  <text x="52" y="292" fill="#77726a" font-size="13" letter-spacing="3">2 · SOLVE  (WFCPlugin 5.4 · mxgmn Wave Function Collapse · no backtracking — re-seed on contradiction)</text>

  <g font-size="14.5">
    <!-- WFC model / tileset -->
    <rect x="52" y="310" width="228" height="120" rx="5" fill="#f6f5f0" stroke="#8a8d93" stroke-opacity="0.8"/>
    <text x="70" y="336" fill="#1a1714">UWFCModel</text>
    <text x="70" y="358" fill="#5b564f" font-size="11.5">UWFCTileSet — full tile</text>
    <text x="70" y="376" fill="#5b564f" font-size="11.5">vocabulary + rotations</text>
    <text x="70" y="398" fill="#5b564f" font-size="11.5">UWFCGridConfig —</text>
    <text x="70" y="416" fill="#5b564f" font-size="11.5">2D grid, dimensions</text>

    <!-- Constraints -->
    <rect x="308" y="310" width="228" height="120" rx="5" fill="#f6f5f0" stroke="#7a4fb0" stroke-opacity="0.85"/>
    <text x="326" y="336" fill="#1a1714">CONSTRAINTS</text>
    <text x="326" y="358" fill="#5b564f" font-size="11.5">edge/adjacency: matching</text>
    <text x="326" y="376" fill="#5b564f" font-size="11.5">sockets only</text>
    <text x="326" y="394" fill="#5b564f" font-size="11.5">boundary constraint</text>
    <text x="326" y="412" fill="#77726a" font-size="11">tag-count caps per tile</text>

    <!-- Selector loop -->
    <rect x="564" y="310" width="228" height="120" rx="5" fill="#f6f5f0" stroke="#5a8038" stroke-opacity="0.85"/>
    <text x="582" y="336" fill="#1a1714">COLLAPSE LOOP</text>
    <text x="582" y="358" fill="#5b564f" font-size="11.5">1 · propagate — prune</text>
    <text x="582" y="376" fill="#5b564f" font-size="11.5">    impossible tiles</text>
    <text x="582" y="394" fill="#5b564f" font-size="11.5">2 · pick min-entropy cell</text>
    <text x="582" y="412" fill="#5b564f" font-size="11.5">3 · collapse to one tile</text>

    <!-- Result -->
    <rect x="820" y="310" width="328" height="120" rx="5" fill="#f9efe4" stroke="#bf6a37" stroke-width="1.4"/>
    <text x="838" y="336" fill="#bf6a37">SOLVED GRID</text>
    <text x="838" y="360" fill="#5b564f" font-size="12">every cell = one tile, all adjacencies valid</text>
    <text x="838" y="382" fill="#5b564f" font-size="12">contradiction (empty cell) → generator errors</text>
    <text x="838" y="404" fill="#77726a" font-size="11">recovery = re-run seed; tune tags to lower conflict odds</text>
  </g>

  <!-- loop-back arrow (re-seed on contradiction) -->
  <g stroke="#bf6a37" stroke-opacity="0.45" stroke-width="1.6" fill="none">
    <line x1="280" y1="370" x2="308" y2="370" marker-end="url(#ac-a)"/>
    <line x1="536" y1="370" x2="564" y2="370" marker-end="url(#ac-a)"/>
    <line x1="792" y1="370" x2="820" y2="370" marker-end="url(#ac-a)"/>
    <!-- iterate arrow inside collapse loop -->
    <path d="M678 430 L678 448 L620 448 L620 430" marker-end="url(#ac-a)"/>
  </g>
  <text x="624" y="464" fill="#77726a" font-size="10">iterate until full</text>
  <!-- feed from lane 1 into model -->
  <g stroke="#bf6a37" stroke-opacity="0.35" stroke-width="1.4" fill="none">
    <path d="M166 242 L166 276 L166 310" marker-end="url(#ac-a)"/>
  </g>
  <text x="176" y="272" fill="#77726a" font-size="10">tileset + tags</text>

  <!-- ============================================================= -->
  <!-- LANE 3 — ASSEMBLE: UE5 runtime                                 -->
  <!-- ============================================================= -->
  <text x="52" y="556" fill="#77726a" font-size="13" letter-spacing="3">3 · ASSEMBLE + PLAY  (UE5 5.4 · WFCGeneratorComponent runs on BeginPlay · spawns tile actors per cell)</text>

  <g font-size="14.5">
    <!-- Spawn -->
    <rect x="52" y="574" width="256" height="120" rx="5" fill="#f6f5f0" stroke="#8a8d93" stroke-opacity="0.8"/>
    <text x="70" y="600" fill="#1a1714">SPAWN TILE ACTORS</text>
    <text x="70" y="622" fill="#5b564f" font-size="11.5">WFCGeneratorComponent</text>
    <text x="70" y="640" fill="#5b564f" font-size="11.5">OnCellSelected → place</text>
    <text x="70" y="658" fill="#5b564f" font-size="11.5">FBX module at grid coord</text>
    <text x="70" y="678" fill="#77726a" font-size="11">merged static-mesh tiles</text>

    <!-- Textures / materials -->
    <rect x="336" y="574" width="256" height="120" rx="5" fill="#f6f5f0" stroke="#7a4fb0" stroke-opacity="0.85"/>
    <text x="354" y="600" fill="#1a1714">SURFACING</text>
    <text x="354" y="622" fill="#5b564f" font-size="11.5">AI-generated brutalist</text>
    <text x="354" y="640" fill="#5b564f" font-size="11.5">textures (concrete, red LEDs)</text>
    <text x="354" y="658" fill="#5b564f" font-size="11.5">PolyHaven + Megascans:</text>
    <text x="354" y="676" fill="#77726a" font-size="11">snow + rocky-ground auto-material</text>

    <!-- Agents -->
    <rect x="620" y="574" width="256" height="120" rx="5" fill="#f6f5f0" stroke="#5a8038" stroke-opacity="0.85"/>
    <text x="638" y="600" fill="#1a1714">PATROL AGENTS</text>
    <text x="638" y="622" fill="#5b564f" font-size="11.5">behavior trees + EQS</text>
    <text x="638" y="640" fill="#5b564f" font-size="11.5">patrol → detect → chase</text>
    <text x="638" y="658" fill="#5b564f" font-size="11.5">cube / drone / display NPCs</text>
    <text x="638" y="678" fill="#77726a" font-size="11">navigate the generated streets</text>

    <!-- Playable -->
    <rect x="904" y="574" width="244" height="120" rx="5" fill="#f9efe4" stroke="#bf6a37" stroke-width="1.4"/>
    <text x="922" y="600" fill="#bf6a37">PLAYABLE CITADEL</text>
    <text x="922" y="622" fill="#5b564f" font-size="11.5">top-down build · minimap</text>
    <text x="922" y="640" fill="#5b564f" font-size="11.5">render target</text>
    <text x="922" y="658" fill="#5b564f" font-size="11.5">new layout every run,</text>
    <text x="922" y="676" fill="#77726a" font-size="11">same module vocabulary</text>
  </g>

  <g stroke="#bf6a37" stroke-opacity="0.45" stroke-width="1.6" fill="none">
    <line x1="308" y1="634" x2="336" y2="634" marker-end="url(#ac-a)"/>
    <line x1="592" y1="634" x2="620" y2="634" marker-end="url(#ac-a)"/>
    <line x1="876" y1="634" x2="904" y2="634" marker-end="url(#ac-a)"/>
  </g>
  <!-- solved grid feeds spawn -->
  <g stroke="#bf6a37" stroke-opacity="0.35" stroke-width="1.4" fill="none">
    <path d="M180 430 L180 502 L180 574" marker-end="url(#ac-a)"/>
  </g>
  <text x="190" y="500" fill="#77726a" font-size="10">solved grid → world</text>

  <!-- footer -->
  <rect x="52" y="792" width="1096" height="56" rx="6" fill="#f6f5f0" stroke="#8a8d93" stroke-opacity="0.5"/>
  <text x="70" y="816" fill="#38332e" font-size="12.5">DELIVERABLE · CONTEXT</text>
  <text x="70" y="834" fill="#77726a" font-size="11.5">Packaged UE5 executable + 5-min demo · CMU 62-706 Generative System Design, Spring 2025 · authored the module set, WFC tile/adjacency setup, and AI-texture surfacing</text>
</svg>
