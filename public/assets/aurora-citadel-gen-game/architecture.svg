<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#cf7f54" fill-opacity="0.8"/>
    </marker>
    <marker id="ar-d" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#7e828a" fill-opacity="0.8"/>
    </marker>
  </defs>
  <rect width="1200" height="440" fill="#0b0d0f"/>

  <text x="64" y="58" fill="#cf7f54" font-size="16" letter-spacing="3">AURORA CITADEL · GENERATION PIPELINE</text>
  <text x="64" y="82" fill="#7e828a" font-size="12.5">This shows that ten authored tiles plus adjacency rules let a WFC solver build a new coherent city every run.</text>

  <!-- Stage 1 -->
  <rect x="64" y="168" width="236" height="128" rx="6" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
  <text x="182" y="212" fill="#e8eaed" font-size="14" text-anchor="middle">AUTHOR TILES</text>
  <text x="182" y="238" fill="#a8acb1" font-size="10.5" text-anchor="middle">10 FBX modules, each edge</text>
  <text x="182" y="254" fill="#a8acb1" font-size="10.5" text-anchor="middle">tagged with socket types</text>

  <!-- Stage 2 (focal) -->
  <rect x="404" y="152" width="236" height="160" rx="6" fill="#1a130e" stroke="#cf7f54" stroke-width="1.4"/>
  <text x="522" y="204" fill="#cf7f54" font-size="14" text-anchor="middle">WFC SOLVER</text>
  <text x="522" y="232" fill="#a8acb1" font-size="10.5" text-anchor="middle">collapse grid under</text>
  <text x="522" y="248" fill="#a8acb1" font-size="10.5" text-anchor="middle">adjacency constraints</text>
  <text x="522" y="272" fill="#7e828a" font-size="10.5" text-anchor="middle">re-seed on contradiction</text>

  <!-- Stage 3 -->
  <rect x="744" y="168" width="236" height="128" rx="6" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
  <text x="862" y="212" fill="#e8eaed" font-size="14" text-anchor="middle">ASSEMBLE IN UE5</text>
  <text x="862" y="238" fill="#a8acb1" font-size="10.5" text-anchor="middle">spawn tiles, surface,</text>
  <text x="862" y="254" fill="#a8acb1" font-size="10.5" text-anchor="middle">add patrol agents</text>

  <!-- Output -->
  <rect x="1024" y="168" width="132" height="128" rx="6" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
  <text x="1090" y="220" fill="#e8eaed" font-size="14" text-anchor="middle">PLAYABLE</text>
  <text x="1090" y="244" fill="#a8acb1" font-size="10.5" text-anchor="middle">new city</text>
  <text x="1090" y="260" fill="#a8acb1" font-size="10.5" text-anchor="middle">each run</text>

  <!-- forward arrows -->
  <g fill="none" stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6">
    <path d="M300 232 L404 232" marker-end="url(#ar)"/>
    <path d="M640 232 L744 232" marker-end="url(#ar)"/>
    <path d="M980 232 L1024 232" marker-end="url(#ar)"/>
  </g>

  <!-- feedback / re-seed dashed return arc -->
  <path d="M522 312 L522 372 L182 372 L182 296" fill="none" stroke="#7e828a" stroke-opacity="0.7" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar-d)"/>
  <text x="352" y="392" fill="#7e828a" font-size="10.5" text-anchor="middle">contradiction → re-seed / tune tags</text>
</svg>
