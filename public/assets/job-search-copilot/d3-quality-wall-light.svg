<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <marker id="q3a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#5a8038" fill-opacity="0.85"/></marker>
  </defs>
  <rect width="1200" height="560" fill="#faf9f5"/>
  <text x="48" y="46" fill="#bf6a37" font-size="16" letter-spacing="3">03 · THE QUALITY WALL</text>
  <text x="48" y="70" fill="#77726a" font-size="12.5">Two independent layers. Every application clears BOTH before it can be submitted. “A rule that matters is a gate, not a sentence.”</text>

  <rect x="48" y="92" width="1104" height="322" rx="6" fill="#f0efe9" stroke="#bf6a37" stroke-opacity="0.35"/>

  <!-- Layer 1 -->
  <text x="66" y="122" fill="#5b564f" font-size="12" letter-spacing="1.5">LAYER 1 — MECHANICAL GATES · deterministic Python · a non-zero exit blocks the pipeline for that role</text>
  <g font-size="11.5">
    <rect x="66" y="136" width="256" height="38" rx="4" fill="#f6f5f0" stroke="#8a8d93" stroke-opacity="0.55"/><text x="80" y="160" fill="#1a1714">eligibility · geo · sponsorship · YOE</text>
    <rect x="334" y="136" width="256" height="38" rx="4" fill="#f6f5f0" stroke="#8a8d93" stroke-opacity="0.55"/><text x="348" y="160" fill="#1a1714">tailored-résumé is THIS role's PDF</text>
    <rect x="602" y="136" width="256" height="38" rx="4" fill="#f6f5f0" stroke="#8a8d93" stroke-opacity="0.55"/><text x="616" y="160" fill="#1a1714">résumé-rules · canonical vocab only</text>
    <rect x="870" y="136" width="264" height="38" rx="4" fill="#f9efe4" stroke="#bf6a37" stroke-opacity="0.7"/><text x="884" y="160" fill="#bf6a37">substance-floor · RULE-1 no thinning</text>

    <rect x="66" y="182" width="256" height="38" rx="4" fill="#f6f5f0" stroke="#8a8d93" stroke-opacity="0.55"/><text x="80" y="206" fill="#1a1714">cover-truth · no fabricated claim</text>
    <rect x="334" y="182" width="256" height="38" rx="4" fill="#f6f5f0" stroke="#8a8d93" stroke-opacity="0.55"/><text x="348" y="206" fill="#1a1714">cover-format · keyword bolding</text>
    <rect x="602" y="182" width="256" height="38" rx="4" fill="#f6f5f0" stroke="#8a8d93" stroke-opacity="0.55"/><text x="616" y="206" fill="#1a1714">cover-structure · locked skeleton</text>
    <rect x="870" y="182" width="264" height="38" rx="4" fill="#f9efe4" stroke="#bf6a37" stroke-opacity="0.7"/><text x="884" y="206" fill="#bf6a37">pdf-matches-source · last-mile</text>
  </g>
  <text x="66" y="244" fill="#77726a" font-size="10.5">+ mojibake · markup-leak · recency-order · outreach — a 13-check chain (run_all_gates.py), re-run by the orchestrator before every submit.</text>

  <line x1="66" y1="262" x2="1134" y2="262" stroke="#8a8d93" stroke-opacity="0.25"/>

  <!-- Layer 2 -->
  <text x="66" y="290" fill="#5b564f" font-size="12" letter-spacing="1.5">LAYER 2 — MASTER AUDITOR · Opus · fresh context per submission · a separate judgment from a separate mind</text>
  <rect x="66" y="304" width="640" height="94" rx="5" fill="#f6f5f0" stroke="#bf6a37" stroke-opacity="0.65"/>
  <text x="82" y="330" fill="#1a1714" font-size="13">Diffs every tailored claim against the canonical source</text>
  <text x="82" y="352" fill="#5b564f" font-size="10.5">sha-matched verdict — editing the package after audit invalidates it (re-audit)</text>
  <text x="82" y="370" fill="#5b564f" font-size="10.5">anti-rubber-stamp: a PASS lists ≥5 checks, each with an evidence quote</text>
  <text x="82" y="388" fill="#77726a" font-size="10.5">may not contradict the mechanical substance-floor (auditor-PASS + gate-FAIL = blocked)</text>
  <g font-size="13">
    <rect x="722" y="304" width="130" height="94" rx="5" fill="#f6f5f0" stroke="#5a8038" stroke-opacity="0.75"/><text x="787" y="356" text-anchor="middle" fill="#1a1714">PASS →</text>
    <rect x="868" y="304" width="130" height="94" rx="5" fill="#f6f5f0" stroke="#bf6a37" stroke-opacity="0.75"/><text x="933" y="349" text-anchor="middle" fill="#1a1714">FIX ↺</text><text x="933" y="368" text-anchor="middle" fill="#77726a" font-size="9.5">re-build</text>
    <rect x="1014" y="304" width="120" height="94" rx="5" fill="#f6f5f0" stroke="#a63b2b" stroke-opacity="0.85"/><text x="1074" y="356" text-anchor="middle" fill="#1a1714">BLOCK ✕</text>
  </g>

  <!-- to submit -->
  <path d="M787,398 L787,446" fill="none" stroke="#5a8038" stroke-opacity="0.6" stroke-width="1.8" marker-end="url(#q3a)"/>
  <text x="600" y="470" text-anchor="middle" fill="#bf6a37" font-size="12" font-style="italic">Only a PASS reaches submission. A FIX never ships a worse artifact — it repairs and re-audits.</text>
  <text x="600" y="500" text-anchor="middle" fill="#77726a" font-size="11">These two layers sit inside a 7-layer defense-in-depth: any failure routes the application to a SAFE lane, never to a wrong submission.</text>
</svg>
