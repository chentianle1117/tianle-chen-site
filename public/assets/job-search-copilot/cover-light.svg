<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <radialGradient id="cg" cx="46%" cy="46%" r="75%">
      <stop offset="0%" stop-color="#efeee8"/>
      <stop offset="100%" stop-color="#faf9f5"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bf6a37" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#bf6a37" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#bf6a37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#cg)"/>

  <!-- faint background constellation -->
  <g stroke="#bf6a37" stroke-opacity="0.10" stroke-width="1" fill="none">
    <path d="M250,150 L360,235 M980,160 L1060,250 M980,160 L900,250 M1060,250 L1010,340"/>
  </g>
  <g fill="#bf6a37" fill-opacity="0.16">
    <circle cx="250" cy="150" r="4"/><circle cx="980" cy="160" r="5"/><circle cx="1060" cy="250" r="3.5"/>
    <circle cx="900" cy="250" r="3.5"/><circle cx="1010" cy="340" r="3"/><circle cx="180" cy="700" r="3.5"/>
    <circle cx="1040" cy="690" r="3"/>
  </g>
  <!-- faint latent rings behind the auditor -->
  <g stroke="#8a8d93" stroke-opacity="0.10" fill="none">
    <circle cx="830" cy="470" r="120"/><circle cx="830" cy="470" r="170"/>
  </g>

  <!-- choreographer (orchestrator) above, dispatching -->
  <g stroke="#5b564f" stroke-opacity="0.22" stroke-width="1.1" stroke-dasharray="4 5" fill="none">
    <path d="M560,258 L372,432"/>
    <path d="M560,258 L590,372"/>
    <path d="M560,258 L806,452"/>
  </g>
  <circle cx="560" cy="250" r="19" fill="#f6f5f0" stroke="#5b564f" stroke-opacity="0.6" stroke-width="1.4"/>
  <circle cx="560" cy="250" r="5" fill="#5b564f" fill-opacity="0.7"/>

  <!-- engines (left): teal / purple / green -->
  <g stroke-width="1.5">
    <circle cx="168" cy="390" r="16" fill="#f6f5f0" stroke="#3c868c"/>
    <circle cx="168" cy="470" r="16" fill="#f6f5f0" stroke="#7a4fb0"/>
    <circle cx="168" cy="550" r="16" fill="#f6f5f0" stroke="#5a8038"/>
    <circle cx="168" cy="390" r="5" fill="#3c868c"/><circle cx="168" cy="470" r="5" fill="#7a4fb0"/><circle cx="168" cy="550" r="5" fill="#5a8038"/>
  </g>
  <!-- engines -> router -->
  <g stroke="#bf6a37" stroke-opacity="0.5" stroke-width="1.6" fill="none">
    <path d="M184,394 L318,455"/>
    <path d="M184,470 L302,470"/>
    <path d="M184,546 L318,485"/>
  </g>

  <!-- router (diamond) -->
  <path d="M360,412 L410,470 L360,528 L310,470 Z" fill="#f9efe4" stroke="#bf6a37" stroke-width="2"/>
  <circle cx="360" cy="470" r="7" fill="#bf6a37"/>

  <!-- router -> worker fan -->
  <g stroke="#bf6a37" stroke-opacity="0.4" stroke-width="1.4" fill="none">
    <path d="M406,458 L568,378"/>
    <path d="M410,470 L570,440"/>
    <path d="M410,470 L570,500"/>
    <path d="M406,482 L568,562"/>
  </g>
  <!-- parallel workers -->
  <g fill="#f6f5f0" stroke="#5b564f" stroke-opacity="0.55" stroke-width="1.4">
    <circle cx="590" cy="372" r="12"/><circle cx="592" cy="440" r="12"/><circle cx="592" cy="500" r="12"/><circle cx="590" cy="568" r="12"/>
  </g>
  <g fill="#5b564f" fill-opacity="0.5"><circle cx="590" cy="372" r="3.5"/><circle cx="592" cy="440" r="3.5"/><circle cx="592" cy="500" r="3.5"/><circle cx="590" cy="568" r="3.5"/></g>

  <!-- workers -> auditor (converge) -->
  <g stroke="#bf6a37" stroke-opacity="0.4" stroke-width="1.4" fill="none">
    <path d="M602,376 L788,452"/>
    <path d="M604,442 L790,462"/>
    <path d="M604,500 L790,480"/>
    <path d="M602,564 L788,490"/>
  </g>

  <!-- auditor (concentric rings = the net) -->
  <circle cx="830" cy="470" r="70" fill="url(#halo)"/>
  <circle cx="830" cy="470" r="46" fill="none" stroke="#bf6a37" stroke-opacity="0.5" stroke-width="1.5"/>
  <circle cx="830" cy="470" r="32" fill="#f9efe4" stroke="#bf6a37" stroke-width="2"/>
  <circle cx="830" cy="470" r="10" fill="#bf6a37"/>

  <!-- FIX loop back to workers (dashed) -->
  <path d="M812,522 C700,610 620,600 596,584" fill="none" stroke="#bf6a37" stroke-opacity="0.3" stroke-width="1.3" stroke-dasharray="5 5"/>

  <!-- auditor -> output (green) -->
  <path d="M876,470 L988,470" fill="none" stroke="#5a8038" stroke-opacity="0.7" stroke-width="1.8"/>
  <circle cx="1010" cy="470" r="18" fill="#f6f5f0" stroke="#5a8038" stroke-width="1.8"/>
  <circle cx="1010" cy="470" r="6" fill="#5a8038"/>
</svg>
