<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <marker id="ca" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#cf7f54" fill-opacity="0.9"/>
    </marker>
    <radialGradient id="cg" cx="50%" cy="44%" r="72%">
      <stop offset="0%" stop-color="#15191e"/>
      <stop offset="100%" stop-color="#0b0d0f"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#cg)"/>

  <!-- faint agent constellation motif (top-right) -->
  <g stroke="#cf7f54" stroke-opacity="0.14" stroke-width="1.2" fill="none">
    <path d="M1015,150 L1105,205 M1015,150 L940,215 M1105,205 L1060,300 M940,215 L1000,295 M1060,300 L1000,295"/>
  </g>
  <g fill="#cf7f54" fill-opacity="0.22">
    <circle cx="1015" cy="150" r="6"/><circle cx="1105" cy="205" r="4"/><circle cx="940" cy="215" r="4"/>
    <circle cx="1060" cy="300" r="4"/><circle cx="1000" cy="295" r="4"/>
  </g>

  <!-- kicker -->
  <text x="90" y="150" fill="#7e828a" font-size="20" letter-spacing="5">◍  PERSONAL PROJECT · 2026 · AI/ML</text>

  <!-- value-prop headline (the page/card supplies the project name — no duplicate title here) -->
  <text x="88" y="256" fill="#e8eaed" font-size="52" font-weight="600" letter-spacing="0.5">Runs a real job search,</text>
  <text x="88" y="322" fill="#cf7f54" font-size="52" font-weight="600" letter-spacing="0.5">and audits its own work.</text>

  <text x="90" y="372" fill="#a8acb1" font-size="21" letter-spacing="0.3">Multi-agent · provider-agnostic · self-auditing · zero quality degradation</text>

  <!-- system flow (crop-safe band) -->
  <g font-size="20">
    <circle cx="150" cy="486" r="10" fill="#5fa0a6"/><circle cx="150" cy="520" r="10" fill="#9b6fc9"/><circle cx="150" cy="554" r="10" fill="#7aa15c"/>
    <text x="150" y="600" text-anchor="middle" fill="#7e828a" font-size="16">3 engines</text>

    <path d="M176,520 L262,520" fill="none" stroke="#cf7f54" stroke-opacity="0.55" stroke-width="2" marker-end="url(#ca)"/>
    <rect x="270" y="492" width="150" height="56" rx="6" fill="#1a130e" stroke="#cf7f54"/>
    <text x="345" y="527" text-anchor="middle" fill="#cf7f54" font-size="19">ROUTER</text>

    <path d="M424,520 L505,520" fill="none" stroke="#cf7f54" stroke-opacity="0.55" stroke-width="2" marker-end="url(#ca)"/>
    <rect x="512" y="492" width="176" height="56" rx="6" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
    <text x="600" y="527" text-anchor="middle" fill="#e8eaed" font-size="19">tailor · gate</text>

    <path d="M692,520 L773,520" fill="none" stroke="#cf7f54" stroke-opacity="0.55" stroke-width="2" marker-end="url(#ca)"/>
    <rect x="780" y="484" width="196" height="72" rx="8" fill="#1a130e" stroke="#cf7f54" stroke-width="2"/>
    <text x="878" y="517" text-anchor="middle" fill="#cf7f54" font-size="20">OPUS AUDITOR</text>
    <text x="878" y="540" text-anchor="middle" fill="#a8acb1" font-size="14">the non-bypassable net</text>

    <path d="M980,520 L1058,520" fill="none" stroke="#7aa15c" stroke-opacity="0.7" stroke-width="2" marker-end="url(#ca)"/>
    <text x="1108" y="527" text-anchor="middle" fill="#7aa15c" font-size="19">SUBMIT</text>
  </g>

  <!-- rule -->
  <line x1="90" y1="648" x2="1110" y2="648" stroke="#5e636b" stroke-opacity="0.25" stroke-width="1"/>

  <!-- metric strip (crop-safe) -->
  <g>
    <text x="90" y="714" fill="#e8eaed" font-size="40" font-weight="600">13</text>
    <text x="90" y="740" fill="#7e828a" font-size="15" letter-spacing="1">MECHANICAL GATES</text>

    <text x="360" y="714" fill="#e8eaed" font-size="40" font-weight="600">8</text>
    <text x="360" y="740" fill="#7e828a" font-size="15" letter-spacing="1">ATS HANDLERS</text>

    <text x="620" y="714" fill="#e8eaed" font-size="40" font-weight="600">3×3</text>
    <text x="620" y="740" fill="#7e828a" font-size="15" letter-spacing="1">ENGINES × TIERS</text>
  </g>

  <!-- footer maxim (card-only band) -->
  <text x="90" y="838" fill="#cf7f54" font-size="20" font-style="italic">“A rule that matters is a gate, not a sentence.”</text>
</svg>
