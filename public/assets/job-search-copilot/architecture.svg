<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1460" width="1200" height="1460" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#cf7f54" fill-opacity="0.8"/>
    </marker>
    <marker id="arf" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#7aa15c" fill-opacity="0.85"/>
    </marker>
  </defs>

  <rect width="1200" height="1460" fill="#0b0d0f"/>

  <!-- faint grid -->
  <g stroke="#5e636b" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="365" x2="1200" y2="365"/>
    <line x1="0" y1="690" x2="1200" y2="690"/>
    <line x1="0" y1="1055" x2="1200" y2="1055"/>
    <line x1="0" y1="1320" x2="1200" y2="1320"/>
  </g>

  <!-- ═══ TITLE ═══ -->
  <text x="48" y="54" fill="#cf7f54" font-size="19" letter-spacing="3.5">◍ JOB SEARCH COPILOT</text>
  <text x="48" y="82" fill="#7e828a" font-size="13.5" letter-spacing="0.5">Multi-agent, provider-agnostic application pipeline · choreographer + specialist workers · adversarial self-audit · zero quality degradation</text>

  <!-- ═══════════ BAND 01 — ENGINE LAYER ═══════════ -->
  <text x="48" y="126" fill="#cf7f54" font-size="12.5" letter-spacing="3">01 · PROVIDER-AGNOSTIC ENGINE LAYER</text>

  <!-- engines -->
  <g font-size="14">
    <rect x="48" y="146" width="150" height="52" rx="5" fill="#12161a" stroke="#5fa0a6" stroke-opacity="0.75"/>
    <text x="123" y="170" text-anchor="middle" fill="#e8eaed" font-size="13.5">Claude Code</text>
    <text x="123" y="187" text-anchor="middle" fill="#7e828a" font-size="10.5">native</text>
    <rect x="208" y="146" width="150" height="52" rx="5" fill="#12161a" stroke="#9b6fc9" stroke-opacity="0.75"/>
    <text x="283" y="170" text-anchor="middle" fill="#e8eaed" font-size="13.5">Codex CLI</text>
    <text x="283" y="187" text-anchor="middle" fill="#7e828a" font-size="10.5">ChatGPT sub</text>
    <rect x="368" y="146" width="150" height="52" rx="5" fill="#12161a" stroke="#7aa15c" stroke-opacity="0.75"/>
    <text x="443" y="170" text-anchor="middle" fill="#e8eaed" font-size="13.5">Gemini CLI</text>
    <text x="443" y="187" text-anchor="middle" fill="#7e828a" font-size="10.5">API tier</text>
  </g>

  <!-- router -->
  <g fill="none" stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6">
    <path d="M198,172 L556,172" marker-end="url(#ar)"/>
    <path d="M283,198 L283,210 L556,178" marker-end="url(#ar)"/>
    <path d="M443,198 L443,214 L556,184" marker-end="url(#ar)"/>
  </g>
  <rect x="558" y="140" width="248" height="66" rx="5" fill="#1a130e" stroke="#cf7f54"/>
  <text x="682" y="165" text-anchor="middle" fill="#cf7f54" font-size="14" letter-spacing="1">AI_BRAIN ROUTER</text>
  <text x="682" y="185" text-anchor="middle" fill="#a8acb1" font-size="10.5">stdin + prompt → stdout · one interface</text>
  <text x="682" y="199" text-anchor="middle" fill="#7e828a" font-size="10">auto-fallback · grounding + cliché guards</text>

  <!-- model routing panel -->
  <path d="M806,173 L826,173" fill="none" stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="828" y="130" width="324" height="200" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.5"/>
  <text x="844" y="150" fill="#7e828a" font-size="10.5" letter-spacing="2">MODEL ROUTING — A/B BENCHMARK-ASSIGNED</text>
  <g font-size="12">
    <text x="844" y="174" fill="#a8acb1">Choreographer</text><text x="1136" y="174" text-anchor="end" fill="#e8eaed">Sonnet · med</text>
    <text x="844" y="196" fill="#a8acb1">Discovery</text><text x="1136" y="196" text-anchor="end" fill="#e8eaed">Sonnet · high</text>
    <text x="844" y="218" fill="#a8acb1">Build (tailor)</text><text x="1136" y="218" text-anchor="end" fill="#e8eaed">Sonnet · Opus hi-stakes</text>
    <text x="844" y="240" fill="#a8acb1">Submit</text><text x="1136" y="240" text-anchor="end" fill="#e8eaed">Sonnet · low</text>
  </g>
  <rect x="838" y="252" width="304" height="30" rx="4" fill="#1a130e" stroke="#cf7f54" stroke-opacity="0.8"/>
  <text x="848" y="272" fill="#cf7f54" font-size="12">MASTER AUDITOR</text><text x="1132" y="272" text-anchor="end" fill="#cf7f54" font-size="12">OPUS · high — the net</text>
  <text x="844" y="304" fill="#7e828a" font-size="10">Per-role effort routing · low → max reasoning.</text>
  <text x="844" y="320" fill="#7e828a" font-size="10">Swap a provider / model → nothing else changes.</text>

  <!-- ═══════════ BAND 02 — PIPELINE ═══════════ -->
  <text x="48" y="404" fill="#cf7f54" font-size="12.5" letter-spacing="3">02 · THE OVERNIGHT PIPELINE</text>
  <text x="360" y="404" fill="#7e828a" font-size="11">choreographer dispatches ephemeral workers — the main thread never discovers, builds, or submits itself</text>

  <!-- stage spine -->
  <g font-size="12.5">
    <rect x="48" y="426" width="128" height="70" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.6"/>
    <text x="112" y="452" text-anchor="middle" fill="#e8eaed" font-size="12.5">0 · Pre-flight</text>
    <text x="112" y="470" text-anchor="middle" fill="#7e828a" font-size="9.5">8 phases: env ·</text>
    <text x="112" y="482" text-anchor="middle" fill="#7e828a" font-size="9.5">auth · budget · canary</text>

    <rect x="204" y="426" width="128" height="70" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.6"/>
    <text x="268" y="452" text-anchor="middle" fill="#e8eaed" font-size="12.5">1 · Discovery</text>
    <text x="268" y="470" text-anchor="middle" fill="#7e828a" font-size="9.5">parallel fleet ·</text>
    <text x="268" y="482" text-anchor="middle" fill="#7e828a" font-size="9.5">live-confirmed</text>

    <rect x="360" y="426" width="128" height="70" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.6"/>
    <text x="424" y="452" text-anchor="middle" fill="#e8eaed" font-size="12.5">2 · Fit-triage</text>
    <text x="424" y="470" text-anchor="middle" fill="#7e828a" font-size="9.5">dedup · geo stop</text>
    <text x="424" y="482" text-anchor="middle" fill="#7e828a" font-size="9.5">sponsorship cache</text>

    <rect x="516" y="426" width="128" height="70" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.6"/>
    <text x="580" y="452" text-anchor="middle" fill="#e8eaed" font-size="12.5">3 · Build</text>
    <text x="580" y="470" text-anchor="middle" fill="#7e828a" font-size="9.5">1 worker / role</text>
    <text x="580" y="482" text-anchor="middle" fill="#7e828a" font-size="9.5">résumé + cover</text>
  </g>

  <g fill="none" stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6">
    <path d="M176,461 L202,461" marker-end="url(#ar)"/>
    <path d="M332,461 L358,461" marker-end="url(#ar)"/>
    <path d="M488,461 L514,461" marker-end="url(#ar)"/>
  </g>

  <!-- build feeds the wall -->
  <text x="580" y="524" text-anchor="middle" fill="#7e828a" font-size="10">tailored from the candidate's canonical profile vault — nothing invented</text>
  <path d="M580,496 L580,540" fill="none" stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- ═══════════ BAND 03 — QUALITY WALL ═══════════ -->
  <text x="48" y="726" fill="#cf7f54" font-size="12.5" letter-spacing="3">03 · THE QUALITY WALL</text>
  <text x="300" y="726" fill="#7e828a" font-size="11">two independent layers · every application clears BOTH before it can be submitted</text>

  <rect x="48" y="742" width="1104" height="250" rx="6" fill="#0e1114" stroke="#cf7f54" stroke-opacity="0.35"/>

  <!-- layer 1 mechanical -->
  <text x="66" y="770" fill="#a8acb1" font-size="11.5" letter-spacing="1.5">LAYER 1 — MECHANICAL GATES · deterministic Python · exit-4 blocks the pipeline</text>
  <g font-size="11">
    <rect x="66" y="782" width="252" height="34" rx="4" fill="#12161a" stroke="#5e636b" stroke-opacity="0.55"/><text x="78" y="803" fill="#e8eaed">eligibility · geo · sponsorship · YOE</text>
    <rect x="330" y="782" width="252" height="34" rx="4" fill="#12161a" stroke="#5e636b" stroke-opacity="0.55"/><text x="342" y="803" fill="#e8eaed">tailored-résumé is THIS role's PDF</text>
    <rect x="594" y="782" width="252" height="34" rx="4" fill="#12161a" stroke="#5e636b" stroke-opacity="0.55"/><text x="606" y="803" fill="#e8eaed">résumé-rules · canonical vocab only</text>
    <rect x="858" y="782" width="276" height="34" rx="4" fill="#1a130e" stroke="#cf7f54" stroke-opacity="0.7"/><text x="870" y="803" fill="#cf7f54">substance-floor · RULE-1 no thinning</text>

    <rect x="66" y="824" width="252" height="34" rx="4" fill="#12161a" stroke="#5e636b" stroke-opacity="0.55"/><text x="78" y="845" fill="#e8eaed">cover-truth · no fabricated claim</text>
    <rect x="330" y="824" width="252" height="34" rx="4" fill="#12161a" stroke="#5e636b" stroke-opacity="0.55"/><text x="342" y="845" fill="#e8eaed">cover-format · keyword bolding</text>
    <rect x="594" y="824" width="252" height="34" rx="4" fill="#12161a" stroke="#5e636b" stroke-opacity="0.55"/><text x="606" y="845" fill="#e8eaed">cover-structure · locked skeleton</text>
    <rect x="858" y="824" width="276" height="34" rx="4" fill="#1a130e" stroke="#cf7f54" stroke-opacity="0.7"/><text x="870" y="845" fill="#cf7f54">pdf-matches-source · last-mile</text>
  </g>
  <text x="66" y="878" fill="#7e828a" font-size="10">+ mojibake · markup-leak · recency-order · outreach — a 13-check chain (run_all_gates.py) re-run before every submit</text>

  <!-- divider -->
  <line x1="66" y1="894" x2="1134" y2="894" stroke="#5e636b" stroke-opacity="0.25" stroke-width="1"/>

  <!-- layer 2 auditor -->
  <text x="66" y="918" fill="#a8acb1" font-size="11.5" letter-spacing="1.5">LAYER 2 — MASTER AUDITOR · Opus · fresh context per submission · a separate judgment from a separate mind</text>
  <rect x="66" y="930" width="640" height="48" rx="5" fill="#12161a" stroke="#cf7f54" stroke-opacity="0.65"/>
  <text x="82" y="951" fill="#e8eaed" font-size="12.5">Diffs every tailored claim vs. the canonical source</text>
  <text x="82" y="969" fill="#7e828a" font-size="10.5">sha-matched verdict · ≥5 evidence-quoted checks (anti-rubber-stamp) · cannot contradict the mechanical floor</text>
  <g font-size="12.5">
    <rect x="722" y="930" width="128" height="48" rx="5" fill="#12161a" stroke="#7aa15c" stroke-opacity="0.75"/><text x="786" y="959" text-anchor="middle" fill="#e8eaed">PASS →</text>
    <rect x="866" y="930" width="128" height="48" rx="5" fill="#12161a" stroke="#cf7f54" stroke-opacity="0.75"/><text x="930" y="959" text-anchor="middle" fill="#e8eaed">FIX ↺</text>
    <rect x="1006" y="930" width="128" height="48" rx="5" fill="#12161a" stroke="#b45a4a" stroke-opacity="0.85"/><text x="1070" y="959" text-anchor="middle" fill="#e8eaed">BLOCK ✕</text>
  </g>

  <path d="M600,540 L600,740" fill="none" stroke="#cf7f54" stroke-opacity="0.35" stroke-width="1.4"/>
  <!-- FIX loop back to build -->
  <path d="M930,930 C930,600 780,560 646,540" fill="none" stroke="#cf7f54" stroke-opacity="0.4" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="748" y="600" fill="#7e828a" font-size="9.5">FIX → re-build (never ship a worse artifact)</text>

  <!-- wall to submission -->
  <path d="M786,978 L786,1030" fill="none" stroke="#7aa15c" stroke-opacity="0.6" stroke-width="1.8" marker-end="url(#arf)"/>
  <text x="600" y="1016" text-anchor="middle" fill="#cf7f54" font-size="11" font-style="italic">“A rule that matters must be a gate, not a sentence.”  ·  7 independent safety layers → any failure routes to a SAFE lane, never a wrong submit</text>

  <!-- ═══════════ BAND 04 — ROUTING + SUBMISSION ═══════════ -->
  <text x="48" y="1082" fill="#cf7f54" font-size="12.5" letter-spacing="3">04 · LANE ROUTING + SUBMISSION</text>

  <!-- lanes -->
  <text x="48" y="1108" fill="#7e828a" font-size="10.5" letter-spacing="1.5">POST-AUDIT, EACH ROLE ROUTES TO ONE LANE</text>
  <g font-size="11">
    <rect x="48" y="1118" width="210" height="40" rx="5" fill="#12161a" stroke="#7aa15c" stroke-opacity="0.7"/><text x="153" y="1143" text-anchor="middle" fill="#e8eaed">AUTO-SUBMIT · small firms</text>
    <rect x="270" y="1118" width="210" height="40" rx="5" fill="#12161a" stroke="#cf7f54" stroke-opacity="0.7"/><text x="375" y="1143" text-anchor="middle" fill="#e8eaed">HIGH-STAKES HOLD · human</text>
    <rect x="492" y="1118" width="210" height="40" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.6"/><text x="597" y="1143" text-anchor="middle" fill="#e8eaed">OUTREACH-FIRST</text>
    <rect x="714" y="1118" width="200" height="40" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.6"/><text x="814" y="1143" text-anchor="middle" fill="#e8eaed">PACKAGE-ONLY</text>
    <rect x="926" y="1118" width="208" height="40" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.45"/><text x="1030" y="1143" text-anchor="middle" fill="#a8acb1">CLOSED / STALE</text>
  </g>

  <!-- ATS handler library -->
  <path d="M153,1158 L153,1178" fill="none" stroke="#7aa15c" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#arf)"/>
  <rect x="48" y="1180" width="1086" height="112" rx="6" fill="#0e1114" stroke="#5e636b" stroke-opacity="0.45"/>
  <text x="64" y="1202" fill="#a8acb1" font-size="11" letter-spacing="1.5">ATS HANDLER LIBRARY — detector → handler → runner · on-demand browser instance per role</text>
  <g font-size="11">
    <rect x="64" y="1214" width="118" height="30" rx="4" fill="#12161a" stroke="#5e636b" stroke-opacity="0.55"/><text x="123" y="1234" text-anchor="middle" fill="#e8eaed">Greenhouse</text>
    <rect x="194" y="1214" width="118" height="30" rx="4" fill="#12161a" stroke="#5e636b" stroke-opacity="0.55"/><text x="253" y="1234" text-anchor="middle" fill="#e8eaed">Lever</text>
    <rect x="324" y="1214" width="118" height="30" rx="4" fill="#12161a" stroke="#5e636b" stroke-opacity="0.55"/><text x="383" y="1234" text-anchor="middle" fill="#e8eaed">Ashby</text>
    <rect x="454" y="1214" width="118" height="30" rx="4" fill="#12161a" stroke="#5e636b" stroke-opacity="0.55"/><text x="513" y="1234" text-anchor="middle" fill="#e8eaed">Workday</text>
    <rect x="584" y="1214" width="132" height="30" rx="4" fill="#12161a" stroke="#5e636b" stroke-opacity="0.55"/><text x="650" y="1234" text-anchor="middle" fill="#e8eaed">LinkedIn Easy</text>
    <rect x="728" y="1214" width="132" height="30" rx="4" fill="#12161a" stroke="#5e636b" stroke-opacity="0.55"/><text x="794" y="1234" text-anchor="middle" fill="#e8eaed">PeopleAdmin</text>
    <rect x="872" y="1214" width="118" height="30" rx="4" fill="#12161a" stroke="#5e636b" stroke-opacity="0.4"/><text x="931" y="1234" text-anchor="middle" fill="#a8acb1">iCIMS*</text>
    <rect x="1002" y="1214" width="118" height="30" rx="4" fill="#12161a" stroke="#5e636b" stroke-opacity="0.4"/><text x="1061" y="1234" text-anchor="middle" fill="#a8acb1">ADP*</text>
  </g>
  <text x="64" y="1272" fill="#7e828a" font-size="10">stealth browser automation · every action screenshotted for proof · submit-guard token bound to the gate-passed PDF hashes · leave-blank-never-guess</text>
  <text x="64" y="1286" fill="#cf7f54" font-size="10">HARD STOP: an interactive/physical captcha a human must operate → fill up to it, screenshot, hand off.  (* = stub handler)</text>

  <!-- ═══════════ BAND 05 — RECORD + OUTCOME LOOP ═══════════ -->
  <path d="M591,1292 L591,1330" fill="none" stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="330" y="1332" width="524" height="52" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.6"/>
  <text x="592" y="1355" text-anchor="middle" fill="#e8eaed" font-size="12.5">6-7 · RECORD → tracker (single source of truth) + dashboard, then commit/push</text>
  <text x="592" y="1373" text-anchor="middle" fill="#7e828a" font-size="10">canonical page body built by code · secret-scanned before push</text>

  <!-- outcome learning loop -->
  <rect x="890" y="1332" width="244" height="52" rx="5" fill="#1a130e" stroke="#cf7f54" stroke-opacity="0.6"/>
  <text x="1012" y="1355" text-anchor="middle" fill="#cf7f54" font-size="12">8 · OUTCOME LEARNING</text>
  <text x="1012" y="1373" text-anchor="middle" fill="#a8acb1" font-size="10">interviews / rejections read back</text>
  <path d="M854,1358 L888,1358" fill="none" stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- loop arrow back to discovery -->
  <path d="M1012,1332 C1012,1050 268,1160 268,498" fill="none" stroke="#cf7f54" stroke-opacity="0.28" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#ar)"/>
  <text x="150" y="560" fill="#7e828a" font-size="9.5" transform="rotate(-90 150 560)">learning loop → reshapes discovery filters + fit bar</text>

  <!-- footer -->
  <line x1="48" y1="1410" x2="1152" y2="1410" stroke="#5e636b" stroke-opacity="0.2" stroke-width="1"/>
  <text x="48" y="1434" fill="#a8acb1" font-size="12">3 repos · 2 profile vaults · 8 ATS handlers · ~500K-token/night hard budget</text>
  <text x="1152" y="1434" text-anchor="end" fill="#5e636b" font-size="11" letter-spacing="2">MULTI-AGENT ORCHESTRATION · ADVERSARIAL SELF-VERIFICATION</text>
</svg>
