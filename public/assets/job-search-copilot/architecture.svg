<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1240" width="1280" height="1240" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <marker id="jsc-a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#cf7f54" fill-opacity="0.85"/>
    </marker>
  </defs>
  <rect width="1280" height="1240" fill="#0b0d0f"/>

  <text x="60" y="52" fill="#cf7f54" font-size="20" letter-spacing="3">JOB SEARCH COPILOT — ARCHITECTURE</text>
  <text x="60" y="78" fill="#7e828a" font-size="14" letter-spacing="1">Multi-agent · provider-agnostic · quality-gated · human-in-the-loop</text>

  <!-- Provider router band -->
  <rect x="60" y="98" width="1160" height="58" rx="6" fill="#1a130e" stroke="#cf7f54"/>
  <text x="80" y="124" fill="#cf7f54" font-size="15" letter-spacing="1">PROVIDER ROUTER</text>
  <text x="80" y="144" fill="#d8dadd" font-size="13">AI_BRAIN → Claude Code · Codex · Gemini &#160;·&#160; one stdin→stdout interface · grounded-retry · native fallback</text>

  <!-- ===== LEFT: pipeline ===== -->
  <g font-size="15">
    <!-- boxes -->
    <g>
      <rect x="60" y="196" width="680" height="58" rx="4" fill="#12161a" stroke="#5fa0a6" stroke-opacity="0.7"/>
      <text x="80" y="222" fill="#e8eaed">1 · DISCOVERY</text>
      <text x="80" y="242" fill="#7e828a" font-size="12">LinkedIn-first (saved → recommended → feed → search) → board APIs (secondary)</text>

      <rect x="60" y="286" width="680" height="52" rx="4" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
      <text x="80" y="312" fill="#e8eaed">2 · DEDUP</text>
      <text x="300" y="312" fill="#7e828a" font-size="12">vs. application tracker (Google Sheet)</text>

      <rect x="60" y="370" width="680" height="52" rx="4" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
      <text x="80" y="396" fill="#e8eaed">3 · HARD-PASS FILTER</text>
      <text x="360" y="396" fill="#7e828a" font-size="12">YOE · seniority · explicit no-sponsorship</text>

      <rect x="60" y="454" width="680" height="52" rx="4" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
      <text x="80" y="480" fill="#e8eaed">4 · FIT GATE</text>
      <text x="300" y="480" fill="#7e828a" font-size="12">honest skill match ≥ 55% · YOE within bounds</text>

      <rect x="60" y="538" width="680" height="58" rx="4" fill="#12161a" stroke="#9b6fc9" stroke-opacity="0.8"/>
      <text x="80" y="564" fill="#e8eaed">5 · BUILD AGENT</text>
      <text x="80" y="584" fill="#7e828a" font-size="12">résumé + cover in ONE context · re-order + approved-variant swap · never free-writes</text>

      <!-- Auditor highlighted -->
      <rect x="60" y="628" width="680" height="62" rx="4" fill="#1a130e" stroke="#cf7f54" stroke-width="2"/>
      <text x="80" y="656" fill="#cf7f54" font-size="15">6 · AUDITOR ✦ (Opus, fresh context, per submission)</text>
      <text x="80" y="676" fill="#d8dadd" font-size="12">truth gate — diffs every claim vs. canonical source · fails fabrication / thinning / voice drift</text>

      <rect x="60" y="722" width="680" height="62" rx="4" fill="#12161a" stroke="#7aa15c" stroke-opacity="0.8"/>
      <text x="80" y="748" fill="#e8eaed">7 · MECHANICAL GATES (×8, deterministic)</text>
      <text x="80" y="768" fill="#7e828a" font-size="12">eligibility · tailored-PDF · résumé rules · substance floor · cover truth/format/structure · PDF-matches-source</text>

      <rect x="60" y="816" width="680" height="52" rx="4" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
      <text x="80" y="842" fill="#e8eaed">8 · LANE ASSIGNMENT</text>
    </g>

    <!-- arrows between stages -->
    <g stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" fill="none">
      <line x1="400" y1="254" x2="400" y2="286" marker-end="url(#jsc-a)"/>
      <line x1="400" y1="338" x2="400" y2="370" marker-end="url(#jsc-a)"/>
      <line x1="400" y1="422" x2="400" y2="454" marker-end="url(#jsc-a)"/>
      <line x1="400" y1="506" x2="400" y2="538" marker-end="url(#jsc-a)"/>
      <line x1="400" y1="596" x2="400" y2="628" marker-end="url(#jsc-a)"/>
      <line x1="400" y1="690" x2="400" y2="722" marker-end="url(#jsc-a)"/>
      <line x1="400" y1="784" x2="400" y2="816" marker-end="url(#jsc-a)"/>
      <line x1="400" y1="868" x2="400" y2="900" marker-end="url(#jsc-a)"/>
    </g>

    <!-- 5 lanes -->
    <g font-size="12.5">
      <rect x="60"  y="900" width="126" height="48" rx="4" fill="#12161a" stroke="#7aa15c"/><text x="123" y="929" text-anchor="middle" fill="#e8eaed">🟢 auto-submit</text>
      <rect x="196" y="900" width="126" height="48" rx="4" fill="#12161a" stroke="#5fa0a6"/><text x="259" y="929" text-anchor="middle" fill="#e8eaed">🔵 outreach</text>
      <rect x="332" y="900" width="126" height="48" rx="4" fill="#12161a" stroke="#d49b50"/><text x="395" y="929" text-anchor="middle" fill="#e8eaed">📦 package</text>
      <rect x="468" y="900" width="126" height="48" rx="4" fill="#12161a" stroke="#cf7f54"/><text x="531" y="929" text-anchor="middle" fill="#e8eaed">🔴 decision</text>
      <rect x="604" y="900" width="136" height="48" rx="4" fill="#12161a" stroke="#8a5a4a"/><text x="672" y="929" text-anchor="middle" fill="#e8eaed">❌ failed</text>
    </g>

    <!-- submit -->
    <line x1="123" y1="948" x2="123" y2="978" stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" marker-end="url(#jsc-a)" fill="none"/>
    <rect x="60" y="978" width="680" height="58" rx="4" fill="#12161a" stroke="#7aa15c" stroke-opacity="0.8"/>
    <text x="80" y="1004" fill="#e8eaed">SUBMIT · ATS handler library</text>
    <text x="80" y="1024" fill="#7e828a" font-size="12">Greenhouse · Lever · Ashby · Workday · LinkedIn · PeopleAdmin — screenshot-verified · stops at Submit · never solves captcha</text>

    <!-- outputs -->
    <line x1="400" y1="1036" x2="400" y2="1064" stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" marker-end="url(#jsc-a)" fill="none"/>
    <g font-size="13">
      <rect x="60"  y="1064" width="160" height="46" rx="4" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/><text x="140" y="1092" text-anchor="middle" fill="#d8dadd">Dashboard</text>
      <rect x="234" y="1064" width="160" height="46" rx="4" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/><text x="314" y="1092" text-anchor="middle" fill="#d8dadd">Notion tracker</text>
      <rect x="408" y="1064" width="160" height="46" rx="4" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/><text x="488" y="1092" text-anchor="middle" fill="#d8dadd">Gmail drafts</text>
      <rect x="582" y="1064" width="158" height="46" rx="4" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/><text x="661" y="1092" text-anchor="middle" fill="#d8dadd">Sheet + brief</text>
    </g>
  </g>

  <!-- learning loop feedback arrow (far left) -->
  <path d="M60,1087 C24,1087 24,225 60,225" fill="none" stroke="#cf7f54" stroke-opacity="0.55" stroke-width="1.6" stroke-dasharray="3 6" marker-end="url(#jsc-a)"/>
  <text x="16" y="640" fill="#7e828a" font-size="12" letter-spacing="2" transform="rotate(-90 16 640)">LEARNING LOOP · outcomes → next-run filters</text>

  <!-- ===== RIGHT rail: cross-cutting ===== -->
  <g>
    <rect x="784" y="196" width="436" height="176" rx="6" fill="#101418" stroke="#5e636b" stroke-opacity="0.5"/>
    <text x="804" y="224" fill="#cf7f54" font-size="14" letter-spacing="2">MODEL ROUTING (A/B-tested)</text>
    <g font-size="13" fill="#d8dadd">
      <text x="804" y="252">Auditor &#8230;&#8230;&#8230; Opus (high) — the net</text>
      <text x="804" y="278">Choreographer &#8230; Sonnet (orchestrate)</text>
      <text x="804" y="304">Discovery / Build &#8230; Sonnet</text>
      <text x="804" y="330">Submit &#8230;&#8230;&#8230;&#8230; Sonnet (low)</text>
      <text x="804" y="356" fill="#7e828a" font-size="12">strongest model on the safety net; cheaper</text>
    </g>

    <rect x="784" y="392" width="436" height="238" rx="6" fill="#101418" stroke="#5e636b" stroke-opacity="0.5"/>
    <text x="804" y="420" fill="#cf7f54" font-size="14" letter-spacing="2">QUALITY DOCTRINE</text>
    <g font-size="13" fill="#d8dadd">
      <text x="804" y="450">▸ Zero quality degradation —</text>
      <text x="820" y="470" fill="#7e828a" font-size="12">a technical limit never lowers output;</text>
      <text x="820" y="488" fill="#7e828a" font-size="12">solve it or STOP, never ship worse.</text>
      <text x="804" y="516">▸ RULE -1 — content never thins;</text>
      <text x="820" y="534" fill="#7e828a" font-size="12">only formatting flexes.</text>
      <text x="804" y="562">▸ RULE 0 — truth beats fit;</text>
      <text x="820" y="580" fill="#7e828a" font-size="12">every claim traces to a source file.</text>
      <text x="804" y="608">▸ Gates, not prose —</text>
      <text x="820" y="626" fill="#7e828a" font-size="12">a rule that matters is executable code.</text>
    </g>

    <rect x="784" y="650" width="436" height="120" rx="6" fill="#101418" stroke="#5e636b" stroke-opacity="0.5"/>
    <text x="804" y="678" fill="#cf7f54" font-size="14" letter-spacing="2">TOPOLOGY</text>
    <g font-size="13" fill="#d8dadd">
      <text x="804" y="706">3 git repos + 2 knowledge vaults</text>
      <text x="804" y="730" fill="#7e828a" font-size="12">daily skills engine · overnight autopilot ·</text>
      <text x="804" y="748" fill="#7e828a" font-size="12">candidate memory vault (read at runtime)</text>
    </g>
  </g>
</svg>
