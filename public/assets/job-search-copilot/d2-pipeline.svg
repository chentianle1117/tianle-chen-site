<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <marker id="p2a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#cf7f54" fill-opacity="0.8"/></marker>
  </defs>
  <rect width="1200" height="470" fill="#0b0d0f"/>
  <text x="48" y="46" fill="#cf7f54" font-size="16" letter-spacing="3">02 · THE OVERNIGHT PIPELINE</text>
  <text x="48" y="70" fill="#7e828a" font-size="12.5">The choreographer (main thread) dispatches ephemeral specialist workers — it never discovers, builds, or submits itself.</text>

  <!-- Row 1: steps 0-4 -->
  <g font-size="12.5">
    <rect x="48" y="104" width="200" height="66" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.6"/>
    <text x="66" y="130" fill="#e8eaed">0 · Pre-flight</text>
    <text x="66" y="150" fill="#7e828a" font-size="10.5">8 phases: git · env · budget</text>
    <text x="66" y="164" fill="#7e828a" font-size="10.5">auth · auditor spin-up · canary</text>

    <rect x="272" y="104" width="200" height="66" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.6"/>
    <text x="290" y="130" fill="#e8eaed">1 · Discovery</text>
    <text x="290" y="150" fill="#7e828a" font-size="10.5">parallel fleet, source-first</text>
    <text x="290" y="164" fill="#7e828a" font-size="10.5">each role live-confirmed</text>

    <rect x="496" y="104" width="200" height="66" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.6"/>
    <text x="514" y="130" fill="#e8eaed">2 · Fit-triage</text>
    <text x="514" y="150" fill="#7e828a" font-size="10.5">dedup vs tracker + cache</text>
    <text x="514" y="164" fill="#7e828a" font-size="10.5">geo hard-stop · high-stakes hold</text>

    <rect x="720" y="104" width="200" height="66" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.6"/>
    <text x="738" y="130" fill="#e8eaed">3 · Build</text>
    <text x="738" y="150" fill="#7e828a" font-size="10.5">1 worker / role · one read</text>
    <text x="738" y="164" fill="#7e828a" font-size="10.5">résumé + cover, nothing invented</text>

    <rect x="944" y="104" width="208" height="66" rx="5" fill="#1a130e" stroke="#cf7f54" stroke-opacity="0.85"/>
    <text x="962" y="130" fill="#cf7f54">4 · Audit</text>
    <text x="962" y="150" fill="#a8acb1" font-size="10.5">Opus, fresh context / role</text>
    <text x="962" y="164" fill="#7e828a" font-size="10.5">PASS / FIX / BLOCK →</text>
  </g>
  <g fill="none" stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6">
    <path d="M248,137 L270,137" marker-end="url(#p2a)"/>
    <path d="M472,137 L494,137" marker-end="url(#p2a)"/>
    <path d="M696,137 L718,137" marker-end="url(#p2a)"/>
    <path d="M920,137 L942,137" marker-end="url(#p2a)"/>
  </g>
  <!-- wrap connector 4 -> 5 -->
  <path d="M1048,170 L1048,196 L152,196 L152,222" fill="none" stroke="#cf7f54" stroke-opacity="0.4" stroke-width="1.6" marker-end="url(#p2a)"/>

  <!-- Row 2: steps 5-8 -->
  <g font-size="12.5">
    <rect x="48" y="224" width="248" height="66" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.6"/>
    <text x="66" y="250" fill="#e8eaed">5 · Submit</text>
    <text x="66" y="270" fill="#7e828a" font-size="10.5">1 worker / PASSED role · small firms</text>
    <text x="66" y="284" fill="#7e828a" font-size="10.5">auto-submit; big/brand held for human</text>

    <rect x="320" y="224" width="230" height="66" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.6"/>
    <text x="338" y="250" fill="#e8eaed">6 · Record</text>
    <text x="338" y="270" fill="#7e828a" font-size="10.5">tracker (source of truth)</text>
    <text x="338" y="284" fill="#7e828a" font-size="10.5">+ dashboard, page body by code</text>

    <rect x="574" y="224" width="230" height="66" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.6"/>
    <text x="592" y="250" fill="#e8eaed">7 · Commit</text>
    <text x="592" y="270" fill="#7e828a" font-size="10.5">push both repos</text>
    <text x="592" y="284" fill="#7e828a" font-size="10.5">secret-scanned first</text>

    <rect x="828" y="224" width="324" height="66" rx="5" fill="#1a130e" stroke="#cf7f54" stroke-opacity="0.7"/>
    <text x="846" y="250" fill="#cf7f54">8 · Self-improve / outcome learning</text>
    <text x="846" y="270" fill="#a8acb1" font-size="10.5">interviews + rejections read back →</text>
    <text x="846" y="284" fill="#7e828a" font-size="10.5">reshape discovery filters + raise/lower the fit bar</text>
  </g>
  <g fill="none" stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6">
    <path d="M296,257 L318,257" marker-end="url(#p2a)"/>
    <path d="M550,257 L572,257" marker-end="url(#p2a)"/>
    <path d="M804,257 L826,257" marker-end="url(#p2a)"/>
  </g>

  <!-- outcome learning loop back to discovery -->
  <path d="M990,290 C990,360 372,372 372,360 L372,300 M372,300 L372,222" fill="none" stroke="#cf7f54" stroke-opacity="0.3" stroke-width="1.4" stroke-dasharray="6 5"/>
  <path d="M372,340 L372,300" fill="none" stroke="#cf7f54" stroke-opacity="0.3" stroke-width="1.4"/>
  <text x="500" y="372" fill="#7e828a" font-size="10.5" font-style="italic">learning loop → next run's discovery + fit bar</text>
  <path d="M372,360 L372,172" fill="none" stroke="#cf7f54" stroke-opacity="0.3" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#p2a)"/>

  <!-- footer -->
  <line x1="48" y1="410" x2="1152" y2="410" stroke="#5e636b" stroke-opacity="0.2"/>
  <text x="48" y="436" fill="#a8acb1" font-size="11.5">Every stage runs inside a ~500K-token/night hard budget — the pipeline stops with a partial report rather than silently overrunning.</text>
  <text x="48" y="456" fill="#7e828a" font-size="10.5">Bright line: no full discovery, no final submit, and no self-approve-then-submit on the main thread — always delegated.</text>
</svg>
