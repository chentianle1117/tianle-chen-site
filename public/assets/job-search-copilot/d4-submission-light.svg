<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <marker id="s4a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#5a8038" fill-opacity="0.85"/></marker>
  </defs>
  <rect width="1200" height="440" fill="#faf9f5"/>
  <text x="48" y="46" fill="#bf6a37" font-size="16" letter-spacing="3">04 · LANE ROUTING + SUBMISSION</text>
  <text x="48" y="70" fill="#77726a" font-size="12.5">Post-audit, each role routes to one lane. Auto-submit drives a browser through a library of ATS handlers.</text>

  <!-- lanes -->
  <g font-size="11">
    <rect x="48" y="96" width="212" height="40" rx="5" fill="#f6f5f0" stroke="#5a8038" stroke-opacity="0.7"/><text x="154" y="121" text-anchor="middle" fill="#1a1714">AUTO-SUBMIT · small firms</text>
    <rect x="272" y="96" width="212" height="40" rx="5" fill="#f6f5f0" stroke="#bf6a37" stroke-opacity="0.7"/><text x="378" y="121" text-anchor="middle" fill="#1a1714">HIGH-STAKES HOLD · human</text>
    <rect x="496" y="96" width="200" height="40" rx="5" fill="#f6f5f0" stroke="#8a8d93" stroke-opacity="0.6"/><text x="596" y="121" text-anchor="middle" fill="#1a1714">OUTREACH-FIRST</text>
    <rect x="708" y="96" width="196" height="40" rx="5" fill="#f6f5f0" stroke="#8a8d93" stroke-opacity="0.6"/><text x="806" y="121" text-anchor="middle" fill="#1a1714">PACKAGE-ONLY</text>
    <rect x="916" y="96" width="236" height="40" rx="5" fill="#f6f5f0" stroke="#8a8d93" stroke-opacity="0.45"/><text x="1034" y="121" text-anchor="middle" fill="#5b564f">CLOSED / STALE</text>
  </g>

  <path d="M154,136 L154,158" fill="none" stroke="#5a8038" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#s4a)"/>

  <!-- ATS handler library -->
  <rect x="48" y="160" width="1104" height="128" rx="6" fill="#f0efe9" stroke="#8a8d93" stroke-opacity="0.45"/>
  <text x="66" y="186" fill="#5b564f" font-size="11.5" letter-spacing="1.5">ATS HANDLER LIBRARY — detector → handler → runner · a single browser instance summoned on demand, per role</text>
  <g font-size="11">
    <rect x="66" y="200" width="122" height="32" rx="4" fill="#f6f5f0" stroke="#8a8d93" stroke-opacity="0.55"/><text x="127" y="221" text-anchor="middle" fill="#1a1714">Greenhouse</text>
    <rect x="200" y="200" width="122" height="32" rx="4" fill="#f6f5f0" stroke="#8a8d93" stroke-opacity="0.55"/><text x="261" y="221" text-anchor="middle" fill="#1a1714">Lever</text>
    <rect x="334" y="200" width="122" height="32" rx="4" fill="#f6f5f0" stroke="#8a8d93" stroke-opacity="0.55"/><text x="395" y="221" text-anchor="middle" fill="#1a1714">Ashby</text>
    <rect x="468" y="200" width="122" height="32" rx="4" fill="#f6f5f0" stroke="#8a8d93" stroke-opacity="0.55"/><text x="529" y="221" text-anchor="middle" fill="#1a1714">Workday</text>
    <rect x="602" y="200" width="140" height="32" rx="4" fill="#f6f5f0" stroke="#8a8d93" stroke-opacity="0.55"/><text x="672" y="221" text-anchor="middle" fill="#1a1714">LinkedIn Easy</text>
    <rect x="754" y="200" width="140" height="32" rx="4" fill="#f6f5f0" stroke="#8a8d93" stroke-opacity="0.55"/><text x="824" y="221" text-anchor="middle" fill="#1a1714">PeopleAdmin</text>
    <rect x="906" y="200" width="110" height="32" rx="4" fill="#f6f5f0" stroke="#8a8d93" stroke-opacity="0.4"/><text x="961" y="221" text-anchor="middle" fill="#5b564f">iCIMS*</text>
    <rect x="1028" y="200" width="106" height="32" rx="4" fill="#f6f5f0" stroke="#8a8d93" stroke-opacity="0.4"/><text x="1081" y="221" text-anchor="middle" fill="#5b564f">ADP*</text>
  </g>
  <text x="66" y="256" fill="#77726a" font-size="10.5">Stealth browser automation · every action screenshotted for proof · pre-submit screenshot read-back · leave-blank-when-unsure (never guess a field).</text>
  <text x="66" y="274" fill="#bf6a37" font-size="10.5">Authorization is a token, not a sentence: a submit_guard clearance bound to the gate-passed PDF hashes. HARD STOP: an interactive captcha → stage to the human. (* = stub)</text>

  <!-- record -->
  <path d="M600,288 L600,312" fill="none" stroke="#bf6a37" stroke-opacity="0.5" stroke-width="1.6" marker-end="url(#s4a)"/>
  <rect x="330" y="314" width="540" height="52" rx="5" fill="#f6f5f0" stroke="#8a8d93" stroke-opacity="0.6"/>
  <text x="600" y="337" text-anchor="middle" fill="#1a1714" font-size="12">RECORD → tracker (single source of truth) + review dashboard</text>
  <text x="600" y="356" text-anchor="middle" fill="#77726a" font-size="10.5">a "SUBMITTED" claim is only recorded after a confirmation-page screenshot is eyeballed</text>

  <line x1="48" y1="398" x2="1152" y2="398" stroke="#8a8d93" stroke-opacity="0.2"/>
  <text x="48" y="424" fill="#77726a" font-size="10.5">Default posture everywhere: when in doubt, stop safe and surface it — never degrade quietly.</text>
</svg>
