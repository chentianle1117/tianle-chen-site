<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <marker id="cm-a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#cf7f54" fill-opacity="0.85"/>
    </marker>
  </defs>
  <rect width="1240" height="820" fill="#0b0d0f"/>
  <text x="60" y="50" fill="#cf7f54" font-size="20" letter-spacing="3">CAD-MLLM — ARCHITECTURE</text>
  <text x="60" y="76" fill="#7e828a" font-size="14">Multimodal (text · image · point-cloud) → editable CAD sequences · Vicuna + LoRA</text>

  <!-- Inference model -->
  <text x="60" y="128" fill="#7e828a" font-size="13" letter-spacing="3">MODEL</text>
  <g font-size="14">
    <!-- three frozen encoders -->
    <rect x="60" y="150" width="230" height="52" rx="4" fill="#12161a" stroke="#5fa0a6" stroke-opacity="0.8"/><text x="75" y="181" fill="#e8eaed">TEXT encoder (frozen)</text>
    <rect x="60" y="212" width="230" height="52" rx="4" fill="#12161a" stroke="#9b6fc9" stroke-opacity="0.8"/><text x="75" y="243" fill="#e8eaed">IMAGE encoder (frozen)</text>
    <rect x="60" y="274" width="230" height="52" rx="4" fill="#12161a" stroke="#d49b50" stroke-opacity="0.8"/><text x="75" y="305" fill="#e8eaed">POINT-CLOUD enc. (frozen)</text>
    <!-- projection -->
    <rect x="360" y="190" width="200" height="96" rx="4" fill="#12161a" stroke="#5e636b" stroke-opacity="0.8"/><text x="380" y="232" fill="#e8eaed">PROJECTION</text><text x="380" y="256" fill="#7e828a" font-size="12">trainable → LLM space</text>
    <!-- LLM -->
    <rect x="630" y="190" width="220" height="96" rx="4" fill="#1a130e" stroke="#cf7f54" stroke-width="2"/><text x="650" y="228" fill="#cf7f54">VICUNA + LoRA</text><text x="650" y="252" fill="#7e828a" font-size="12">3-stage curriculum</text>
    <!-- output -->
    <rect x="920" y="190" width="260" height="96" rx="4" fill="#12161a" stroke="#7aa15c" stroke-opacity="0.8"/><text x="940" y="228" fill="#e8eaed">CAD SEQUENCE → STEP</text><text x="940" y="252" fill="#7e828a" font-size="12">editable · via OpenCascade</text>
  </g>
  <g stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" fill="none">
    <line x1="290" y1="176" x2="360" y2="220" marker-end="url(#cm-a)"/>
    <line x1="290" y1="238" x2="360" y2="238" marker-end="url(#cm-a)"/>
    <line x1="290" y1="300" x2="360" y2="256" marker-end="url(#cm-a)"/>
    <line x1="560" y1="238" x2="630" y2="238" marker-end="url(#cm-a)"/>
    <line x1="850" y1="238" x2="920" y2="238" marker-end="url(#cm-a)"/>
  </g>

  <!-- Data amplification (David's contribution) -->
  <text x="60" y="382" fill="#7e828a" font-size="13" letter-spacing="3">DATA — INTELLIGENT TRUNCATION (my contribution)</text>
  <g font-size="14">
    <rect x="60" y="404" width="250" height="72" rx="4" fill="#12161a" stroke="#5e636b" stroke-opacity="0.8"/><text x="80" y="436" fill="#e8eaed">DeepCAD 10% subset</text><text x="80" y="458" fill="#7e828a" font-size="12">58,653 CAD models</text>
    <rect x="358" y="404" width="250" height="72" rx="4" fill="#12161a" stroke="#5e636b" stroke-opacity="0.8"/><text x="378" y="436" fill="#e8eaed">OCCT generate</text><text x="378" y="458" fill="#7e828a" font-size="12">STEP · point clouds · renders</text>
    <rect x="656" y="404" width="270" height="72" rx="4" fill="#1a130e" stroke="#cf7f54" stroke-width="2"/><text x="676" y="436" fill="#cf7f54">INTELLIGENT TRUNCATION</text><text x="676" y="458" fill="#7e828a" font-size="12">geometrically-consistent partials</text>
    <rect x="974" y="404" width="206" height="72" rx="4" fill="#12161a" stroke="#7aa15c" stroke-opacity="0.8"/><text x="994" y="436" fill="#e8eaed">197,546 examples</text><text x="994" y="458" fill="#7e828a" font-size="12">3.37× amplification</text>
  </g>
  <g stroke="#cf7f54" stroke-opacity="0.5" stroke-width="1.6" fill="none">
    <line x1="310" y1="440" x2="358" y2="440" marker-end="url(#cm-a)"/>
    <line x1="608" y1="440" x2="656" y2="440" marker-end="url(#cm-a)"/>
    <line x1="926" y1="440" x2="974" y2="440" marker-end="url(#cm-a)"/>
  </g>

  <!-- results -->
  <text x="60" y="546" fill="#7e828a" font-size="13" letter-spacing="3">RESULTS</text>
  <g font-size="14">
    <rect x="60" y="566" width="360" height="72" rx="4" fill="#101418" stroke="#5e636b" stroke-opacity="0.6"/><text x="80" y="598" fill="#e8eaed">~60% STEP-generation success</text><text x="80" y="620" fill="#7e828a" font-size="12">best multimodal · 90% on simpler text-only</text>
    <rect x="440" y="566" width="360" height="72" rx="4" fill="#101418" stroke="#5e636b" stroke-opacity="0.6"/><text x="460" y="598" fill="#e8eaed">&gt;70% sequence accuracy</text><text x="460" y="620" fill="#7e828a" font-size="12">on successful outputs</text>
    <rect x="820" y="566" width="360" height="72" rx="4" fill="#101418" stroke="#5e636b" stroke-opacity="0.6"/><text x="840" y="598" fill="#e8eaed">Published HF model</text><text x="840" y="620" fill="#7e828a" font-size="12">chentianle1117/autocomplete-stage3-8000</text>
  </g>
  <text x="60" y="686" fill="#7e828a" font-size="12">Reproduction + extension of CAD-MLLM (arXiv:2411.04954) · CMU 16-825 Learning for 3D Vision · flat team of 4.</text>
</svg>
