<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1020" width="1200" height="1020" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <marker id="cm-a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#cf7f54" fill-opacity="0.9"/>
    </marker>
  </defs>
  <rect width="1200" height="1020" fill="#0b0d0f"/>
  <!-- faint grid -->
  <g stroke="#5e636b" stroke-opacity="0.06">
    <line x1="0" y1="255" x2="1200" y2="255"/>
    <line x1="0" y1="530" x2="1200" y2="530"/>
    <line x1="0" y1="770" x2="1200" y2="770"/>
    <line x1="400" y1="0" x2="400" y2="1020"/>
    <line x1="800" y1="0" x2="800" y2="1020"/>
  </g>

  <!-- Title -->
  <text x="52" y="46" fill="#cf7f54" font-size="17" letter-spacing="3">CAD-MLLM — MULTIMODALITY-CONDITIONED CAD GENERATION</text>
  <text x="52" y="68" fill="#7e828a" font-size="13">text · image · point-cloud → LLM (Qwen2.5-7B + LoRA) → parametric command sequence → OpenCascade B-Rep (STEP) · CMU 16-825 · arXiv:2411.04954</text>

  <!-- ============================================================= -->
  <!-- LANE 1 — INFERENCE MODEL                                       -->
  <!-- ============================================================= -->
  <text x="52" y="108" fill="#7e828a" font-size="13" letter-spacing="3">1 · MULTIMODAL MODEL  (any subset of {text, image, point cloud} · frozen encoders · trainable projection)</text>

  <!-- three inputs / encoders -->
  <g font-size="14.5">
    <rect x="52" y="126" width="250" height="66" rx="5" fill="#12161a" stroke="#5fa0a6" stroke-opacity="0.85"/>
    <text x="70" y="152" fill="#e8eaed">TEXT prompt</text>
    <text x="70" y="172" fill="#a8acb1" font-size="11.5">native tokenizer + embed layer</text>
    <text x="70" y="187" fill="#7e828a" font-size="11">no projection (already in LLM space)</text>

    <rect x="52" y="200" width="250" height="66" rx="5" fill="#12161a" stroke="#9b6fc9" stroke-opacity="0.85"/>
    <text x="70" y="226" fill="#e8eaed">IMAGE — DINOv2-large</text>
    <text x="70" y="246" fill="#a8acb1" font-size="11.5">frozen · patch tokens (CLS dropped)</text>
    <text x="70" y="261" fill="#7e828a" font-size="11">multi-view: 4 renders concatenated</text>

    <rect x="52" y="274" width="250" height="66" rx="5" fill="#12161a" stroke="#d49b50" stroke-opacity="0.85"/>
    <text x="70" y="300" fill="#e8eaed">POINT CLOUD — PointNet</text>
    <text x="70" y="320" fill="#a8acb1" font-size="11.5">frozen · Conv1d + global max-pool</text>
    <text x="70" y="335" fill="#7e828a" font-size="11">2048 pts → 1 global feature token</text>
  </g>

  <!-- projection -->
  <g font-size="14.5">
    <rect x="360" y="176" width="196" height="114" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.85"/>
    <text x="378" y="204" fill="#e8eaed">PROJECTION Pv · Pp</text>
    <text x="378" y="228" fill="#a8acb1" font-size="11.5">2-layer MLP (hidden 2048)</text>
    <text x="378" y="248" fill="#a8acb1" font-size="11.5">encoder dim → LLM dim D</text>
    <text x="378" y="272" fill="#7e828a" font-size="11">trainable · aligns each modality</text>
  </g>

  <!-- concat -->
  <g font-size="14.5">
    <rect x="612" y="176" width="150" height="114" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.85"/>
    <text x="630" y="210" fill="#e8eaed">CONCAT</text>
    <text x="630" y="232" fill="#a8acb1" font-size="11.5">[E_T · E_I · E_P]</text>
    <text x="630" y="250" fill="#a8acb1" font-size="11.5">along seq dim</text>
    <text x="630" y="272" fill="#7e828a" font-size="11">= X_in to LLM</text>
  </g>

  <!-- LLM -->
  <g font-size="14.5">
    <rect x="818" y="176" width="150" height="114" rx="5" fill="#1a130e" stroke="#cf7f54" stroke-width="2"/>
    <text x="836" y="206" fill="#cf7f54">Qwen2.5-7B</text>
    <text x="836" y="230" fill="#a8acb1" font-size="11.5">frozen backbone</text>
    <text x="836" y="250" fill="#a8acb1" font-size="11.5">+ LoRA (r16 α32)</text>
    <text x="836" y="272" fill="#7e828a" font-size="11">causal LM · autoregressive</text>
  </g>

  <!-- output -->
  <g font-size="14.5">
    <rect x="1000" y="176" width="150" height="114" rx="5" fill="#12161a" stroke="#7aa15c" stroke-opacity="0.9"/>
    <text x="1018" y="206" fill="#e8eaed">CAD SEQ</text>
    <text x="1018" y="228" fill="#a8acb1" font-size="11.5">JSON command</text>
    <text x="1018" y="246" fill="#a8acb1" font-size="11.5">seq → STEP</text>
    <text x="1018" y="272" fill="#7e828a" font-size="11">editable B-Rep</text>
  </g>

  <!-- connectors lane 1 -->
  <g stroke="#cf7f54" stroke-opacity="0.45" stroke-width="1.6" fill="none">
    <line x1="302" y1="159" x2="360" y2="210" marker-end="url(#cm-a)"/>
    <line x1="302" y1="233" x2="360" y2="233" marker-end="url(#cm-a)"/>
    <line x1="302" y1="307" x2="360" y2="256" marker-end="url(#cm-a)"/>
    <line x1="556" y1="233" x2="612" y2="233" marker-end="url(#cm-a)"/>
    <line x1="762" y1="233" x2="818" y2="233" marker-end="url(#cm-a)"/>
    <line x1="968" y1="233" x2="1000" y2="233" marker-end="url(#cm-a)"/>
  </g>
  <text x="52" y="366" fill="#7e828a" font-size="11.5">B-Rep is a graph, not a sequence — so a CAD model M is serialized to a command sequence S = {c1…cN} (Sketch, Extrude, …) that an LLM can generate <tspan fill="#cf7f54">token by token</tspan>.</text>

  <!-- ============================================================= -->
  <!-- LANE 2 — SYNTHETIC DATA + INTELLIGENT TRUNCATION               -->
  <!-- ============================================================= -->
  <text x="52" y="410" fill="#7e828a" font-size="13" letter-spacing="3">2 · SYNTHETIC DATA PIPELINE  (DeepCAD lacks aligned modalities — we synthesize + amplify them)</text>

  <!-- source -->
  <g font-size="14.5">
    <rect x="52" y="428" width="196" height="90" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.85"/>
    <text x="70" y="456" fill="#e8eaed">DeepCAD 10% subset</text>
    <text x="70" y="478" fill="#a8acb1" font-size="11.5">58,653 CAD models</text>
    <text x="70" y="496" fill="#a8acb1" font-size="11.5">JSON command seqs only</text>
    <text x="70" y="512" fill="#7e828a" font-size="11">(Sketch / Extrude params)</text>
  </g>

  <!-- OCCT synthesize -->
  <g font-size="14.5">
    <rect x="304" y="428" width="228" height="90" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.85"/>
    <text x="322" y="456" fill="#e8eaed">OpenCascade synthesize</text>
    <text x="322" y="478" fill="#a8acb1" font-size="11.5">B-Rep STEP · point clouds</text>
    <text x="322" y="496" fill="#a8acb1" font-size="11.5">4 renders: Front/Top/Side/Iso</text>
    <text x="322" y="512" fill="#7e828a" font-size="11">790,184 renderings total</text>
  </g>

  <!-- intelligent truncation -->
  <g font-size="14.5">
    <rect x="588" y="428" width="276" height="90" rx="5" fill="#1a130e" stroke="#cf7f54" stroke-width="2"/>
    <text x="606" y="456" fill="#cf7f54">INTELLIGENT TRUNCATION</text>
    <text x="606" y="478" fill="#a8acb1" font-size="11.5">1. detect op boundaries (post-Extrude)</text>
    <text x="606" y="495" fill="#a8acb1" font-size="11.5">2. recursively trace entity deps</text>
    <text x="606" y="512" fill="#a8acb1" font-size="11.5">3. prune orphans → valid partial</text>
  </g>

  <!-- amplified dataset -->
  <g font-size="14.5">
    <rect x="920" y="428" width="230" height="90" rx="5" fill="#12161a" stroke="#7aa15c" stroke-opacity="0.9"/>
    <text x="938" y="456" fill="#e8eaed">197,546 examples</text>
    <text x="938" y="478" fill="#a8acb1" font-size="11.5">2.37 versions/model avg</text>
    <text x="938" y="496" fill="#a8acb1" font-size="11.5">3.37× sequences vs source</text>
    <text x="938" y="512" fill="#7e828a" font-size="11">completeness 1%–99%</text>
  </g>

  <g stroke="#cf7f54" stroke-opacity="0.45" stroke-width="1.6" fill="none">
    <line x1="248" y1="473" x2="304" y2="473" marker-end="url(#cm-a)"/>
    <line x1="532" y1="473" x2="588" y2="473" marker-end="url(#cm-a)"/>
    <line x1="864" y1="473" x2="920" y2="473" marker-end="url(#cm-a)"/>
  </g>

  <!-- partial→complete pair strip -->
  <rect x="52" y="536" width="812" height="52" rx="5" fill="#101418" stroke="#5e636b" stroke-opacity="0.5"/>
  <text x="70" y="558" fill="#d8dadd" font-size="12">AUTOCOMPLETION SUPERVISION</text>
  <text x="70" y="578" fill="#7e828a" font-size="11.5">each source model yields (partial input → complete target) pairs at 25% / 50% / 75% cuts — every partial is geometrically consistent, teaching incremental construction.</text>
  <rect x="920" y="536" width="230" height="52" rx="5" fill="#101418" stroke="#5e636b" stroke-opacity="0.5"/>
  <text x="938" y="558" fill="#d8dadd" font-size="12">FEEDS TRAINING ↓</text>
  <text x="938" y="578" fill="#7e828a" font-size="11">text · image · PCD aligned</text>

  <!-- ============================================================= -->
  <!-- LANE 3 — CURRICULUM TRAINING                                   -->
  <!-- ============================================================= -->
  <text x="52" y="632" fill="#7e828a" font-size="13" letter-spacing="3">3 · CURRICULUM TRAINING  (LoRA fine-tune · A100 80GB · AdamW · cosine LR 2e-4 · global batch 16 · max_seq 4096)</text>

  <g font-size="14.5">
    <rect x="52" y="650" width="360" height="94" rx="5" fill="#12161a" stroke="#5fa0a6" stroke-opacity="0.85"/>
    <text x="70" y="678" fill="#e8eaed">STAGE I — Text-only alignment</text>
    <text x="70" y="700" fill="#a8acb1" font-size="11.5">Text-to-CAD pairs only</text>
    <text x="70" y="718" fill="#a8acb1" font-size="11.5">learn valid command-seq syntax</text>
    <text x="70" y="736" fill="#7e828a" font-size="11">stabilizes NL → CAD mapping</text>

    <rect x="436" y="650" width="360" height="94" rx="5" fill="#1a130e" stroke="#cf7f54" stroke-width="1.6"/>
    <text x="454" y="678" fill="#cf7f54">STAGE II — Randomized multimodal fusion</text>
    <text x="454" y="700" fill="#a8acb1" font-size="11.5">random non-empty subset C ⊆ {T, I, P}</text>
    <text x="454" y="718" fill="#a8acb1" font-size="11.5">robust to any modality combination</text>
    <text x="454" y="736" fill="#7e828a" font-size="11">image + PCD encoders enabled</text>
  </g>

  <!-- trainable-only callout -->
  <g font-size="14.5">
    <rect x="820" y="650" width="330" height="94" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
    <text x="838" y="678" fill="#e8eaed">TRAINABLE PARAMETERS ONLY</text>
    <text x="838" y="700" fill="#a8acb1" font-size="11.5">LoRA A/B on q,k,v,o,gate,up,down</text>
    <text x="838" y="718" fill="#a8acb1" font-size="11.5">+ projection MLPs · everything else frozen</text>
    <text x="838" y="736" fill="#7e828a" font-size="11">loss = causal LM NLL of target seq</text>
  </g>
  <g stroke="#cf7f54" stroke-opacity="0.45" stroke-width="1.6" fill="none">
    <line x1="412" y1="697" x2="436" y2="697" marker-end="url(#cm-a)"/>
  </g>

  <!-- ============================================================= -->
  <!-- LANE 4 — EVALUATION                                            -->
  <!-- ============================================================= -->
  <text x="52" y="788" fill="#7e828a" font-size="13" letter-spacing="3">4 · EVALUATION  (7-step pipeline: JSON → STEP → topology + sequence metrics · L_GT &lt; 2048 tok · temp 0.5)</text>

  <g font-size="13.5">
    <!-- text-only best -->
    <rect x="52" y="806" width="360" height="96" rx="5" fill="#12161a" stroke="#5e636b" stroke-opacity="0.7"/>
    <text x="70" y="832" fill="#e8eaed" font-size="14.5">TEXT-ONLY · 2,048 tok (Eval 2)</text>
    <text x="70" y="856" fill="#7aa15c" font-size="13">STEP conversion 90.0% (45/50)</text>
    <text x="70" y="876" fill="#a8acb1" font-size="12">Type-Seq Acc 0.915 · Entity Acc 0.482</text>
    <text x="70" y="894" fill="#7e828a" font-size="11">simpler outputs compile most reliably</text>

    <!-- multimodal best -->
    <rect x="436" y="806" width="360" height="96" rx="5" fill="#1a130e" stroke="#cf7f54" stroke-opacity="0.85"/>
    <text x="454" y="832" fill="#cf7f54" font-size="14.5">MULTIMODAL · 4,096 tok (Eval 4)</text>
    <text x="454" y="856" fill="#7aa15c" font-size="13">STEP conversion 60.0% (9/15)</text>
    <text x="454" y="876" fill="#a8acb1" font-size="12">Type-Seq Acc 0.955 · Entity Acc 0.727</text>
    <text x="454" y="894" fill="#7e828a" font-size="11">richer inputs → higher sequence fidelity</text>

    <!-- tradeoff -->
    <rect x="820" y="806" width="330" height="96" rx="5" fill="#101418" stroke="#5e636b" stroke-opacity="0.6"/>
    <text x="838" y="832" fill="#e8eaed" font-size="14.5">THE TRADE-OFF</text>
    <text x="838" y="856" fill="#a8acb1" font-size="12">text-only → validity ↑ , detail ↓</text>
    <text x="838" y="876" fill="#a8acb1" font-size="12">multimodal → detail ↑ , fragility ↑</text>
    <text x="838" y="894" fill="#7e828a" font-size="11">limitation: simple shapes (short prompts)</text>
  </g>

  <!-- footer -->
  <rect x="52" y="922" width="1098" height="70" rx="6" fill="#12161a" stroke="#5e636b" stroke-opacity="0.5"/>
  <text x="70" y="946" fill="#d8dadd" font-size="12.5">MY CONTRIBUTION (David Chen)</text>
  <text x="70" y="966" fill="#7e828a" font-size="11.5">Autocompletion extension — truncated-text masking, autocomplete inference + eval pipeline, overnight hyperparameter sweeps on a local RTX 5070 Ti.</text>
  <text x="70" y="984" fill="#7e828a" font-size="11.5">Published weights + dataset on HuggingFace (omnicad-lab-L3d) · team: Chen · Karthick Raja BG · Yizhuo Di · Chia Hui Yen (audit).</text>
</svg>
