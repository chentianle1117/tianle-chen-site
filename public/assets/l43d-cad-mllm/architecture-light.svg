<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="'IBM Plex Mono', ui-monospace, monospace">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b45f2c" fill-opacity="0.8"/>
    </marker>
  </defs>
  <rect width="1200" height="470" fill="#faf9f5"/>

  <!-- Title -->
  <text x="48" y="46" fill="#b45f2c" font-size="16" letter-spacing="3">CAD-MLLM · MULTIMODAL CAD GENERATION</text>
  <text x="48" y="70" fill="#6f6a60" font-size="12.5">One LLM turns text, image, or point cloud into an editable parametric CAD program.</text>

  <!-- legend: frozen vs trainable -->
  <g font-size="11.5">
    <rect x="905" y="34" width="14" height="14" rx="2" fill="#f2f1ec" stroke="#3c868c" stroke-opacity="0.9"/>
    <text x="925" y="45" fill="#57534b">frozen encoder</text>
    <rect x="1030" y="34" width="14" height="14" rx="2" fill="#f2f1ec" stroke="#1a1714" stroke-opacity="0.9"/>
    <text x="1050" y="45" fill="#57534b">trainable</text>
  </g>

  <!-- ===================== INPUTS (frozen encoders) ===================== -->
  <g font-size="14">
    <rect x="48" y="128" width="212" height="58" rx="5" fill="#f2f1ec" stroke="#3c868c" stroke-opacity="0.9"/>
    <text x="154" y="154" fill="#1a1714" text-anchor="middle">TEXT</text>
    <text x="154" y="174" fill="#57534b" font-size="10.5" text-anchor="middle">tokenizer + embed</text>

    <rect x="48" y="206" width="212" height="58" rx="5" fill="#f2f1ec" stroke="#3c868c" stroke-opacity="0.9"/>
    <text x="154" y="232" fill="#1a1714" text-anchor="middle">IMAGE</text>
    <text x="154" y="252" fill="#57534b" font-size="10.5" text-anchor="middle">DINOv2-large</text>

    <rect x="48" y="284" width="212" height="58" rx="5" fill="#f2f1ec" stroke="#3c868c" stroke-opacity="0.9"/>
    <text x="154" y="310" fill="#1a1714" text-anchor="middle">POINT CLOUD</text>
    <text x="154" y="330" fill="#57534b" font-size="10.5" text-anchor="middle">PointNet</text>
  </g>

  <!-- ===================== PROJECTION (trainable) ===================== -->
  <g font-size="14">
    <rect x="332" y="176" width="180" height="118" rx="5" fill="#f2f1ec" stroke="#1a1714" stroke-opacity="0.85"/>
    <text x="422" y="230" fill="#1a1714" text-anchor="middle">PROJECTION</text>
    <text x="422" y="252" fill="#57534b" font-size="10.5" text-anchor="middle">MLP → LLM space</text>
  </g>

  <!-- ===================== LLM (focal) ===================== -->
  <g font-size="14">
    <rect x="584" y="176" width="212" height="118" rx="5" fill="#f6ece4" stroke="#b45f2c" stroke-width="2"/>
    <text x="690" y="224" fill="#b45f2c" text-anchor="middle" font-size="15">Qwen2.5-7B</text>
    <text x="690" y="248" fill="#57534b" font-size="10.5" text-anchor="middle">frozen backbone + LoRA</text>
  </g>

  <!-- ===================== OUTPUTS ===================== -->
  <g font-size="14">
    <rect x="868" y="176" width="140" height="118" rx="5" fill="#f2f1ec" stroke="#cbc7ba" stroke-opacity="0.85"/>
    <text x="938" y="224" fill="#1a1714" text-anchor="middle">CAD SEQ</text>
    <text x="938" y="248" fill="#57534b" font-size="10.5" text-anchor="middle">command program</text>

    <rect x="1064" y="176" width="88" height="118" rx="5" fill="#f2f1ec" stroke="#cbc7ba" stroke-opacity="0.85"/>
    <text x="1108" y="224" fill="#1a1714" text-anchor="middle">STEP</text>
    <text x="1108" y="248" fill="#57534b" font-size="10.5" text-anchor="middle">B-Rep</text>
  </g>

  <!-- ===================== ARROWS ===================== -->
  <g fill="none" stroke="#b45f2c" stroke-opacity="0.5" stroke-width="1.6">
    <path d="M260,157 L296,157 L296,220 L332,220" marker-end="url(#ar)"/>
    <path d="M260,235 L332,235" marker-end="url(#ar)"/>
    <path d="M260,313 L296,313 L296,250 L332,250" marker-end="url(#ar)"/>
    <path d="M512,235 L584,235" marker-end="url(#ar)"/>
    <path d="M796,235 L868,235" marker-end="url(#ar)"/>
    <path d="M1008,235 L1064,235" marker-end="url(#ar)"/>
  </g>

  <!-- ===================== FOOTNOTE ===================== -->
  <text x="48" y="410" fill="#6f6a60" font-size="11.5">B-Rep geometry is a graph, so the construction history is serialized to a command sequence the LLM emits token by token, then compiled back to a solid.</text>
  <text x="48" y="432" fill="#6f6a60" font-size="11.5">Only the projection layers and LoRA matrices are trained; the 7B backbone and every encoder stay frozen. Trained via a two-stage text-then-multimodal curriculum.</text>
</svg>
